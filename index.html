<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuscan Lands · Hub</title>
<!-- Uma fonte só, seção 8 do plano. Variação por peso, tamanho e cor. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500&family=Sorts+Mill+Goudy:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =====================================================================
   IDENTIDADE VISUAL — seção 8 do plano, com a correção de agosto/26.

   O módulo inteiro é SAGE, interface e documento do cliente. A seção 8
   reservava terracota para "confirmação e fechamento" e mandava o
   documento do cliente sair nessa cor; por instrução da Maria Fernanda
   isso mudou: terracota é do Booking, que é outro módulo. Aqui não entra.
   O terracota continua na paleta, mas sem uso — não reintroduzir.

   Copper é o acento quente: réguas, overlines de documento, marcações.
   Uma fonte só, border-radius zero, sem exceção.
   ===================================================================== */
:root{
  --cream-light:#f6f3f0; --cream:#eae4db; --terracotta:#772f25;
  --sage:#595e49; --brown:#a2564c; --copper:#a56850;
  --ink:#2a2a28; --muted:#6b6860; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;}
/* Interface: peso 400, ferramenta usada horas por dia. */
body{font-family:'Libre Franklin',Helvetica,Arial,sans-serif;font-weight:400;
  font-size:14px;line-height:1.5;color:var(--ink);background:var(--cream-light);
  -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:inherit;font-weight:500;letter-spacing:-.01em;line-height:1.25;}
a{color:var(--sage);}
input,select,textarea,button{font-family:inherit;font-size:13px;font-weight:400;color:var(--ink);}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--cream);background:#fff;}
input:focus,select:focus,textarea:focus{outline:1px solid var(--sage);}
input:disabled,select:disabled,textarea:disabled{background:var(--cream-light);color:var(--muted);}
textarea{resize:vertical;line-height:1.55;}
label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sage);font-weight:500;margin-bottom:4px;}
.btn{font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.18em;
  padding:10px 16px;border:1px solid var(--sage);background:var(--sage);color:#fff;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--sage);}
.btn:disabled{opacity:.45;cursor:default;}
.btn.sm{padding:6px 11px;font-size:10px;letter-spacing:.14em;}
.hide{display:none !important;}

/* ---------- shell ---------- */
.topbar{background:var(--sage);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;}
.topbar .mark{font-size:14px;letter-spacing:.22em;font-weight:500;}
.topbar .sep{opacity:.45;}
.topbar .ctx{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;opacity:.9;}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.topbar .right button{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;padding:5px 11px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;font-weight:500;}
.wrap{max-width:1080px;margin:0 auto;padding:24px 22px 80px;}
/* Navegação agrupada por área, não lista corrida de abas: o plano diz que
   o CRM sofre do problema oposto e não deve ser replicado. */
.layout{display:grid;grid-template-columns:190px 1fr;align-items:start;}
.side{border-right:1px solid var(--cream);min-height:calc(100vh - 44px);padding:18px 0;background:#fff;}
.side .grp{margin-bottom:6px;}
.side .grphead{width:100%;text-align:left;background:none;border:none;cursor:pointer;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);font-weight:500;
  padding:9px 18px;display:flex;align-items:center;gap:7px;}
.side .grphead .caret{font-size:8px;opacity:.6;transition:none;}
.side .item{display:block;padding:8px 18px 8px 26px;font-size:13px;color:var(--ink);
  cursor:pointer;border-left:2px solid transparent;}
.side .item:hover{background:var(--cream-light);}
.side .item.on{border-left-color:var(--sage);color:var(--sage);font-weight:500;background:var(--cream-light);}
.side .item.soon{color:var(--muted);cursor:default;}
.side .item.soon:hover{background:none;}
.side .item .cnt{float:right;font-size:11px;color:var(--muted);}
.side .voltar{padding:0 18px 14px;margin-bottom:6px;border-bottom:1px solid var(--cream);}
.side .voltar .item{padding-left:0;border-left:none;}
.card{background:#fff;border:1px solid var(--cream);padding:20px;}
.card+.card{margin-top:16px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.overline{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.rule{width:30px;height:1px;background:var(--sage);margin:9px 0 16px;}
.muted{color:var(--muted);font-size:12.5px;line-height:1.6;}
.hint{color:var(--muted);font-size:11.5px;line-height:1.55;margin-bottom:12px;}

/* ---------- painel de entrada ----------
   Fundo sage inteiro, caixas em creme. O fio de 1px entre elas vem do
   próprio gap sobre um fundo claro — divisória sem borda, e sem
   arredondar nada. */
.painel{background:var(--sage);min-height:calc(100vh - 44px);padding:38px 22px 70px;}
.painel .dentro{max-width:1080px;margin:0 auto;}
.faltasql{background:var(--cream-light);border-left:3px solid var(--brown);color:var(--ink);
  padding:12px 14px;margin-bottom:18px;font-size:13px;line-height:1.6;}
.faltasql a{color:var(--brown);}
.faltasql ol{margin:8px 0 0 18px;}
.faltasql li{margin-bottom:4px;}
.painel .titulo{color:#fff;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;}
.painel .sub{color:rgba(255,255,255,.72);font-size:13.5px;margin-top:8px;line-height:1.6;}
.painel .risca{width:30px;height:1px;background:var(--copper);margin:14px 0 28px;}
/* Caixas soltas, e não uma grade com fio entre elas: sobrando célula
   vazia na última fileira, a grade mostrava o próprio fundo e virava um
   retângulo morto ao lado do conteúdo. */
.caixas{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;}
.caixa{background:var(--cream-light);border:1px solid rgba(255,255,255,.28);
  padding:20px 19px 22px;text-align:left;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;min-height:136px;}
.caixa:hover{background:#fff;border-color:var(--copper);}
.caixa .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.caixa .n{font-size:32px;font-weight:400;color:var(--ink);margin-top:auto;line-height:1;
  font-variant-numeric:tabular-nums;}
.caixa .n em{font-style:normal;font-size:13px;color:var(--muted);margin-left:7px;}
.caixa .d{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px;}
.caixa.parada{cursor:default;background:transparent;border-style:dashed;
  border-color:rgba(255,255,255,.3);}
.caixa.parada .k,.caixa.parada .d{color:rgba(255,255,255,.6);}
.caixa.parada .n{color:rgba(255,255,255,.45);}
.caixa.parada:hover{background:transparent;border-color:rgba(255,255,255,.3);}
.caixa .alerta{color:var(--brown);font-weight:500;}

/* ---------- login / setup ---------- */
.gate{max-width:380px;margin:12vh auto;padding:0 22px;}
.gate .mark{font-size:19px;letter-spacing:.26em;color:var(--sage);text-align:center;font-weight:500;}
.gate .sub{text-align:center;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);margin:8px 0 28px;}
.msg{font-size:12.5px;padding:9px 11px;border-left:2px solid var(--brown);background:#fbf7f4;
  color:var(--brown);line-height:1.55;}

/* ---------- lista ---------- */
table.list{width:100%;border-collapse:collapse;background:#fff;}
table.list thead th{background:var(--sage);color:#fff;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:500;padding:10px 11px;text-align:left;}
table.list tbody td{padding:10px 11px;border-bottom:1px solid var(--cream);font-size:13px;vertical-align:middle;}
table.list tbody tr:hover{background:var(--cream-light);cursor:pointer;}
.badge{display:inline-block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:500;padding:3px 8px;color:#fff;}
.badge.draft{background:var(--muted);}
.badge.sent{background:var(--copper);}      /* prestes a fechar */
.badge.confirmed{background:var(--sage);}  /* fechado */

/* ---------- editor ---------- */
.editor-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;}
.editor-head h1{font-size:25px;color:var(--sage);font-weight:500;}
.editor-head .who{font-size:13.5px;color:var(--muted);margin-top:3px;}
.editor-head .who:empty{display:none;}
.editor-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.section-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);
  font-weight:500;border-bottom:1px solid var(--cream);padding-bottom:6px;margin-bottom:14px;}
table.rows{width:100%;border-collapse:collapse;}
table.rows th{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);
  font-weight:500;text-align:left;padding:0 7px 5px 0;}
table.rows td{padding:0 7px 7px 0;vertical-align:top;}
table.rows td.x{width:30px;padding-right:0;}
.iconbtn{border:none;background:none;color:var(--brown);cursor:pointer;font-size:15px;padding:7px 4px;}
.totalline{display:flex;justify-content:flex-end;gap:28px;align-items:baseline;margin-top:12px;}
.totalline .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.totalline .amt{font-size:22px;font-weight:400;color:var(--sage);font-variant-numeric:tabular-nums;}
.linkbox{display:flex;gap:7px;align-items:center;margin-top:10px;}
.linkbox input{font-size:12px;color:var(--muted);}
.closing{border-top:1px solid var(--cream);margin-top:18px;padding-top:16px;}
.closing .section-title{color:var(--sage);}

/* ---------- configuração do checkout ---------- */
.cfg-row{display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--cream);}
.cfg-row .name{font-size:13px;}
.cfg-row .name small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.45;}
.cfg-row.fixed .name small{color:var(--sage);}
.cfg-fill{padding:10px 0 4px 0;border-bottom:1px solid var(--cream);}
.cfg-fill .inner{border-left:2px solid var(--copper);padding-left:12px;}
.addbar{display:grid;grid-template-columns:190px 1fr auto auto;gap:7px;align-items:end;
  margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--cream);}
.fld-lbl-en{margin-top:4px;font-size:12px;color:var(--muted);}
.tag{display:inline-block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;padding:2px 6px;border:1px solid var(--copper);color:var(--copper);}

/* =====================================================================
   DOCUMENTO — o que sai da casa. Peso 300, respiração ampla,
   texto justificado. Terracota, porque é o que fecha.
   ===================================================================== */
.doc{max-width:900px;margin:0 auto;background:#fff;padding:46px 50px;
  box-shadow:0 1px 12px rgba(0,0,0,.07);font-weight:300;line-height:1.6;}
.doc .head{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2px solid var(--sage);padding-bottom:18px;}
.doc .brand .logo-img{height:74px;width:auto;display:block;margin-bottom:11px;}
.doc .brand .logo-text{font-size:19px;letter-spacing:.26em;color:var(--sage);font-weight:500;}
.doc .brand .contact{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.65;}
.doc .to{text-align:right;max-width:320px;}
.doc .to .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);font-weight:500;}
.doc .to .val{font-size:16px;margin:2px 0 8px;line-height:1.35;font-weight:400;}
.doc h1.doctitle{font-size:24px;font-weight:500;color:var(--sage);margin:24px 0 4px;letter-spacing:-.01em;}
.doc .meta{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 8px;border:1px solid var(--cream);}
.doc .meta .cell{padding:11px 13px;border-right:1px solid var(--cream);}
.doc .meta .cell:last-child{border-right:none;}
.doc .meta .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);font-weight:500;}
.doc .meta .v{font-size:13.5px;margin-top:4px;font-weight:400;}
.doc .intro{font-size:13.5px;line-height:1.8;text-align:justify;margin:20px 0 4px;white-space:pre-wrap;}
.doc .blocktitle{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);
  font-weight:500;border-bottom:1px solid var(--cream);padding-bottom:6px;margin:26px 0 12px;}
.doc table.svc{width:100%;border-collapse:collapse;margin-top:20px;}
.doc table.svc thead th{background:var(--sage);color:#fff;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:500;padding:10px 12px;text-align:left;}
.doc table.svc thead th.money{text-align:right;width:130px;}
.doc table.svc tbody td{padding:11px 12px;border-bottom:1px solid var(--cream);vertical-align:top;font-size:13.5px;}
.doc table.svc tbody td.money{text-align:right;font-variant-numeric:tabular-nums;}
/* Valor de linha não escolhida: aparece sempre, porque ela pediu que o
   cliente veja o preço de tudo, e apagado, porque não está somando. */
.doc table.svc tbody td.money .fora{color:var(--muted);opacity:.55;}
/* Caixa e bolinha na cor da casa, não no azul do navegador. */
.doc input[type=checkbox],.doc input[type=radio]{accent-color:var(--sage);}
/* Campo interno na tabela de serviços: marcado para não se confundir
   com o que o cliente lê. */
input.interno{border-left:2px solid var(--brown);}
/* Campo de conferir texto tem de caber o texto. Antes cabia uma linha e
   meia, e revisar uma descrição de villa virava rolar uma janelinha. */
/* Campo de texto ocupa a linha inteira e cresce com o conteúdo: dois
   idiomas lado a lado davam meia largura cada, e ela não conseguia ler
   nem revisar o que tinha digitado. Agora escolhe o idioma no topo. */
.card textarea{width:100%;min-height:100px;font-size:13.5px;line-height:1.65;resize:vertical;}
.card textarea[rows="14"]{min-height:380px;}
.card textarea[rows="8"]{min-height:230px;}
.card textarea[rows="6"]{min-height:170px;}
.card textarea[rows="4"]{min-height:120px;}
.apres-box textarea{min-height:100px;}
#qi-host textarea{min-height:110px;}
.idioma-sw{display:inline-flex;border:1px solid var(--sage);margin-right:10px;}
.idioma-sw button{background:none;border:none;color:var(--sage);font-family:inherit;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  padding:8px 14px;cursor:pointer;}
.idioma-sw button.on{background:var(--sage);color:#fff;}
.rotulos table.rows td.ondelbl{font-size:11px;color:var(--muted);vertical-align:middle;letter-spacing:.04em;}
.buscacat{margin-top:10px;border:1px solid var(--cream);padding:10px 12px;background:var(--cream-light);}
.cat-res{margin-top:6px;}
.cat-item{padding:8px 10px;border-bottom:1px solid var(--cream);cursor:pointer;background:#fff;}
.cat-item:hover{background:var(--cream);}
.apres-box{border-left:2px solid var(--sage);padding-left:10px;margin-top:8px;}
.item-bloco{border:1px solid var(--cream);padding:16px 18px;margin-bottom:14px;background:#fff;}
.item-topo .mover{display:flex;align-items:center;gap:2px;align-self:center;}
.item-topo{display:grid;grid-template-columns:110px 100px 1fr 1fr 1fr 130px 82px 92px;gap:10px;
  align-items:end;padding-bottom:14px;margin-bottom:12px;border-bottom:1px solid var(--cream);}
.item-topo .ck{text-align:center;}
.item-topo .ck input{width:auto;}
.item-topo .iconbtn{align-self:center;}
@media screen and (max-width:1100px){ .item-topo{grid-template-columns:1fr 1fr 1fr;} }
/* Par de linhas PT/EN na tabela de seções: a segunda não repete a
   borda, para as duas lerem como um bloco só. */
.sec-thumb{display:block;width:100%;height:42px;object-fit:cover;margin-top:5px;}
.cat-capa{display:block;width:100%;max-width:340px;height:110px;object-fit:cover;margin-top:6px;}
table.rows td.idio{font-size:9px;letter-spacing:.18em;color:var(--sage);font-weight:500;
  vertical-align:middle;padding-right:6px;}
table.rows tr.par td{border-top:none;padding-top:0;}
.doc table.svc tbody tr:nth-child(even){background:var(--cream-light);}
.doc .date-cell{font-weight:500;color:var(--sage);white-space:nowrap;}
.doc .svc-title{font-weight:400;}
.doc .svc-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6;
  text-align:justify;hyphens:none;-webkit-hyphens:none;}
/* fmtDoc devolve um <p> por linha: aqui eles são linhas do mesmo bloco,
   e não parágrafos soltos. */
.doc .svc-sub p{margin:0 0 3px;}
.doc .svc-sub ul{margin:2px 0 3px;padding-left:15px;}
.ap-desc p{margin:0 0 6px;}
.ap-desc ul{margin:2px 0 6px;padding-left:16px;}
.ap-desc strong,.doc .svc-sub strong{font-weight:500;}
.doc .total-row{display:flex;justify-content:flex-end;margin-top:18px;}
.doc .total-box{background:var(--cream);padding:14px 26px;display:flex;gap:36px;align-items:baseline;}
.doc .total-box .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.doc .total-box .amt{font-size:24px;color:var(--sage);font-weight:400;font-variant-numeric:tabular-nums;}
.doc table.pay{width:100%;border-collapse:collapse;margin-top:12px;}
.doc table.pay th{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);
  font-weight:500;text-align:left;padding:7px 9px;border-bottom:1px solid var(--cream);}
.doc table.pay td{padding:8px 9px;border-bottom:1px solid var(--cream);font-size:13px;}
.doc table.pay td.money{text-align:right;font-variant-numeric:tabular-nums;}
/* Condições numa página só delas, como na proposta. Na tela vira um
   bloco separado por régua; no papel, começa folha nova. */
.doc .pagina-nova{margin-top:34px;border-top:1px solid var(--cream);padding-top:24px;}
/* Não inclusos sai colado nas tabelas, na mesma folha se couber: é
   resposta ao que aquela opção contém, e não condição geral da casa. */
.doc .naoinc{margin-top:26px;}
/* O resumo fecha a escolha: sai em folha própria, com só o que o
   cliente marcou. É a página que ela confere antes de gerar a order. */
.doc .resumo{margin-top:30px;border-top:1px solid var(--cream);padding-top:22px;}
.doc .resumo .mais{font-size:12px;color:var(--copper);margin-top:3px;}
/* =====================================================================
   PROPOSTA APRESENTADA
   Duas colunas: índice fixo à esquerda, conteúdo rolando à direita, e
   dentro de cada seção a foto grande com o título por cima. A cara é da
   casa — sage, Libre Franklin, canto vivo — e não a da referência.
   ===================================================================== */
.apres{display:grid;grid-template-columns:238px 1fr;min-height:100vh;background:var(--cream-light);}
/* Na capa o menu não existe: a primeira tela é só a imagem, o nome e o
   convite para entrar. */
.apres.na-capa{grid-template-columns:1fr;}
.apres.na-capa .ap-indice{display:none;}
.ap-indice{position:sticky;top:0;align-self:start;height:100vh;background:var(--sage);
  color:#fff;padding:26px 20px;display:flex;flex-direction:column;gap:16px;}
.ap-logo{width:172px;max-width:100%;display:block;}
/* A foto da capa é escolhida por ela e pode ser clara justo onde o logo
   cai. A sombra segura a leitura sem precisar escurecer a imagem toda. */
.ap-logo-capa{width:240px;max-width:52vw;display:block;
  filter:drop-shadow(0 1px 10px rgba(42,42,40,.65));}
/* Proposta assinada pela agência: o logo é o dela, e logo escuro some
   na foto — a sombra não salva. Quem salva é o fundo branco atrás, que
   ela liga no editor caso a caso. Como todo fundo em CSS, ele só sai no
   papel com "gráficos de fundo" marcado; no arquivo que o botão Baixar
   monta ele sai sempre, porque lá o fundo é pedido pela função. */
.ap-logo-capa.com-fundo,.ap-logo.com-fundo{background:#fff;padding:12px 16px;
  filter:none;box-sizing:content-box;}
/* A sombra é do logo BRANCO da Tuscan Lands sobre foto: sem ela, branco
   em foto clara some. O logo da agência é arquivo dela, quase sempre
   escuro, e a sombra só o suja. Quem precisa de contraste ali tem o
   fundo branco, que é escolha dela. */
.ap-logo-capa.da-agencia{filter:none;}
.ap-capa-in h1,.ap-tag,.ap-datas,.ap-ref{text-shadow:0 1px 12px rgba(42,42,40,.5);}
.ap-marca{font-size:12px;letter-spacing:.24em;font-weight:500;opacity:.95;}
.ap-indice nav{display:flex;flex-direction:column;gap:2px;overflow:auto;}
.ap-indice nav button{color:rgba(255,255,255,.82);font-size:12.5px;text-align:left;
  padding:7px 9px;border:none;border-left:2px solid transparent;line-height:1.35;
  background:none;cursor:pointer;font-family:inherit;width:100%;}
.ap-indice nav button:hover{color:#fff;background:rgba(255,255,255,.06);}
.ap-indice nav button.on{color:#fff;border-left-color:#fff;background:rgba(255,255,255,.1);}

/* Avançar e voltar: presentes em toda etapa, para o cliente percorrer a
   proposta inteira sem usar o botão do navegador. */
.ap-nav{margin-top:30px;display:flex;gap:10px;justify-content:space-between;
  border-top:1px solid var(--cream);padding-top:18px;}
.ap-btn{background:var(--sage);color:#fff;border:1px solid var(--sage);padding:10px 20px;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;cursor:pointer;
  font-family:inherit;}
.ap-btn.ghost{background:none;color:var(--sage);}
.ap-cta{margin-top:26px;background:none;border:1px solid rgba(255,255,255,.75);color:#fff;
  padding:12px 24px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
  cursor:pointer;font-family:inherit;}
.ap-cta:hover{background:rgba(255,255,255,.15);}
.pagto{border-left:2px solid var(--sage);padding-left:13px;margin-top:4px;}
.pagto .check{margin:6px 0;}
.pagto input[type=radio]{accent-color:var(--sage);width:auto;}
.ap-aviso{margin-top:24px;border-left:2px solid var(--copper);padding-left:13px;
  font-size:12.5px;font-weight:300;line-height:1.65;color:var(--muted);}
/* Regra de classe simples perde para .ap-sec por vir antes no arquivo:
   a contracapa precisa das duas classes para sair da grade de duas
   colunas e ocupar a folha inteira. */
.ap-sec.ap-contracapa{display:block;background:var(--cream-light);}
.ap-sec.ap-contracapa .ap-lista{max-width:620px;margin:0 auto;text-align:center;padding:70px 30px;min-height:100vh;}
.ap-logo-fim{width:190px;margin:0 auto 32px;display:block;}
/* Contracapa com foto: mesmo tratamento da capa — folha inteira, mesma
   camada escura por cima, texto e logo em branco. É o fechamento da
   proposta, e ao lado de uma capa de foto cheia a versão em creme
   parecia que o documento tinha acabado antes da hora. */
.ap-sec.ap-contracapa.com-foto{background:var(--sage);position:relative;overflow:hidden;}
.ap-sec.ap-contracapa.com-foto::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(to bottom,rgba(42,42,40,.62),rgba(42,42,40,.45) 45%,rgba(42,42,40,.75));}
.ap-sec.ap-contracapa.com-foto .ap-lista{position:relative;z-index:2;background:none;
  max-width:none;padding:70px 40px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}
.ap-sec.ap-contracapa.com-foto .ap-back{max-width:620px;color:#fff;
  text-shadow:0 1px 12px rgba(42,42,40,.5);}
.ap-sec.ap-contracapa.com-foto .ap-back strong{color:#fff;opacity:.85;}
.ap-sec.ap-contracapa.com-foto .ap-nav{border-top-color:rgba(255,255,255,.35);}
.ap-sec.ap-contracapa.com-foto .ap-btn{border-color:rgba(255,255,255,.6);color:#fff;background:none;}
.ap-back{font-size:14px;font-weight:300;line-height:1.9;color:var(--ink);}
.ap-back strong{display:block;margin-top:20px;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--copper);font-weight:500;}
.ap-back p{margin-bottom:2px;}
.ap-rodape-idx{margin-top:auto;}
.ap-tot{border-top:1px solid rgba(255,255,255,.25);padding-top:12px;
  display:flex;flex-direction:column;gap:3px;}
.ap-tot span{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.8;}
.ap-tot b{font-size:20px;font-weight:400;font-variant-numeric:tabular-nums;}
.ap-baixar{margin-top:14px;width:100%;background:none;border:1px solid rgba(255,255,255,.45);
  color:#fff;padding:9px 12px;font-family:inherit;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;font-weight:500;cursor:pointer;}
.ap-baixar:hover{background:rgba(255,255,255,.12);}

.ap-capa{min-height:100vh;background:var(--sage);position:relative;overflow:hidden;
  display:flex;align-items:flex-end;}
.ap-capa::after{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(42,42,40,.72),rgba(42,42,40,.15) 55%,rgba(42,42,40,.35));}
.ap-capa-in{position:relative;z-index:2;color:#fff;padding:48px 56px;max-width:820px;}
.ap-capa-topo{position:absolute;top:0;left:0;z-index:2;color:#fff;padding:44px 56px;}
.ap-marca-capa{font-size:13px;letter-spacing:.26em;font-weight:500;margin-bottom:22px;}
.ap-tag{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;
  opacity:.9;margin-bottom:10px;}
/* Sorts Mill Goudy volta, e SÓ nas linhas de exibição do documento do
   cliente — capa, chamada de folha, título de faixa, nome da
   hospedagem. Instrução dela em agosto/26: a serifada dá o ar de
   sonho que a Libre Franklin não dá. Corpo de texto, rótulo, tabela,
   overline, botão e a interface inteira continuam em Libre Franklin:
   serifada em texto miúdo cansa, e a interface é ferramenta.
   A família só tem peso 400 — daí o 400 no lugar do 300 daqui. */
.apres .ap-capa-in h1,.apres .ap-foto-txt h2,.apres .ap-sobre-txt strong,
.apres .ap-nome{font-family:"Sorts Mill Goudy",Georgia,"Times New Roman",serif;
  font-weight:400;}
.ap-capa-in h1{font-size:50px;font-weight:300;line-height:1.08;letter-spacing:-.01em;}
.ap-datas{font-size:16px;font-weight:300;margin-top:10px;opacity:.95;}
.ap-ref{font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-top:16px;opacity:.8;}

.ap-welcome{background:#fff;padding:52px 56px;}
.ap-welcome-in{max-width:660px;font-weight:300;font-size:15px;line-height:1.75;color:var(--ink);}
.ap-ey{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--copper);
  font-weight:500;margin-bottom:10px;}
/* Sobre a foto, copper não se lê — o número da proposta sumia. Ali o
   overline é branco, como o resto do texto daquela camada. */
.ap-foto-txt .ap-ey{color:#fff;font-size:11px;opacity:.9;
  text-shadow:0 1px 10px rgba(42,42,40,.5);}

/* Unidades: do que a hospedagem é feita, cada uma com o seu valor. */
.ap-unidades{margin-top:12px;border-top:1px solid var(--cream);padding-top:10px;}
.ap-unidade{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  font-size:13px;font-weight:300;padding:3px 0;}
.ap-unidade b{font-weight:400;color:var(--sage);white-space:nowrap;
  font-variant-numeric:tabular-nums;}
.ap-unidade em{font-style:normal;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--copper);margin-left:6px;}
.unid-cli{margin:8px 0 0;padding-left:14px;border-left:1px solid var(--cream);}
.unid{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  font-size:12.5px;font-weight:300;padding:2px 0;margin:0 0 2px;}
/* O rótulo tem de ocupar a linha: sem isto o span encolhe, o texto cai
   para baixo do quadradinho e o valor fica solto no alto. */
.unid > span{flex:1 1 auto;display:flex;gap:8px;align-items:baseline;min-width:0;}
.unid b{font-weight:400;white-space:nowrap;font-variant-numeric:tabular-nums;}
.unid.fora{color:var(--muted);}
.unid.fora b{color:var(--muted);}
.unid em{font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--copper);margin-left:6px;}
/* Incluso e estrutura vêm em parágrafos: uma informação por linha, que
   é como ela escreve. Amontoadas num bloco só ninguém acha nada. */
.ap-estrutura p{margin:0 0 3px;}
.ap-estrutura ul{margin:0;padding-left:16px;}
.ap-estrutura li{margin-bottom:2px;}

.ap-sec{display:grid;grid-template-columns:38% 1fr;align-items:start;border-top:1px solid var(--cream);}
/* Folha sem faixa de foto: a coluna da foto não existe, e sem isto ela
   continuaria reservada — sobrava um retângulo escuro do lado do texto. */
.ap-sec.sem-foto{grid-template-columns:1fr;}
/* A folha do convite leva a foto no ALTO, e não na coluna lateral. A
   peça que ela escolheu é deitada, e coluna de 38% por folha inteira
   recorta uma foto 4:3 até sobrar o meio dela. Faixa no alto é o mesmo
   corte que essa folha já ganha no papel e no celular — o desenho fica
   um só nas três saídas. `position:relative` é obrigatório aqui: em
   static o <img> absoluto mede a tela, e não a faixa. */
.ap-sec.faixa-topo{grid-template-columns:1fr;}
.ap-sec.faixa-topo .ap-foto{position:relative;min-height:0;height:38vh;max-height:400px;
  align-items:flex-end;}
/* A camada escura existe para segurar texto branco sobre a foto. Sem
   texto por cima ela só suja a imagem — e nesta folha o título é a
   chamada, que está no texto. */
.ap-foto.sem-tarja::after{display:none;}
/* A foto das peças grandes é <img> e não fundo em CSS: fundo depende da
   caixinha "gráficos de fundo" da caixa de impressão, e por isso a capa
   e a contracapa saíam vazias no PDF. <img> sai sempre. */
.ap-fundo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  z-index:0;display:block;}
.ap-foto{position:sticky;top:0;min-height:100vh;background:var(--sage);
  display:flex;align-items:center;position:-webkit-sticky;overflow:hidden;}
.ap-foto::after{content:"";position:absolute;inset:0;background:rgba(42,42,40,.42);z-index:1;}
.ap-foto-txt{position:relative;z-index:2;color:#fff;padding:36px 34px;}
.ap-foto-txt h2{font-size:33px;font-weight:300;line-height:1.12;letter-spacing:-.005em;}
.ap-note{font-size:13px;font-weight:300;margin-top:10px;opacity:.9;line-height:1.5;}
.ap-lista{padding:44px 46px;display:flex;flex-direction:column;gap:26px;background:#fff;min-height:100vh;}
.ap-lista.larga{padding:34px 40px;}

.ap-card{border:1px solid var(--cream);background:#fff;}
.ap-card.on{border-color:var(--sage);box-shadow:inset 3px 0 0 var(--sage);}
.ap-fotos{display:grid;gap:2px;}
.ap-fotos.f1{grid-template-columns:1fr;}
.ap-fotos.f2{grid-template-columns:1fr 1fr;}
.ap-fotos.f3{grid-template-columns:2fr 1fr 1fr;}
.ap-fotos img{width:100%;height:190px;object-fit:cover;display:block;}
.ap-corpo{padding:20px 22px;}
.ap-topo{display:flex;justify-content:space-between;align-items:baseline;gap:18px;}
.ap-data{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);
  font-weight:500;margin-bottom:5px;}
.ap-nome{font-size:20px;font-weight:400;line-height:1.28;}
.ap-quarto{font-size:12px;color:var(--copper);letter-spacing:.06em;margin-top:4px;
  white-space:pre-line;}
.ap-preco{font-size:19px;font-weight:400;color:var(--sage);white-space:nowrap;
  font-variant-numeric:tabular-nums;}
.ap-desc{font-size:13.5px;font-weight:300;line-height:1.65;margin-top:12px;color:var(--ink);}
/* Justificado em toda a proposta, na tela e no papel — instrução dela.
   SEM HIFENIZAÇÃO, em lugar nenhum. Foi instrução dela em agosto/26,
   depois de ver "small mo-ments" partido na folha do convite: palavra
   quebrada no meio fica feia, e a palavra inteira desce para a linha
   de baixo. Antes a hifenização estava ligada aqui, para justificar sem
   abrir rios de espaço em coluna estreita — o rio é o preço, e é ela
   que escolhe. */
.ap-desc,.ap-estrutura,.ap-back,.condicoes,.ap-sobre-txt p{
  text-align:justify;hyphens:none;-webkit-hyphens:none;}
/* A contracapa é bloco de contato centrado, não texto corrido. */
.ap-sec.ap-contracapa .ap-back{text-align:center;hyphens:none;}
/* TÍTULO NÃO SE PARTE. Justificar e hifenizar é para texto corrido:
   numa linha de título a palavra quebrada no meio salta aos olhos, e
   foi o que ela viu no "Sobre nós". Título, chamada e rótulo saem
   sempre inteiros, alinhados à esquerda. */
.ap-capa-in h1,.ap-tag,.ap-datas,.ap-ref,.ap-marca,.ap-marca-capa,
.ap-foto-txt h2,.ap-note,.ap-nome,.ap-quarto,.ap-data,.ap-ey,
.ap-sobre-txt strong,.ap-estrutura .k,.ap-cred .k,.ap-extras .k,
.doc .blocktitle,.doc .svc-title,.doc .overline,.doc h1.doctitle,
.ap-indice nav button,.ap-unidade,.unid,.section-title,label,.overline{
  hyphens:none;-webkit-hyphens:none;text-align:left;}
/* O único título centrado é o da contracapa, que é bloco de contato. */
.ap-sec.ap-contracapa .ap-back strong{text-align:center;}
.ap-link{margin-top:10px;font-size:12.5px;}
.ap-link a{color:var(--sage);}
.ap-anexos{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
.ap-anexo{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;
  border:1px solid var(--copper);color:var(--copper);padding:5px 10px;text-decoration:none;}
.ap-extras{margin-top:14px;border-left:2px solid var(--copper);padding-left:12px;}
.ap-estrutura{margin-top:12px;font-size:12.5px;font-weight:300;line-height:1.6;
  color:var(--muted);border-top:1px solid var(--cream);padding-top:11px;}
.ap-estrutura .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);
  font-weight:500;margin-bottom:4px;}
.ap-extra{font-size:12.5px;font-weight:300;line-height:1.6;color:var(--ink);}
.ap-extra span{color:var(--muted);}
.ap-foto-fim{background:var(--sage);}
.ap-foto-sobre{background:var(--ink);}
.ap-sobre-txt{font-size:15px;font-weight:300;line-height:1.8;color:var(--ink);max-width:620px;}
.ap-sobre-txt p{text-align:justify;margin-bottom:14px;}
.ap-sobre-txt strong{display:block;font-size:27px;font-weight:300;line-height:1.22;
  color:var(--sage);text-align:left;margin-bottom:16px;}
.svc-qtd{font-size:12px;color:var(--muted);margin-top:3px;}
.ap-qtd{display:block;font-size:11.5px;font-weight:300;color:var(--muted);
  letter-spacing:0;margin-top:3px;}
.qtd-box{display:grid;grid-template-columns:1fr auto 1.4fr;align-items:center;gap:4px;}
.qtd-box span{color:var(--muted);font-size:12px;}
.qtd-box input{padding:5px 6px;font-size:12.5px;}
.ap-cred{margin-top:26px;border-left:2px solid var(--copper);padding-left:14px;}
.ap-cred .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);
  font-weight:500;margin-bottom:7px;}
.ap-cred ul{margin:0 0 0 16px;}
.ap-cred li{font-size:13px;font-weight:300;line-height:1.7;color:var(--muted);}
.ap-extras .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);
  font-weight:500;margin-bottom:6px;}
.ap-escolha{margin-top:16px;border-top:1px solid var(--cream);padding-top:13px;
  display:flex;align-items:center;gap:9px;}
.ap-escolha input{accent-color:var(--sage);width:auto;}
.ap-escolha label{font-size:12.5px;color:var(--ink);cursor:pointer;}
table.svc.ap-dias ul{margin:0 0 0 16px;}
table.svc.ap-dias li{font-size:13px;line-height:1.6;}

/* "screen and": uma folha A4 a 96dpi tem 794px de largura, e sem isto
   TODA a versão de celular entrava na impressão — a fita de fotos do
   hotel virava uma coluna e comia meia folha, e a tabela de serviços
   saía empilhada em blocos. Era boa parte da bagunça no PDF. */
@media screen and (max-width:900px){
  .apres,.apres.na-capa{grid-template-columns:1fr;}
  .ap-capa{min-height:88vh;}
  .ap-topo{flex-direction:column;align-items:flex-start;gap:6px;}
  .ap-preco{font-size:22px;}
  .ap-fotos.f2,.ap-fotos.f3{grid-template-columns:1fr;}
  .ap-fotos img{height:210px;}
  .ap-nav{flex-direction:column;}
  .ap-btn{width:100%;}

  .doc table.svc,.doc table.svc thead,.doc table.svc tbody,.doc table.svc tr{display:block;}
  .doc table.svc thead{display:none;}
  .doc table.svc td{display:block;width:auto !important;text-align:left !important;}
  /* No celular o índice era uma tela inteira de menu antes de cada
     etapa — a proposta começava abaixo da dobra em todas elas. Aqui ele
     vira uma faixa: logo pequeno, as etapas numa fita que corre para o
     lado, e o total com o botão de baixar na mesma linha. */
  /* No celular não há menu: a proposta se navega pelas flechas de
     avançar e voltar. Fica só o logo e o botão de baixar — menu, lista
     de etapas e total ocupavam a tela inteira antes de cada etapa. */
  .ap-indice{position:static;height:auto;padding:11px 14px;gap:10px;overflow:hidden;
    flex-direction:row;align-items:center;justify-content:space-between;}
  .ap-logo{width:130px;}
  .ap-indice nav,.ap-tot{display:none;}
  .ap-rodape-idx{margin-top:0;display:flex;align-items:center;}
  /* No celular o índice vira uma faixa horizontal: o botão de baixar
     entra na faixa, ao lado do total, e não ocupa a linha inteira. */
  .ap-baixar{margin:0 0 0 12px;width:auto;padding:7px 12px;}
  .ap-sec{grid-template-columns:1fr;}
  /* relative, e não static: a foto é um <img> absoluto dentro da faixa,
     e sem ancestral posicionado ele mede 100% da TELA — a foto saía com
     844px de altura numa faixa de 230, passando por cima do resto,
     enquanto a camada escura ficava do tamanho certo. */
  .ap-foto{position:relative;min-height:230px;}
  .ap-lista{padding:26px 20px;min-height:0;}
  .ap-capa-in{padding:30px 24px;}
  /* No computador o logo maior dá presença; em 390px de tela o mesmo
     tamanho vira metade da largura e engole a capa. */
  .ap-capa-topo{padding:26px 24px;}
  .ap-logo-capa{width:190px;max-width:46vw;}
  .ap-capa-in h1{font-size:32px;}
}

/* Bloco fiscal é endereço, não texto corrido: linhas juntas e sem
   partir de uma folha para a outra. */
/* O relatório de comissão sai em copper, não em sage. É outro documento
   e vai para outra pessoa — a agência, não o cliente — e com a mesma
   cara do pedido de serviços os dois se confundem na caixa de entrada
   dela. Copper já é o acento quente da paleta; terracota continua sendo
   do Booking e não entra aqui. */
.doc.com h1.doctitle{color:var(--copper);}
.doc.com .head{border-bottom-color:var(--copper);}
.doc.com .brand .logo-text{color:var(--copper);}
.doc.com .to .lbl,.doc.com .meta .k,.doc.com .blocktitle{color:var(--copper);}
.doc.com table.svc thead th{background:var(--copper);}
.doc.com .date-cell{color:var(--copper);}
.doc.com .total-box{background:#f3e9e4;}
.doc.com .total-box .lbl,.doc.com .total-box .amt{color:var(--copper);}
.doc.com table.svc tfoot td{border-top:1.5px solid var(--copper);font-weight:500;
  padding-top:9px;color:var(--ink);}
.doc.com .proxpag{margin-top:10px;font-size:11.5px;color:var(--copper);
  border-left:2px solid var(--copper);padding-left:10px;line-height:1.4;}
/* O relatório de comissão é papel de trabalho, não peça de venda: cabe
   apertar para o total fechar na mesma folha da tabela. Cada folga
   cortada aqui é uma linha de serviço a mais que entra antes de virar
   a página. */
.doc.com h1.doctitle{margin:14px 0 3px;font-size:21px;}
.doc.com .intro{margin:5px 0 12px;font-size:12.5px;}
.doc.com .meta{margin:0 0 12px;}
.doc.com .meta .cell{padding:8px 11px;}
.doc.com .meta .v{font-size:12.5px;}
.doc.com table.svc tbody td{padding:7px 11px;font-size:12px;}
.doc.com table.svc thead th{padding:6px 11px;font-size:9.5px;}
.doc.com .svc-title{line-height:1.42;font-size:12px;}
.doc.com table.svc td.inclui{font-size:11px;line-height:1.42;}
.doc.com table.svc tfoot td{padding-top:8px;font-size:12px;}
.doc.com .total-row{margin-top:10px;}
.doc.com .total-box{padding:11px 22px;}
.doc.com .total-box .amt{font-size:21px;}
/* Só existe enquanto a medida é tirada: reproduz na tela a largura que
   o documento tem no papel. */
.doc .dadosnf{break-inside:avoid;}
/* Coluna que explica a alíquota: texto de apoio, não título de serviço. */

     tomava uma folha só para ela, o card do hotel começava na seguinte
     e terminava numa terceira, e o "Incluso" ficava partido no meio. É
     o que ela chamou de bagunçado.

     O desenho agora é: capa em folha cheia, uma folha por hospedagem
     com a faixa da foto e o card juntos, uma folha para os serviços,
     uma para as condições e a contracapa em folha cheia. Nada de
     informação some — o que muda é o corpo do texto, menor no papel do

  .ap-indice{display:none !important;}
  .apres{display:block;background:#fff;}
  .ap-passo{display:block !important;}
  .ap-nav,.ap-cta,.ap-baixar{display:none !important;}

     inteira parecia proteger, mas o efeito é o contrário: quando a
     etapa não cabe, o navegador a joga adiante e deixa a folha
     anterior em branco. O que segura é o miolo — a fita de fotos, o
     bloco do Incluso, a linha da tabela —, cada um inteiro na sua
     folha. Assim uma hospedagem com texto muito longo continua na
     folha seguinte em vez de sair cortada no meio de uma linha. */
  .ap-capa-sec,.ap-sec{break-before:page;}
  .ap-capa-sec:first-child{break-before:auto;}

  .ap-fotos,.ap-unidades,.ap-estrutura,.ap-topo{break-inside:avoid;}

  .ap-capa{min-height:0;height:295mm;padding:0;display:flex;align-items:flex-end;}
  .ap-capa-in{padding:24mm 20mm;max-width:none;}
  .ap-capa-in h1{font-size:30pt;}
  .ap-datas{font-size:12pt;}
  .ap-capa-topo{padding:18mm 20mm;}
  .ap-logo-capa{width:185px;filter:none;}

  /* No papel a contracapa não é flex: contêiner flex com altura de
     folha inteira fragmenta, e o Chrome abria uma folha em branco
     antes dela. Bloco com respiro em cima faz o mesmo desenho e sai
     numa folha só. */
  .ap-sec.ap-contracapa .ap-lista,
  .ap-sec.ap-contracapa.com-foto .ap-lista{display:block;height:295mm;min-height:0;
    max-width:none;padding:92mm 20mm 0;text-align:center;}
  .ap-sec.ap-contracapa .ap-back{font-size:10.5pt;line-height:1.9;max-width:620px;margin:0 auto;}

  /* A MARGEM DA FOLHA É PADDING DA ETAPA.

  .doc .terms h3,.doc .blocktitle{break-after:avoid;}
  .doc .terms li,.doc table.data tr{break-inside:avoid;}
  .doc table.svc thead{display:table-header-group;}
}

    .replace(/__([^_]+)__/g, "<u>$1</u>");
  linhas.forEach(l=>{
    const li = /^\s*[-•]\s+(.*)$/.exec(l);
    if(li){
      if(!lista){ out += "<ul>"; lista = true; }
      out += "<li>"+forte(li[1])+"</li>";
    } else {
      if(lista){ out += "</ul>"; lista = false; }
      if(l.trim()==="") out += "";
      else out += "<p>"+forte(l)+"</p>";
    }
  });
  if(lista) out += "</ul>";
  return out;
}
/* O endereço dos termos é o mesmo para todas as vendas e serve as duas
   línguas. O campo da order existe para a exceção; quando está vazio,
   vale o padrão. Assim nenhuma order antiga fica com as palavras
   sublinhadas e sem link atrás. */
const termsHref = o => ((o && o.terms_url) || DEFAULT_TERMS_URL || "").trim();

/* Monta o link do cliente. Devolve null quando não há endereço público
   possível — arquivo aberto direto do computador, por exemplo, que geraria
   um caminho que só funciona na máquina de quem copiou. */
function clientLink(token){
  let base = (PUBLIC_BASE_URL||"").trim();
  if(!base){
    if(location.protocol === "file:") return null;
    base = location.origin + location.pathname;
  }
  base = base.replace(/#.*$/,"").trim();
  if(!/\/$|\.html?$/i.test(base)) base += "/";
  return base + "#/confirm/" + token;
}

function route(){ return (location.hash||"").replace(/^#\/?/,""); }

async function boot(){
  const r = route();

const RAW = "https://raw.githubusercontent.com/tuscanlands2026/tl-hub/main/db/migrations/";
let FALTAM = [];
async function conferirBanco(){
  const {data, error} = await sb.from("ops_migrations").select("id");
  if(error){ FALTAM = MIGRACOES; return; }          // nem a tabela existe: falta tudo
  const feitas = (data||[]).map(r=>r.id);
  FALTAM = MIGRACOES.filter(m=>!feitas.includes(m.id));
}
function avisoSQL(){
  if(!FALTAM.length) return "";
  return `<div class="faltasql">
    <b>Falta rodar ${FALTAM.length===1?"uma atualização":FALTAM.length+" atualizações"} no banco.</b>
    Enquanto isso, as telas que dependem dela dão erro ao gravar.
    Abra cada arquivo, copie e cole no SQL Editor do Supabase, na ordem:
    <ol>${FALTAM.map(m=>`<li><a href="${RAW}${m.arq}" target="_blank" rel="noopener">${m.arq}</a>
      — ${m.oque}</li>`).join("")}</ol>
  </div>`;
}

/* Erro de coluna que não existe é sempre a mesma causa: falta rodar a
   SQL. Traduzir aqui evita "Failed to fetch" e "schema cache" na cara
   de quem não programa. */
function explicar(err){
  const m = (err && err.message) || String(err||"");
  if(/does not exist|schema cache|Could not find/i.test(m))
    return "O banco ainda não tem os campos que esta tela grava. Volte ao Painel: o aviso "
         + "lá em cima diz qual arquivo de db/migrations falta rodar no SQL Editor. "
         + "Depois recarregue com Ctrl+Shift+R.\n\nDetalhe técnico: " + m;
  if(/Failed to fetch|NetworkError|fetch/i.test(m))
    return "O hub não conseguiu falar com o Supabase agora. Confira a conexão e tente de novo. "
         + "Se persistir, pode ser que falte rodar a última SQL.\n\nDetalhe técnico: " + m;
  return m;
}

async function newProposal(){
  const v = 1 + PROPS.reduce((m,p)=>Math.max(m,p.version||0),0);
  if(FALTAM.length) return alert(explicar({message:"migração pendente: does not exist"}));
  // Nasce já com as condições da casa e com as duas seções de sempre —
  // hospedagem e serviços terrestres. Proposta em branco obrigaria a
  // redigitar a mesma coisa toda vez, que é o que ela pediu para acabar.
  const pad = await lerPadrao();
  const {data,error} = await sb.from("ops_proposals").insert({
    opportunity_id:OPP.id, version:v, title:OPP.title, lang:OPP.lang,
    pax_summary:(BRIEF&&BRIEF.pax_summary)||null,
    travel_window:(BRIEF&&BRIEF.travel_window)||null,
    terms_url: DEFAULT_TERMS_URL,

async function saveOpportunity(){
  const btn = el("op-save");
  const titulo = el("p-title").value.trim();
  if(!titulo) return alert("O título é obrigatório.");
  btn.disabled = true; btn.textContent = "Salvando…";

  const outcome = el("p-outcome").value;
  const patch = {
    title:titulo, crm_code:el("p-crm").value.trim()||null, lang:el("p-lang").value,
    agency:el("p-agency").value.trim(), agency_contact:el("p-contact").value.trim(),
    final_client:el("p-client").value.trim(), outcome,
    lost_reason: outcome==="lost" ? (el("p-lost").value.trim()||null) : null,
    internal_notes: el("p-notes").value,
    // Fechou agora, marca a data; reabriu, limpa. Data de fechamento em
    // oportunidade aberta seria um fato que deixou de ser verdade.
    closed_at: outcome==="open" ? null : (OPP.closed_at || new Date().toISOString())
  };
  let e1=null, e2=null, bd=null;
  try{
  ({error:e1} = await sb.from("ops_opportunities").update(patch).eq("id", OPP.id));

  const bp = {
    opportunity_id: OPP.id,
    travel_window: el("b-window").value.trim(), pax_summary: el("b-pax").value.trim(),
    source: el("b-source").value.trim(), scope: el("b-scope").value,
    budget_note: el("b-budget").value, constraints_note: el("b-constraints").value,
    completed_at: el("b-done").value==="sim"
      ? ((BRIEF && BRIEF.completed_at) || new Date().toISOString()) : null,
    updated_at: new Date().toISOString()
  };
  // upsert pela oportunidade: é uma por oportunidade, e a coluna é unique.
  ({data:bd, error:e2} = await sb.from("ops_briefings")
    .upsert(bp, {onConflict:"opportunity_id"}).select().single());
  }catch(ex){ e1 = ex; }

  // O botão volta ao normal mesmo quando a gravação falha: preso em
  // "Salvando…" ele diz que ainda está tentando, e não está.
  btn.disabled = false; btn.textContent = "Salvar";
  const err = e1||e2;
  if(err) return alert(explicar(err));
  Object.assign(OPP, patch);
  BRIEF = bd;
  if(el("op-who")) el("op-who").textContent = quemE(OPP);
  btn.textContent = "Salvo";
  setTimeout(()=>btn.textContent="Salvar", 1600);
}

/* Uma tabela por bloco, com subtotal no pé de cada uma. A última não
   corta folha; as outras sim, para o subtotal cair no pé da página a
   que ele se refere. */
function montaTabelas(blocos, L){
  return blocos.map((bl,n)=>{
    const ultimo = n === blocos.length - 1;
    const sBase = bl.reduce((x,r)=>x+(Number(r.price)||0),0);
    const sCom  = bl.reduce((x,r)=>x+comissaoDe(r),0);
    return `<table class="svc${ultimo?"":" corta"}">
      <thead><tr><th style="width:90px;">${L.date}</th><th>${L.svc}</th>
        <th style="width:150px;">${L.inc}</th>
        <th class="money" style="width:104px;">${L.val}</th>
        <th class="money" style="width:48px;">${L.pct}</th>
        <th class="money" style="width:112px;">${L.com}</th></tr></thead>
      <tbody>${bl.map(r=>`<tr>
        <td class="date-cell">${esc(r.service_date||"")}</td>
        <td><div class="svc-title">${esc(r.title)}</div></td>
        <td class="inclui">${esc(r.commission_basis||"—")}</td>
        <td class="money">${eur(r.price)}</td>
        <td class="money">${Number(r.commission_pct)}%</td>
        <td class="money">${eur(comissaoDe(r))}</td></tr>`).join("")}</tbody>
      <tfoot><tr>
        <td></td><td>${blocos.length>1 ? `${L.subt} ${n+1}/${blocos.length}` : L.sold}</td><td></td>
        <td class="money">${eur(sBase)}</td>
        <td></td>
        <td class="money">${eur(sCom)}</td>
      </tr></tfoot>
    </table>`; }).join("");
}

/* O texto padrão mora em ops_text_defaults e é dele que toda proposta
   nova nasce preenchida. Ela edita a cópia da proposta sem afetar o
   padrão; e quando quiser que a mudança valha para as próximas, grava
   por cima do padrão de propósito, por este botão. */
/* As duas tabelas que toda proposta tem. Ela renomeia ou apaga na
   proposta em que não servirem — mas o caso comum já vem montado. */
const SECOES_PADRAO = [
  {key:"stays",  title:"Selected Stays",  title_en:"Selected Stays",
   note:"Selecione sua hospedagem para esta viagem",
   note_en:"Select your stay for this trip"},
  {key:"ground", title:"Ground Services", title_en:"Ground Services",
   note:"Selecione os serviços terrestres para esta viagem",
   note_en:"Select the ground services for this trip"}
];

async function lerPadrao(){
  const {data} = await sb.from("ops_text_defaults").select("*").eq("key","conditions").maybeSingle();
  return data || {pt:"", en:""};
}
async function trazerPadrao(){
  guardaCampos();
  const d = await lerPadrao();
  if(!(d.pt||"").trim() && !(d.en||"").trim())
    return alert("Ainda não há texto padrão gravado. Escreva as condições aqui e clique em "
      + "\"Salvar este texto como padrão\" — as próximas propostas já nascem com ele.");
  if(!confirm("Substituir o que está escrito nos dois campos pelo texto padrão?")) return;
  PROP.conditions_pt = d.pt||""; PROP.conditions_en = d.en||"";
  renderProposal();
}
/* O parágrafo que diz que a Tuscan Lands é DMC licenciada e opera em
   colaboração com a agência. Fica guardado no padrão da casa e entra na
   folha de abertura quando ela quiser — tem agência que pede, e tem
   agência que prefere sem. Já estando lá, não entra duas vezes. */
async function incluirNotaDMC(){
  const campo = campoP("assurance");
  const atual = (el("q-assurance") ? el("q-assurance").value : (PROP[campo]||""));
  const {data} = await sb.from("ops_text_defaults").select("*").eq("key","assurance_note").maybeSingle();
  const nota = ((data||{})[EDIOMA==="en"?"en":"pt"] || "").trim();
  if(!nota) return alert("O parágrafo padrão ainda não está no banco. Falta rodar a migração 0023.");
  if(atual.indexOf(nota) >= 0) return alert("Esse parágrafo já está na folha.");
  PROP[campo] = (atual.trim() ? atual.replace(/\s+$/,"") + "\n" : "") + nota;
  renderProposal();
}

async function salvarPadrao(){
  guardaCampos();
  if(!confirm("Guardar este texto como padrão da casa? Toda proposta nova passa a nascer com ele. "
    + "As propostas que já existem não mudam.")) return;
  const {error} = await sb.from("ops_text_defaults").upsert({key:"conditions",
    pt: PROP.conditions_pt||"", en: PROP.conditions_en||"", updated_at: new Date().toISOString()});
  alert(error ? error.message : "Guardado. As próximas propostas já nascem com este texto.");
}

function drawSections(){
  const host = el("qs-host");
  if(!PSECS.length){ host.innerHTML = `<div class="muted">Nenhuma seção. Todas as linhas saem numa tabela só.</div>`; return; }
  host.innerHTML = `<table class="rows">
    <thead><tr><th style="width:60px;"></th><th style="width:210px;">Título</th>
      <th>Instrução ao cliente</th><th style="width:240px;">Foto de capa — link</th>
      <th class="x"></th></tr></thead>
    <tbody>${PSECS.map((sec,i)=>`<tr>
      <td class="idio">PT</td>
      <td><input value="${esc(sec.title||"")}" placeholder="Selected Stays" oninput="PSECS[${i}].title=this.value"></td>
      <td><input value="${esc(sec.note||"")}" placeholder="Selecione sua hospedagem para esta viagem" oninput="PSECS[${i}].note=this.value"></td>
      <!-- A foto é a mesma nos dois idiomas: vale a folha inteira da
           seção, não o texto. Por isso rowspan e não par PT/EN. -->
      <td rowspan="2"><input value="${esc(sec.photo||"")}" placeholder="https://…"
        oninput="PSECS[${i}].photo=this.value.trim()||null">
        ${sec.photo?`<img src="${esc(sec.photo)}" alt="" class="sec-thumb"
          onerror="this.style.display='none'">`:""}</td>
      <td class="x" rowspan="2">
        <button class="iconbtn" onclick="moveSection(${i},-1)" title="Subir">↑</button>
        <button class="iconbtn" onclick="moveSection(${i},1)" title="Descer">↓</button>
        <button class="iconbtn" onclick="removeSection(${i})">×</button></td>
    </tr>
    <tr class="par">
      <td class="idio">EN</td>
      <td><input value="${esc(sec.title_en||"")}" placeholder="Selected Stays" oninput="PSECS[${i}].title_en=this.value"></td>
      <td><input value="${esc(sec.note_en||"")}" placeholder="Select your stay for this trip" oninput="PSECS[${i}].note_en=this.value"></td>
    </tr>`).join("")}</tbody></table>`;
}

/* Apagar seção não pode deixar linha apontando para chave que sumiu: ela
   cairia na tabela sem título sem ninguém entender por quê. */
/* Um idioma por vez. Dois campos lado a lado significam meia largura
   cada, e ela não consegue ler nem revisar o que digitou. Aqui ela
   escolhe o idioma no topo e todo campo ocupa a linha inteira. */
let EDIOMA = "pt";
function trocaIdiomaEdicao(l){
  guardaCampos();
  EDIOMA = l;
  renderProposal();
}

/* Os nomes de coluna não seguem um padrão só — algumas vieram com
   sufixo _pt, outras sem —, então o par fica declarado aqui em vez de
   ser adivinhado por concatenação. */
const PARES = {
  cover_tag:   ["cover_tag_pt",   "cover_tag_en"],
  about:       ["about_pt",       "about_en"],
  credentials: ["credentials_pt", "credentials_en"],
  excluded:    ["excluded_pt",    "excluded_en"],
  conditions:  ["conditions_pt",  "conditions_en"],
  backcover:   ["backcover_pt",   "backcover_en"],
  assurance:   ["assurance_pt",   "assurance_en"]
};
const PARES_ITEM = {
  title:      ["title",       "title_en"],
  details:    ["details",     "details_en"],
  room_type:  ["room_type",   "room_type_en"],
  included:   ["included_pt", "included_en"],
  facilities: ["facilities",  "facilities_en"]
};
function campoP(base){ return PARES[base][EDIOMA==="en"?1:0]; }
function campoI(base){ return PARES_ITEM[base][EDIOMA==="en"?1:0]; }

  {k:"extras_title", onde:"Proposta · grupo dos extras",
     pt:"Extras e opcionais (válidos para a contratação da hospedagem)",
     en:"Add-ons and options (available with the stay)"},
  {k:"interest",     onde:"Envio simples · título",
     pt:"Confirmo interesse nos serviços selecionados",
     en:"I confirm my interest in the selected services"},
  {k:"interest_ack", onde:"Envio simples · caixinha",
     pt:"Confirmo interesse nos serviços que selecionei acima.",
     en:"I confirm my interest in the services I selected above."},
  {k:"contact",    onde:"Menu · contracapa",     pt:"Contato", en:"Contact"}
];
function rotulo(p, k, idi){ return ((p.labels||{})[k]||{})[idi] || ""; }
function setRotulo(k, idi, v){
  PROP.labels = PROP.labels || {};
  PROP.labels[k] = PROP.labels[k] || {};
  PROP.labels[k][idi] = v.trim();
  if(!PROP.labels[k].pt && !PROP.labels[k].en) delete PROP.labels[k];
}

/* A ordem das seções é a ordem em que o cliente percorre a proposta:
   primeiro a hospedagem que ela quer destacar, depois as outras. */
/* A ordem das linhas é a ordem em que elas saem na proposta comercial
   e na apresentação — a hospedagem de Roma vem antes da Toscana quando
   é assim que a viagem acontece. O sort gravado é a posição na lista. */
function moveItem(i, d){
  const j = i + d;
  if(j < 0 || j >= PITEMS.length) return;
  const t = PITEMS[i]; PITEMS[i] = PITEMS[j]; PITEMS[j] = t;
  drawQuoteItems();
}

function moveSection(i, d){
  const j = i + d;
  if(j < 0 || j >= PSECS.length) return;
  const t = PSECS[i]; PSECS[i] = PSECS[j]; PSECS[j] = t;
  drawSections(); drawQuoteItems();
}

function removeSection(i){
  const chave = PSECS[i].key;
  PSECS.splice(i,1);
  PITEMS.forEach(r=>{ if(r.section===chave) r.section = null; });
  drawSections(); drawQuoteItems();
}

const quoteLink = tok => (clientLink(tok)||"").replace("#/confirm/","#/quote/");

/* qty x unit_price = price. price continua sendo o TOTAL da linha e a
   única coisa que soma no hub inteiro — total da proposta, e-mail,
   order, comissão. Mexeu na quantidade ou no unitário, o total
   recalcula; mexeu no total, o total é dela e fica.
   Sem unitário lançado, quantidade não multiplica nada: a linha é um
   valor fechado, como sempre foi. */
function recalcLinha(i){
  const r = PITEMS[i]; if(!r) return;
  if(r.unit_price == null || r.unit_price === "") return;
  r.price = Math.round((Number(r.qty||1) * Number(r.unit_price||0)) * 100) / 100;
}
function mexeQtd(i, v){
  PITEMS[i].qty = parseFloat(v) || 1;
  recalcLinha(i); drawQuoteItems();
}
function mexeUnit(i, v){
  PITEMS[i].unit_price = v === "" ? null : (parseFloat(v)||0);
  recalcLinha(i); drawQuoteItems();
}

/* Busca por nome, não lista de caixinhas: com três registros a lista
   serve, com sessenta ela atrapalha. O registro escolhido é COPIADO
   para a linha — dali em diante ela edita o valor, a descrição, o que
   for, sem tocar no catálogo. */
let CATTIMER = null;
/* ===================================================================
   CATÁLOGO
   Hospedagem, transfer e experiência que se repetem entre propostas.
   Até aqui só se cadastrava por SQL, o que quer dizer: só eu cadastrava.
   Ela pediu para montar o banco de transfers e dos extras que voltam
   sempre — assistência, mensageria —, e para isso o cadastro tem de ser
   dela. A proposta continua levando uma CÓPIA: corrigir aqui não
   reescreve proposta já enviada.
   =================================================================== */
const TIPOS = {stay:"Hospedagem", transfer:"Transfer", experience:"Experiência"};
/* Do que o valor é. Sem isto, 450 no cadastro não quer dizer nada: por
   veículo, por pessoa e por dia são três propostas diferentes. */
const UNIDADES = {vehicle:"veículo", person:"pessoa", group:"grupo", day:"dia"};
let CAT = [], CATFILTRO = "", CATBUSCA = "", CATEDIT = null;

async function renderCatalogo(){
  NAV = "catalogo";
  shell(`<div class="overline">Catálogo</div><div class="rule"></div>
    <div class="hint" style="margin-bottom:16px;">O que se repete entre propostas fica aqui e
      você puxa pelo nome na hora de montar. A proposta leva uma cópia: corrigir um cadastro
      não muda proposta que já foi enviada.</div>
    <div class="addbar" style="grid-template-columns:1fr 200px auto;align-items:end;">
      <div><label>Buscar</label><input id="cat-q" placeholder="nome, região…"
        value="${esc(CATBUSCA)}"></div>
      <div><label>Tipo</label><select id="cat-f">
        <option value="">Todos</option>
        ${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}"${CATFILTRO===k?" selected":""}>${v}</option>`).join("")}
      </select></div>
      <button class="btn" id="cat-novo">+ Novo</button>
    </div>
    <div id="cat-host" class="muted" style="margin-top:18px;">Carregando…</div>
    <div id="cat-form"></div>`);
  el("cat-q").oninput = e=>{ CATBUSCA = e.target.value; listarCatalogo(); };
  el("cat-f").onchange = e=>{ CATFILTRO = e.target.value; listarCatalogo(); };
  el("cat-novo").onclick = ()=>editarCatalogo(null);
  listarCatalogo();
}

async function listarCatalogo(){
  const host = el("cat-host"); if(!host) return;
  let q = sb.from("ops_catalog").select("*").order("kind").order("name");
  if(CATFILTRO) q = q.eq("kind", CATFILTRO);
  const {data, error} = await q;
  if(error) return host.innerHTML = `<div class="msg">${esc(explicar(error))}</div>`;
  CAT = data||[];
  const termo = CATBUSCA.trim().toLowerCase();
  const lista = CAT.filter(c=>!termo
    || (c.name||"").toLowerCase().includes(termo)
    || (c.region||"").toLowerCase().includes(termo));
  if(!lista.length) return host.innerHTML = `<div class="muted">Nada aqui ainda. Clique em + Novo.</div>`;
  host.innerHTML = `<table class="list"><thead><tr>
      <th style="width:120px;">Tipo</th><th>Nome</th><th>Região</th><th>O que é</th>
      <th style="width:70px;"></th></tr></thead><tbody>
    ${lista.map(c=>`<tr>
      <td>${esc(TIPOS[c.kind]||c.kind)}${c.active===false?` <span class="muted">· inativo</span>`:""}</td>
      <td><b>${esc(c.name)}</b></td>
      <td class="muted">${esc(c.region||"—")}</td>
      <td class="muted">${esc((c.accommodation||c.descr||"").replace(/\n/g," · ").slice(0,70))}</td>
      <td class="x"><button class="iconbtn" onclick="editarCatalogo('${c.id}')" title="Editar">✎</button></td>
    </tr>`).join("")}</tbody></table>`;
}

         oninput="CATEDIT.${chave}=this.value">`;
  el("cat-form").innerHTML = `<div class="card" style="margin-top:22px;">
    <div class="section-title">${id?"Editar cadastro":"Novo cadastro"}</div>

          conferiu, porque valor velho puxado em silêncio é o risco de
          verdade — e com a unidade, porque 450 sozinho não diz nada. */""}
    <div class="grid3" style="border-left:2px solid var(--copper);padding-left:12px;margin-top:14px;">
      <div><label style="color:var(--copper);">Valor de referência €</label>

        ${c.price_updated_at?`<div class="hint" style="margin-top:5px;">Conferido em ${stamp(c.price_updated_at,"pt").slice(0,10)}</div>`:""}</div>

      <div><label>Condição do valor</label>

          oninput="CATEDIT.price_note=this.value.trim()||null"></div>

    ${campo("Site","website","https://…")}
    ${campo("Acomodação ou o que a linha entrega","accommodation","Van privativa até 8 pessoas · motorista falante de inglês",2)}
    ${campo("Em inglês","accommodation_en","",2)}
    ${campo("Estrutura ou o que acompanha","facilities","Água a bordo · cadeirinha sob pedido",2)}
    ${campo("Em inglês","facilities_en","",2)}
    ${campo("Descrição","descr","O texto que sai na proposta.",5)}
    ${campo("Em inglês","descr_en","",5)}
    <label style="margin-top:10px;">Foto de capa — a que ocupa a folha inteira da seção</label>

    <input value="${esc(c.cover_img||"")}" placeholder="https://…"

    ${c.cover_img?`<img src="${esc(c.cover_img)}" alt="" class="cat-capa" onerror="this.style.display='none'">`:""}
    <label style="margin-top:10px;">Fotos do card — um link por linha</label>
    <textarea rows="3" placeholder="https://…"
      oninput="CATEDIT.photos=this.value.split('\n').map(x=>x.trim()).filter(Boolean)"
      >${esc((c.photos||[]).join("\n"))}</textarea>
    <label style="margin-top:10px;" class="interno">Anotação interna — o cliente nunca vê</label>
    <textarea rows="2" class="interno"
      oninput="CATEDIT.internal_notes=this.value">${esc(c.internal_notes||"")}</textarea>
    <div class="check" style="margin-top:14px;">
      <input type="checkbox" id="cat-ativo"${c.active===false?"":" checked"}
        onchange="CATEDIT.active=this.checked">

      <button class="btn" id="cat-salvar">Salvar</button>

async function salvarCatalogo(id){
  if(!(CATEDIT.name||"").trim()) return alert("O nome é obrigatório: é por ele que você acha depois.");
  const btn = el("cat-salvar"); btn.disabled = true; btn.textContent = "Salvando…";
  const linha = {
    kind: CATEDIT.kind||"transfer", name: CATEDIT.name.trim(),
    region: (CATEDIT.region||"").trim()||null, website: (CATEDIT.website||"").trim()||null,
    accommodation: CATEDIT.accommodation||null, accommodation_en: CATEDIT.accommodation_en||null,
    facilities: CATEDIT.facilities||null, facilities_en: CATEDIT.facilities_en||null,
    descr: CATEDIT.descr||null, descr_en: CATEDIT.descr_en||null,
    cover_img: CATEDIT.cover_img||null,
    photos: CATEDIT.photos||[], internal_notes: CATEDIT.internal_notes||null,
    price: CATEDIT.price != null ? CATEDIT.price : null,
    price_unit: CATEDIT.price != null ? (CATEDIT.price_unit||"vehicle") : null,
    price_note: CATEDIT.price_note||null,
    active: CATEDIT.active !== false, updated_at: new Date().toISOString()
  };
  /* A data do valor só se mexe quando o valor mexe: salvar o cadastro
     para corrigir uma vírgula na descrição não pode fazer um preço de
     três meses atrás parecer conferido hoje. */
  const antes = id ? (CAT.find(x=>x.id===id)||{}) : {};
  if(linha.price != null && Number(antes.price) !== Number(linha.price))
    linha.price_updated_at = new Date().toISOString();
  const {error} = id
    ? await sb.from("ops_catalog").update(linha).eq("id", id)
    : await sb.from("ops_catalog").insert(linha);
  btn.disabled = false; btn.textContent = "Salvar";
  if(error) return alert(explicar(error));
  el("cat-form").innerHTML = "";
  listarCatalogo();
}

/* Apagar do catálogo não mexe em proposta nenhuma: a linha da proposta
   é cópia, e catalog_id vira nulo se o cadastro sumir. */
async function apagarCatalogo(id){
  const c = CAT.find(x=>x.id===id)||{};
  if(!confirm(`Apagar "${c.name}" do catálogo?\n\n`
    + `As propostas que já usaram este cadastro não mudam — elas levaram uma cópia.`)) return;
  const {error} = await sb.from("ops_catalog").delete().eq("id", id);
  if(error) return alert(explicar(error));
  el("cat-form").innerHTML = "";
  listarCatalogo();
}

/* A foto de capa do cadastro entra na seção escolhida — mas só se a
   seção ainda estiver sem foto. Foto que ela escolheu à mão não se
   sobrescreve, nem quando um segundo hotel entra na mesma seção. */
function capaDaSecao(i){
  const r = PITEMS[i]; if(!r || !r._capa || !r.section) return;
  const sec = PSECS.find(x=>x.key === r.section);
  if(sec && !(sec.photo||"").trim()){ sec.photo = r._capa; if(el("qs-host")) drawSections(); }
}

function buscarCatalogo(termo){
  clearTimeout(CATTIMER);
  const host = el("cat-res");
  const q = (termo||"").trim();
  if(q.length < 2){ host.innerHTML = ""; return; }
  CATTIMER = setTimeout(async ()=>{
    const {data, error} = await sb.from("ops_catalog").select("*")
      .ilike("name", "%"+q+"%").eq("active", true).order("name").limit(8);
    if(error){ host.innerHTML = `<div class="msg">${esc(explicar(error))}</div>`; return; }
    if(!data || !data.length){
      host.innerHTML = `<div class="muted" style="padding:8px 0;">Nada com esse nome no catálogo.</div>`;
      return;
    }
    host.innerHTML = data.map(c=>`<div class="cat-item" onclick="puxarDoCatalogo('${c.id}')">
      <div><b>${esc(c.name)}</b>${c.region?` <span class="muted">· ${esc(c.region)}</span>`:""}</div>
      <div class="muted">${esc((c.accommodation||c.descr||"").slice(0,90))}</div>
    </div>`).join("");
    CATCACHE = data;
  }, 250);
}
let CATCACHE = [];
function puxarDoCatalogo(id){
  const c = CATCACHE.find(x=>x.id===id);
  if(!c) return;
  PITEMS.push({
    catalog_id: c.id, service_date: PROP.travel_window || "",
    title: c.name, title_en: c.name,
    details: c.descr, details_en: c.descr_en,
    room_type: c.accommodation, room_type_en: c.accommodation_en,
    facilities: c.facilities, facilities_en: c.facilities_en,
    website: c.website, photos: (c.photos||[]).slice(), attachments: (c.attachments||[]).slice(),
    qty: 1, unit_price: c.price != null ? Number(c.price) : null,
    price: c.price != null ? Number(c.price) : 0,
    optional: false, extras: [], sort: PITEMS.length,
    section: (PSECS[0] && PSECS[0].key) || null,
    // guardada só na tela, para preencher a capa da seção; não vai ao banco
    _capa: c.cover_img || null
  });
  capaDaSecao(PITEMS.length-1);
  el("cat-busca").value = ""; el("cat-res").innerHTML = "";
  drawQuoteItems();
  alert(c.name + " entrou na proposta."
    + (c.price != null
        ? "\n\nValor de referência: " + eur(c.price)
          + (c.price_unit ? " por " + (UNIDADES[c.price_unit]||c.price_unit) : "")
          + (c.price_note ? " · " + c.price_note : "")
          + (c.price_updated_at ? "\nConferido em " + stamp(c.price_updated_at,"pt").slice(0,10) : "")
          + "\n\nÉ ponto de partida, e não o preço desta venda. Confira antes de mandar."
        : "\n\nEste cadastro está sem valor de referência. Lance o valor na linha.")
    + "\n\nO que você mudar aqui não volta para o cadastro.");
}
