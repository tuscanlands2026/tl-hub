<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuscan Lands · Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Sorts+Mill+Goudy:ital@0;1&family=Libre+Franklin:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --cream-light:#f6f3f0; --cream:#eae4db; --terracotta:#772f25;
  --sage:#595e49; --brown:#a2564c; --copper:#a56850;
  --ink:#2a2a28; --muted:#6b6860; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;}
body{font-family:'Libre Franklin',sans-serif;font-weight:300;color:var(--ink);background:var(--cream-light);}
h1,h2,h3{font-family:'Sorts Mill Goudy',serif;font-weight:400;}
a{color:var(--terracotta);}
input,select,textarea,button{font-family:'Libre Franklin';font-size:14px;font-weight:300;}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--cream);background:#fff;color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:1px solid var(--copper);}
textarea{resize:vertical;line-height:1.6;}
label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);font-weight:500;margin-bottom:5px;}
.btn{font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding:11px 18px;
  border:1px solid var(--terracotta);background:var(--terracotta);color:#fff;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--terracotta);}
.btn.sage{background:var(--sage);border-color:var(--sage);}
.btn:disabled{opacity:.45;cursor:default;}
.btn.sm{padding:7px 12px;font-size:11px;}
.hide{display:none !important;}

/* ---------- shell ---------- */
.topbar{background:var(--terracotta);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;}
.topbar .mark{font-family:'Sorts Mill Goudy';font-size:16px;letter-spacing:.14em;}
.topbar .sep{opacity:.5;font-size:12px;}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;}
.topbar .right button{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}
.card{background:#fff;border:1px solid var(--cream);padding:24px;}
.stack{display:flex;flex-direction:column;gap:18px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.overline{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.rule{width:30px;height:1px;background:var(--copper);margin:10px 0 18px;}
.muted{color:var(--muted);font-size:13px;line-height:1.6;}

/* ---------- login / setup ---------- */
.gate{max-width:400px;margin:12vh auto;padding:0 24px;}
.gate .mark{font-family:'Sorts Mill Goudy';font-size:22px;letter-spacing:.16em;color:var(--terracotta);text-align:center;}
.gate .sub{text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:8px 0 30px;}
.msg{font-size:13px;padding:10px 12px;border-left:2px solid var(--brown);background:#fbf7f4;color:var(--brown);}

/* ---------- lista ---------- */
table.list{width:100%;border-collapse:collapse;background:#fff;}
table.list thead th{background:var(--sage);color:#fff;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:500;padding:11px 12px;text-align:left;}
table.list tbody td{padding:12px;border-bottom:1px solid var(--cream);font-size:14px;vertical-align:middle;}
table.list tbody tr:hover{background:var(--cream-light);cursor:pointer;}
.badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:3px 9px;color:#fff;}
.badge.draft{background:var(--muted);}
.badge.sent{background:var(--copper);}
.badge.confirmed{background:var(--sage);}

/* ---------- editor ---------- */
.editor-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;}
.editor-head h1{font-size:30px;color:var(--terracotta);}
.editor-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.section-title{font-family:'Libre Franklin';font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--sage);font-weight:500;border-bottom:1px solid var(--cream);padding-bottom:7px;margin-bottom:16px;}
table.rows{width:100%;border-collapse:collapse;}
table.rows th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);font-weight:500;
  text-align:left;padding:0 8px 6px 0;}
table.rows td{padding:0 8px 8px 0;vertical-align:top;}
table.rows td.x{width:34px;padding-right:0;}
.iconbtn{border:none;background:none;color:var(--brown);cursor:pointer;font-size:15px;padding:8px 4px;}
.totalline{display:flex;justify-content:flex-end;gap:34px;align-items:baseline;margin-top:14px;}
.totalline .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.totalline .amt{font-family:'Sorts Mill Goudy';font-size:26px;color:var(--terracotta);}
.linkbox{display:flex;gap:8px;align-items:center;margin-top:12px;}
.linkbox input{font-size:12px;color:var(--muted);}

/* ---------- documento do cliente ---------- */
.doc{max-width:900px;margin:0 auto;background:#fff;padding:48px 52px;box-shadow:0 1px 12px rgba(0,0,0,.08);}
.doc .head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--terracotta);padding-bottom:20px;}
.doc .brand .logo-img{height:76px;width:auto;display:block;margin-bottom:12px;}
.doc .brand .logo-text{font-family:'Sorts Mill Goudy';font-size:22px;letter-spacing:.14em;color:var(--terracotta);}
.doc .brand .contact{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6;}
.doc .to{text-align:right;max-width:320px;}
.doc .to .lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.doc .to .val{font-family:'Sorts Mill Goudy';font-size:17px;margin:2px 0 8px;line-height:1.35;}
.doc h1.doctitle{font-family:'Libre Franklin';font-weight:400;font-size:26px;color:var(--terracotta);margin:26px 0 4px;}
.doc .meta{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0 8px;border:1px solid var(--cream);}
.doc .meta .cell{padding:12px 14px;border-right:1px solid var(--cream);}
.doc .meta .cell:last-child{border-right:none;}
.doc .meta .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.doc .meta .v{font-size:14px;margin-top:5px;}
.doc .intro{font-size:14px;line-height:1.75;text-align:justify;margin:22px 0 4px;white-space:pre-wrap;}
.doc table.svc{width:100%;border-collapse:collapse;margin-top:22px;}
.doc table.svc thead th{background:var(--sage);color:#fff;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:500;padding:11px 12px;text-align:left;}
.doc table.svc thead th.money{text-align:right;width:130px;}
.doc table.svc tbody td{padding:12px;border-bottom:1px solid var(--cream);vertical-align:top;font-size:14px;}
.doc table.svc tbody td.money{text-align:right;}
.doc table.svc tbody tr:nth-child(even){background:var(--cream-light);}
.doc .date-cell{font-weight:500;color:var(--sage);white-space:nowrap;}
.doc .svc-title{font-weight:500;}
.doc .svc-sub{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6;white-space:pre-wrap;}
.doc .total-row{display:flex;justify-content:flex-end;margin-top:20px;}
.doc .total-box{background:var(--cream);padding:16px 28px;display:flex;gap:40px;align-items:center;}
.doc .total-box .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.doc .total-box .amt{font-family:'Sorts Mill Goudy';font-size:28px;color:var(--terracotta);}
.doc table.pay{width:100%;border-collapse:collapse;margin-top:14px;}
.doc table.pay th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);font-weight:500;
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--cream);}
.doc table.pay td{padding:9px 10px;border-bottom:1px solid var(--cream);font-size:13.5px;}
.doc table.pay td.money{text-align:right;}
.doc .terms{margin-top:34px;border-top:1px solid var(--cream);padding-top:22px;}
.doc .terms h2{font-size:22px;color:var(--terracotta);text-align:center;margin-bottom:6px;}
.doc .terms h3{font-family:'Libre Franklin';font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);
  font-weight:500;margin:22px 0 10px;border-bottom:1px solid var(--cream);padding-bottom:6px;}
.doc .terms ol{margin:0 0 4px 18px;}
.doc .terms li{font-size:12.5px;line-height:1.65;margin-bottom:9px;text-align:justify;}
.doc .terms ul{margin:8px 0 4px 18px;}
.doc .foot{margin-top:30px;text-align:center;font-size:11px;color:var(--muted);line-height:1.7;}
.doc .foot .co{font-family:'Sorts Mill Goudy';font-size:13px;color:var(--sage);letter-spacing:.06em;}

/* ---------- formulário de confirmação ---------- */
.confirm-block{max-width:900px;margin:26px auto 60px;background:#fff;border:1px solid var(--cream);padding:40px 52px;}
.confirm-block h2{font-size:24px;color:var(--terracotta);}
.pax-row{display:grid;grid-template-columns:1fr 34px;gap:8px;margin-bottom:8px;align-items:center;}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.6;margin-bottom:14px;}
.check input{width:auto;margin-top:3px;}
.done{max-width:640px;margin:16vh auto;text-align:center;padding:0 24px;}
.done h2{font-size:28px;color:var(--terracotta);margin-bottom:14px;}

@media (max-width:760px){
  .grid2,.grid3,.doc .meta{grid-template-columns:1fr;}
  .doc{padding:28px 20px;}
  .confirm-block{padding:28px 20px;}
  .doc .head{flex-direction:column;gap:18px;}
  .doc .to{text-align:left;}
}
@media print{
  body{background:#fff;}
  .topbar,.editor-actions,.confirm-block,.noprint{display:none !important;}
  .doc{box-shadow:none;max-width:none;padding:20px 24px;}
  .doc table.svc thead th{background:var(--sage)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .doc table.svc tbody tr:nth-child(even){background:var(--cream-light)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .doc .total-box{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .doc .terms h3{break-after:avoid;}
  .doc .terms li{break-inside:avoid;}
}
</style>
</head>

<script>

const TERMS = {
pt:`<h2>Termos e Condições</h2>
<h3>Serviços de Transporte e Transfers</h3>
<ol>
<li>Para serviços de transfer privativo, aplica-se uma tolerância de 20 minutos em caso de atraso do passageiro. Exceto em situações fora do controle do passageiro, como atrasos de voo, o passageiro reconhece que qualquer atraso além desse período incorrerá em cobrança adicional de €105 por hora.</li>
<li>Para day tours com motorista privativo à disposição, o roteiro é elaborado pela equipe técnica da Tuscan Lands em coordenação com o cliente e deve ser seguido conforme acordado. Os motoristas não estão autorizados a fazer paradas não programadas, alterar a rota ou incluir atividades não aprovadas previamente.</li>

<li>A aceitação dos termos e o pagamento constituem concordância com todas as condições deste documento.</li>
<li>Prazos e taxas de cancelamento para todos os serviços (tours, experiências, transfers e estadias):
<ul>
<li>Da aceitação e pagamento até 15 dias úteis antes do serviço: <b>taxa administrativa e de planejamento de 15%</b>. Cobre o trabalho de curadoria e coordenação já realizado (contatos com fornecedores, reservas e eventual elaboração de roteiro), que ocorre independentemente da data de cancelamento.</li>

function makeClient(){
  if(!cfg.url || !cfg.key) return false;
  sb = supabase.createClient(cfg.url, cfg.key);
  return true;
}
function route(){ return (location.hash||"").replace(/^#\/?/,""); }

async function boot(){
  const r = route();
  const isPublic = r.startsWith("confirm/");
  if(!makeClient()){ return renderSetup(isPublic ? r : null); }
  if(isPublic) return renderPublic(r.split("/")[1]);
  const {data} = await sb.auth.getSession();
  if(!data.session) return renderLogin();
  renderApp();
}
window.addEventListener("hashchange", boot);

/* ---------------------------------------------------------- LOGIN ---- */
function renderLogin(){
  app.innerHTML = `
  <div class="gate">
    <div class="mark">TUSCAN LANDS</div>
    <div class="sub">Vendas &amp; Operações</div>
    <div class="stack">
      <div><label>E-mail</label><input id="lg-mail" type="email" autocomplete="username"></div>
      <div><label>Senha</label><input id="lg-pass" type="password" autocomplete="current-password"></div>
      <button class="btn" id="lg-go">Entrar</button>
      <div id="lg-msg"></div>
    </div>
  </div>`;
  const go = async () => {
    const btn = el("lg-go"); btn.disabled = true; btn.textContent = "Entrando…";
    const {error} = await sb.auth.signInWithPassword({
      email: el("lg-mail").value.trim(), password: el("lg-pass").value});
    if(error){
      el("lg-msg").innerHTML = `<div class="msg">${esc(error.message)}</div>`;
      btn.disabled = false; btn.textContent = "Entrar"; return;
    }
    renderApp();
  };
  el("lg-go").onclick = go;
  el("lg-pass").onkeydown = e => { if(e.key==="Enter") go(); };
}

async function openOrder(id){
  const [{data:o,error:e1}, {data:it}, {data:pg}, {data:cf}] = await Promise.all([
    sb.from("ops_orders").select("*").eq("id",id).single(),
    sb.from("ops_order_items").select("*").eq("order_id",id).order("sort"),
    sb.from("ops_order_payments").select("*").eq("order_id",id).order("sort"),
    sb.from("ops_order_confirmations").select("*").eq("order_id",id).order("submitted_at",{ascending:false})
  ]);
  if(e1) return alert(e1.message);
  ORDER = o; ITEMS = it||[]; PAYS = pg||[]; CONF = (cf&&cf[0])||null;
  renderEditor();
}

async function saveOrder(){
  const btn = el("ed-save"); btn.disabled = true; btn.textContent = "Salvando…";
  const patch = {
    opportunity_code: el("f-opp").value.trim(), order_ref: el("f-ref").value.trim(),
    lang: el("f-lang").value, status: el("f-status").value,
    agency: el("f-agency").value.trim(), agency_contact: el("f-contact").value.trim(),
    final_client: el("f-client").value.trim(), pax_summary: el("f-pax").value.trim(),
    travel_window: el("f-window").value.trim(), intro: el("f-intro").value,
    internal_notes: el("f-notes").value, updated_at: new Date().toISOString()
  };
  const {error:e1} = await sb.from("ops_orders").update(patch).eq("id",ORDER.id);
  await sb.from("ops_order_items").delete().eq("order_id",ORDER.id);
  await sb.from("ops_order_payments").delete().eq("order_id",ORDER.id);
  const {error:e2} = ITEMS.length ? await sb.from("ops_order_items").insert(
    ITEMS.map((r,i)=>({order_id:ORDER.id,sort:i,service_date:r.service_date,title:r.title,details:r.details,price:r.price}))) : {};
  const {error:e3} = PAYS.length ? await sb.from("ops_order_payments").insert(
    PAYS.map((p,i)=>({order_id:ORDER.id,sort:i,label:p.label,due_date:p.due_date,amount:p.amount,status:p.status}))) : {};
  btn.disabled = false; btn.textContent = "Salvar";
  const err = e1||e2||e3;
  if(err) return alert(err.message);
  Object.assign(ORDER, patch);
  btn.textContent = "Salvo";
  setTimeout(()=>btn.textContent="Salvar", 1600);
}

let PUB = null, PAX = {adults:[""], children:[]};

async function renderPublic(token){
  app.innerHTML = `<div class="done"><div class="muted">…</div></div>`;
  const {data,error} = await sb.rpc("tl_get_order",{p_token:token});
  if(error || !data) return app.innerHTML = message(T.pt.notFound);
  if(data.expired) return app.innerHTML = message(T.pt.expired);
  PUB = data; PUB.token = token;
  const t = T[PUB.order.lang||"pt"];
  PAX = {adults:[""], children:[]};
  drawPublic();
  if(PUB.order.status === "confirmed") return;
}

    lead_name: el("c-name").value.trim(), lead_email: el("c-mail").value.trim(),
    lead_phone: el("c-phone").value.trim(),
    adults: PAX.adults.map(a=>a.trim()).filter(Boolean),
    children: PAX.children.filter(c=>c.age!==""),
    ack_vehicle: el("c-veh").checked, ack_terms: el("c-terms").checked,
    signature_name: el("c-sign").value.trim(), remarks: el("c-rem").value.trim()
  };
  if(!payload.lead_name || !payload.lead_email || !payload.signature_name || !payload.ack_terms){
    el("c-msg").innerHTML = `<div class="msg">${t.errFill}</div>`; return;
  }
  const btn = el("c-go"); btn.disabled = true; btn.textContent = t.sending;
  const {data,error} = await sb.rpc("tl_submit_confirmation",{p_token:PUB.token, p_payload:payload});
  if(error || !data || !data.ok){
    el("c-msg").innerHTML = `<div class="msg">${esc((error&&error.message)||(data&&data.error)||"erro")}</div>`;
    btn.disabled = false; btn.textContent = t.submit; return;
  }
  app.innerHTML = `<div class="done"><h2>${t.doneTitle}</h2><div class="muted">${t.doneText}</div></div>`;
}

boot();
</script>
</body>
</html>
