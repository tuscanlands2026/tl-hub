/* Chave estável por linha: o cliente marca por chave, e renomear o
   rótulo depois não faz a escolha dele apontar para outro extra. */
/* ANEXO É ARQUIVO, E NÃO LINK.
   O campo era "nome | endereço", e ela tem o PDF da planimetria no
   computador, não hospedado em lugar nenhum — então o anexo nunca
   aparecia na proposta do cliente. O arquivo sobe para o Storage do
   Supabase, no balde ops-anexos, e o que fica gravado na linha é o
   endereço público dele, do mesmo jeito que era antes. Colar um link
   continua funcionando, para o caso do arquivo já estar em outro lugar. */
const BALDE = "ops-anexos";

function anexoCampo(r, i){
  const lista = (r.attachments||[]).filter(a=>a&&a.url);
  return `<div class="anexos-box">
    ${lista.map((a,j)=>`<div class="anexo-linha">
      <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.name||"arquivo")}</a>
      <button class="iconbtn" title="Remover"
        onclick="PITEMS[${i}].attachments.splice(${j},1);drawQuoteItems()">×</button>
    </div>`).join("")}
    <div class="anexo-acoes">
      <label class="btn ghost sm anexo-lbl">Escolher arquivo
        <input type="file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"
          onchange="subirAnexo(${i}, this)"></label>
      <button class="btn ghost sm" onclick="anexoPorLink(${i})">Colar um link</button>
      <span class="hint" id="anx-${i}"></span>
    </div>
  </div>`;
}

function anexoPorLink(i){
  const url = prompt("Endereço do arquivo (https://…)");
  if(!url || !/^https?:\/\//i.test(url.trim())) return;
  const nome = prompt("Como chamar este anexo?", "Planimetria.pdf") || "Arquivo";
  PITEMS[i].attachments = (PITEMS[i].attachments||[]).concat([{name:nome.trim(), url:url.trim()}]);
  drawQuoteItems();
}

async function subirAnexo(i, input){
  const f = input.files && input.files[0];
  if(!f) return;
  const aviso = el("anx-"+i);
  if(f.size > 10*1024*1024){
    input.value = "";
    return alert("Arquivo de " + Math.round(f.size/1048576) + " MB. O limite é 10 MB — "
      + "comprima o PDF ou mande a planimetria em uma página só.");
  }
  if(aviso) aviso.textContent = "Enviando…";
  // Nome sem acento, espaço nem sinal: chave de Storage não aceita.
  const limpo = f.name.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9._-]+/g,"-").replace(/^-+|-+$/g,"").slice(-60) || "arquivo";
  const caminho = (PROP.id || "sem-proposta") + "/" + Date.now() + "-" + limpo;
  const {error} = await sb.storage.from(BALDE).upload(caminho, f, {upsert:false});
  input.value = "";
  if(error){
    if(aviso) aviso.textContent = "";
    return alert(explicarAnexo(error));
  }
  const {data} = sb.storage.from(BALDE).getPublicUrl(caminho);
  PITEMS[i].attachments = (PITEMS[i].attachments||[]).concat([{name:f.name, url:data.publicUrl}]);
  if(aviso) aviso.textContent = "";
  drawQuoteItems();
  alert("Arquivo anexado. Clique em Salvar para gravar na proposta.");
}

/* O balde é criado uma vez por ela, no painel do Supabase. Se não
   existir, a mensagem crua não diz o que fazer. */
function explicarAnexo(err){
  const m = (err && (err.message||err.error||"")) + "";
  if(/not found|does not exist|bucket/i.test(m))
    return "O balde de arquivos ainda não existe.\n\nNo painel do Supabase: Storage → "
      + "New bucket → nome \"" + BALDE + "\", marque Public bucket → Save. "
      + "Depois volte aqui e anexe de novo.";
  if(/policy|permission|denied|unauthorized/i.test(m))
    return "O balde \"" + BALDE + "\" existe mas não aceita envio.\n\n"
      + "No painel do Supabase: Storage → " + BALDE + " → Configuration → marque Public bucket.";
  return m || "Não consegui enviar o arquivo.";
}

function addExtra(i){
  const usadas = (PITEMS[i].extras||[]).map(e=>e.key);
  const base = ["transport","host","guide"].find(k=>!usadas.includes(k));
  let k = base;
  if(!k){ let n=1; while(usadas.includes("extra"+n)) n++; k = "extra"+n; }
  const rot = {transport:["Transporte","Transport"],host:["Anfitrião TL","TL Host"],
               guide:["Visita guiada","Guided visit"]}[k] || ["",""];
  PITEMS[i].extras = (PITEMS[i].extras||[]).concat([{key:k,label_pt:rot[0],label_en:rot[1],price:0}]);
  drawQuoteItems();
}

function addUnidade(i){
  const usadas = (PITEMS[i].units||[]).map(u=>u.key);
  let n = 1; while(usadas.includes("u"+n)) n++;
  PITEMS[i].units = (PITEMS[i].units||[]).concat([{key:"u"+n,label:"",label_en:"",price:0,optional:false}]);
  drawQuoteItems();
}

/* "Se levar tudo" nunca soma duas alternativas do mesmo grupo: pega a
   mais cara, que é o teto real daquela escolha. Somar as duas daria um
   número que nenhuma venda pode atingir. */
function sumQuote(){
  const vistos = {};
  let t = 0;
  PITEMS.forEach(r=>{
    const v = (Number(r.price)||0)
      + (r.units ||[]).reduce((x,u)=>x+(Number(u.price)||0),0)
      + (r.extras||[]).reduce((x,e)=>x+(Number(e.price)||0),0);
    const g = (r.choice_group||"").trim();
    if(!g){ t += v; return; }
    vistos[g] = Math.max(vistos[g]||0, v);
  });
  Object.values(vistos).forEach(v=>t+=v);
  el("qi-total").textContent = eur(t);
}

/* Trocar de idioma redesenha a tela. O que estiver digitado e ainda não
   tiver disparado o oninput — o último caractere, um colar — se perde se
   não for lido antes. */
function guardaCampos(){
  const t = el("q-title"); if(!t) return;
  PROP.title = t.value.trim();
  PROP.pax_summary = el("q-pax").value.trim();
  PROP.travel_window = el("q-window").value.trim();
  PROP.lang = el("q-lang").value;
  PROP.show_prices = el("q-prices").value === "sim";
  PROP.terms_url = el("q-terms").value.trim() || null;
  PROP.intro = el("q-intro").value;
  PROP.payment_note = el("q-paynote").value;
  PROP.internal_notes = el("q-internal").value;
  if(el("q-exp")) PROP.token_expires_at = el("q-exp").value
    ? new Date(el("q-exp").value + "T23:59:59").toISOString() : null;
  if(el("q-cover"))    PROP.cover_img = el("q-cover").value.trim() || null;
  if(el("q-wl"))         PROP.white_label = el("q-wl").value === "agencia";
  if(el("q-confirm"))    PROP.confirm_mode = el("q-confirm").value;
  // Sem "|| null": vazio aqui quer dizer capa sem nome, e não "usa o
  // de antes". Quem diz "usa o de antes" é o nulo, que só existe
  // enquanto ela não salvou a proposta nenhuma vez.
  if(el("q-covertitle")) PROP.cover_title = el("q-covertitle").value.trim();
  if(el("q-assuranceimg")) PROP.assurance_img = el("q-assuranceimg").value.trim() || null;
  if(el("q-agencylogo")) PROP.agency_logo = el("q-agencylogo").value.trim() || null;
  if(el("q-agencybg"))   PROP.agency_logo_bg = el("q-agencybg").value === "sim";
  if(el("q-aboutimg")) PROP.about_img = el("q-aboutimg").value.trim() || null;
  if(el("q-backimg"))  PROP.backcover_img = el("q-backimg").value.trim() || null;
  if(el("q-pgs")) PROP.payment_options = el("q-pgs").value.split("\n")
    .map(l=>l.trim()).filter(Boolean).map((l,k)=>{
      const [pt, en] = l.split("|").map(x=>(x||"").trim());
      return {key:"p"+k, label:pt, label_en:en||null};
    });
}

async function saveProposal(){
  guardaCampos();
  const btn = el("pp-save"); btn.disabled = true; btn.textContent = "Salvando…";
  const patch = {
    title: PROP.title, pax_summary: PROP.pax_summary,
    travel_window: PROP.travel_window, lang: PROP.lang,
    show_prices: PROP.show_prices, terms_url: PROP.terms_url,
    intro: PROP.intro, payment_note: PROP.payment_note,
    layout: PROP.layout || "tabela", cover_img: PROP.cover_img,
    confirm_mode: PROP.confirm_mode === "simple" ? "simple" : "full",
    cover_title: PROP.cover_title, assurance_img: PROP.assurance_img || null,
    white_label: !!PROP.white_label, agency_logo: PROP.agency_logo || null,
    agency_logo_bg: !!PROP.agency_logo_bg,
    assurance_pt: PROP.assurance_pt, assurance_en: PROP.assurance_en,
    cover_tag_pt: PROP.cover_tag_pt, cover_tag_en: PROP.cover_tag_en,
    backcover_pt: PROP.backcover_pt, backcover_en: PROP.backcover_en,
    token_expires_at: PROP.token_expires_at || null,
    about_img: el("q-aboutimg") ? (el("q-aboutimg").value.trim()||null) : PROP.about_img,
    backcover_img: el("q-backimg") ? (el("q-backimg").value.trim()||null) : PROP.backcover_img,
    labels: PROP.labels || {},
    payment_options: el("q-pgs")
      ? el("q-pgs").value.split("\n").map(l=>l.trim()).filter(Boolean).map((l,k)=>{
          const [pt, en] = l.split("|").map(x=>(x||"").trim());
          return {key:"p"+k, label:pt, label_en:en||null};
        })
      : (PROP.payment_options||[]),
    about_pt: PROP.about_pt, about_en: PROP.about_en,
    credentials_pt: PROP.credentials_pt, credentials_en: PROP.credentials_en,
    conditions_pt: PROP.conditions_pt, conditions_en: PROP.conditions_en,
    excluded_pt: PROP.excluded_pt, excluded_en: PROP.excluded_en,
    internal_notes: PROP.internal_notes,
    sections: PSECS.filter(x=>(x.title||"").trim() || (x.title_en||"").trim()),
    updated_at: new Date().toISOString()
  };
  const {error:e1} = await sb.from("ops_proposals").update(patch).eq("id", PROP.id);
  await sb.from("ops_proposal_items").delete().eq("proposal_id", PROP.id);
  const {error:e2} = PITEMS.length ? await sb.from("ops_proposal_items").insert(
    PITEMS.map((r,i)=>({proposal_id:PROP.id, sort:i, service_date:r.service_date,
      title:r.title, details:r.details, price:r.price, optional:!!r.optional,
      qty: Number(r.qty)||1, unit_price: r.unit_price != null ? Number(r.unit_price) : null,
      choice_group:(r.choice_group||"").trim()||null, section:r.section||null,
      supplier:(r.supplier||"").trim()||null,
      catalog_id:r.catalog_id||null,
      included_pt:r.included_pt||null, included_en:r.included_en||null,
      title_en:r.title_en||null, details_en:r.details_en||null,
      room_type:r.room_type||null, room_type_en:r.room_type_en||null,
      facilities:r.facilities||null, facilities_en:r.facilities_en||null,
      website:r.website||null, photos:r.photos||[], attachments:r.attachments||[],
      kind:(r.kind==="extra"?"extra":"stay"),
      units:(r.units||[]).filter(u=>(u.label||"").trim()),
      extras:(r.extras||[]).filter(e=>(e.label_pt||"").trim())}))) : {};
  btn.disabled = false; btn.textContent = "Salvar";
  const err = e1||e2;
  if(err) return alert(explicar(err));
  Object.assign(PROP, patch);
  btn.textContent = "Salvo"; setTimeout(()=>btn.textContent="Salvar",1600);
}

/* ------------------------------ O QUE O CLIENTE ESCOLHEU ------------- */
function drawSelection(){
  const host = el("qsel-host");
  if(!PSEL){
    /* Proposta marcada como aceita sem resposta e sem order é o que
       sobra depois de apagar um teste: a etapa da oportunidade fica em
       "Order" para sempre porque quem decide a etapa é o "aceita" da
       proposta, e não a resposta do cliente. Aqui ela desfaz. */
    const aceita = PROP && PROP.outcome === "accepted";
    host.innerHTML = `<div class="section-title">Resposta do cliente</div>
      <div class="muted">Ainda não respondida.</div>
      ${aceita?`<div class="hint" style="margin-top:12px;color:var(--brown);">
        Esta proposta ainda consta como <b>aceita</b>, e por isso a oportunidade aparece na
        etapa Order. Se a aceitação veio de um teste, desfaça aqui.</div>
      <div style="margin-top:10px;"><button class="btn ghost sm" id="qs-reabrir">Desmarcar como aceita</button></div>`:""}`;
    if(el("qs-reabrir")) el("qs-reabrir").onclick = reabrirProposta;
    return;

  const linhas = (PSEL.lines||[]);
  host.innerHTML = `<div class="section-title">Resposta do cliente</div>
    <div class="grid3">

        PSEL.confirm_mode==="simple"

      ${linhas.map(l=>`<tr>
        <td style="width:26px;padding:3px 6px 3px 0;">${l.chosen?"✓":`<span class="req">✕</span>`}</td>
        <td style="padding:3px 10px 3px 0;">${esc(l.title)}
          ${l.chosen && l.supplier?`<br><span style="color:var(--brown);font-size:12px;">${esc(l.supplier)}</span>`:""}
          ${(l.extras||[]).map(e=>`<br><span style="color:var(--copper);font-size:12px;">+ ${esc(e.label_pt||e.key)}</span>`).join("")}</td>
        <td style="text-align:right;padding:3px 0;">${l.chosen && PROP.show_prices!==false ? eur(l.price) : ""}</td>

    <div class="hint" style="margin-top:7px;">${PSEL.order_id
      ? "A order já foi gerada a partir desta resposta."
      : "Gera a order em rascunho com o que ele escolheu, e marca esta proposta como aceita. Faça depois de reconfirmar os serviços com os fornecedores — o fornecedor de cada linha vai escrito abaixo dela."}</div>`;

  if(el("qs-gen")) el("qs-gen").onclick = gerarOrder;
  if(el("qs-del")) el("qs-del").onclick = apagarResposta;
  if(el("qs-open")) el("qs-open").onclick = () => openOrder(PSEL.order_id);
}

/* Apagar a resposta devolve a proposta ao estado de quem ainda não
   respondeu: o link volta a aceitar envio. Serve para o teste que ela
   faz antes de mandar, e para o caso de a agência responder errado e
   pedir para refazer.

   Não aparece depois que a order foi gerada: ali a resposta deixou de
   ser um rascunho e virou o documento que originou uma venda. */
async function apagarResposta(){
  if(!confirm(`Apagar a resposta de ${PSEL.lead_name||"o cliente"}?\n\n`
    + `A proposta volta a constar como não respondida e deixa de constar como aceita, `
    + `e o link aceita um novo envio. `
    + `Isto não se desfaz.`)) return;
  const btn = el("qs-del"); btn.disabled = true; btn.textContent = "Apagando…";
  const {error:e1} = await sb.from("ops_proposal_selections").delete().eq("id", PSEL.id);
  if(e1){ btn.disabled=false; btn.textContent="Apagar esta resposta"; return alert(explicar(e1)); }
  const {error:e2} = await sb.from("ops_proposals")
    .update({responded_at:null, outcome:null, updated_at:new Date().toISOString()}).eq("id", PROP.id);
  if(e2){ btn.disabled=false; btn.textContent="Apagar esta resposta"; return alert(explicar(e2)); }
  PSEL = null; PROP.responded_at = null; PROP.outcome = null;
  drawSelection();
}

/* Desmarcar a aceitação é o que devolve a oportunidade para a etapa
   Proposta: tl_opportunity_stage lê o "aceita" da proposta, não a
   resposta do cliente. Só vale enquanto nenhuma order tiver nascido
   dela — depois disso a aceitação virou fato, e não rascunho. */
async function reabrirProposta(){
  const btn = el("qs-reabrir"); btn.disabled = true; btn.textContent = "Conferindo…";
  const {data:ords, error:e0} = await sb.from("ops_orders")
    .select("id, order_ref").eq("opportunity_id", PROP.opportunity_id);
  if(e0){ btn.disabled=false; btn.textContent="Desmarcar como aceita"; return alert(explicar(e0)); }
  if((ords||[]).length){
    btn.disabled=false; btn.textContent="Desmarcar como aceita";
    return alert("Esta oportunidade já tem order gerada (" + ords.map(o=>o.order_ref||o.id).join(", ")
      + "). A aceitação deixou de ser rascunho: apague a order antes, se ela também foi teste.");
  }
  if(!confirm("Desmarcar esta proposta como aceita?\n\n"
    + "A oportunidade volta para a etapa Proposta.")) {
    btn.disabled=false; btn.textContent="Desmarcar como aceita"; return; }
  btn.textContent = "Desmarcando…";
  const {error} = await sb.from("ops_proposals")
    .update({outcome:null, responded_at:null, updated_at:new Date().toISOString()})
    .eq("id", PROP.id);
  if(error){ btn.disabled=false; btn.textContent="Desmarcar como aceita"; return alert(explicar(error)); }
  PROP.outcome = null; PROP.responded_at = null;
  drawSelection();
}

async function gerarOrder(){
  if(!confirm(`Gerar a order a partir do que ${PSEL.lead_name||"o cliente"} escolheu?\n\nA proposta v${PROP.version} passa a constar como aceita, e a order nasce em rascunho para você conferir.`)) return;
  const btn = el("qs-gen"); btn.disabled = true; btn.textContent = "Gerando…";
  const {data,error} = await sb.rpc("tl_order_from_quote",{p_selection: PSEL.id});
  if(error || !data || !data.ok){
    btn.disabled = false; btn.textContent = "Reconfirmei — gerar order";
    return alert((error&&error.message) || (data&&data.error) || "erro");
  }
  openOrder(data.order_id);
}

function sumItems(){
  el("it-total").textContent = eur(ITEMS.reduce((s,r)=>s+(Number(r.price)||0),0));
  const c = el("it-comis");
  if(c){
    const soma = ITEMS.reduce((s,r)=>s+comissaoDe(r), 0);
    c.textContent = soma ? eur(soma) : "—";
  }
}
/* Comissão da linha. Sem percentual não é zero: é "ainda não definido",
   e some do relatório em vez de entrar valendo nada. */
function comissaoDe(r){
  if(r.commission_pct == null || r.commission_pct === "") return 0;
  return (Number(r.price)||0) * (Number(r.commission_pct)||0) / 100;
}

/* A alíquota segue o que a linha leva dentro, não o nome dela: transfer
   puro é 10%, transfer com serviço dentro é 12%. Na TL-034-26 as cinco
   linhas se chamam transfer ou motorista, mas uma tem só parada em
   Orvieto, outra leva vinícola com degustação, outra almoço típico
   incluso. Parar em algum lugar não é serviço contratado; visita,
   degustação e refeição inclusa são.

   Isto é palpite para ela conferir, nunca decisão: lê o campo Inclusos
   e, na falta dele, o título com os detalhes. */
const COM_SO_TRANSFER = 10, COM_COM_SERVICO = 12;

/* Parar em algum lugar não é serviço contratado; vinícola, degustação e
   refeição inclusa são. A distinção importa: na TL-034-26 a linha que
   passa no outlet é 10% e a que leva visita a vinícola é 12%, e as duas
   têm a palavra "visita" no texto. Por isso "visita" sozinha não conta:
   contam vinícola, degustação, wine e almoço quando dito incluso. */
const TEM_SERVICO = /vin[íi]cola|winery|wine|degusta|almo[çc]o incluso|almo[çc]o t[íi]pico|almo[çc]o harmoniz|refei[çc][õo]es inclu|guia|jantar/i;

function comissaoPadrao(){
  const vazias = ITEMS.filter(r => r.commission_pct == null || r.commission_pct === "");
  if(!vazias.length) return alert(
    "Todas as linhas já têm percentual. O botão só preenche o que está em branco — "
    + "para trocar um valor, edite a linha direto.");
  if(!confirm("Preencher " + vazias.length + " linha(s) sem percentual?\n\n"
    + "Transfer puro: " + COM_SO_TRANSFER + "%. Transfer com serviço dentro "
    + "(vinícola, degustação, almoço incluso): " + COM_COM_SERVICO + "%.\n\n"
    + "O que você já lançou não é tocado. E é palpite: confira linha a linha, "
    + "porque há fornecedor que comissiona 15%.")) return;
  vazias.forEach(r=>{
    const base = (r.commission_basis || "").trim();
    const temServico = TEM_SERVICO.test(base || ((r.title||"") + " " + (r.details||"")));
    r.commission_pct = temServico ? COM_COM_SERVICO : COM_SO_TRANSFER;
    if(!base && !temServico) r.commission_basis = "Só transfer";
  });
  drawItems();
}

const MODE3 = [["blank","Aparece vazio"],["prefilled","Já preenchido por mim"],["off","Não aparece"]];
const MODE2 = [["on","Aparece"],["off","Não aparece"]];
const TYPES = [["text","Linha de texto"],["textarea","Texto longo"],["number","Número"],
               ["date","Data"],["select","Lista de opções"],["checkbox","Sim / não"]];

function drawConfig(){
  const rows = BLOCKS.map(b=>{
    const cur = CFG[b.k], opts = b.three ? MODE3 : MODE2;
    return `<div class="cfg-row">
      <div class="name">${b.pt}<small>${b.note}</small></div>
      <select onchange="setBlockMode('${b.k}',this.value)">
        ${opts.map(([v,l])=>`<option value="${v}"${cur===v?" selected":""}>${l}</option>`).join("")}
      </select>
    </div>${(b.k==="travellers" && cur!=="off") ? travOptions() : ""}${(b.three && cur==="prefilled") ? fillFor(b.k) : ""}`;
  }).join("");
  el("cfg-host").innerHTML = rows + `
    <div class="cfg-row fixed">
      <div class="name">Aceite dos termos e assinatura digitada
        <small>Aparecem sempre. Sem os dois o envio é recusado pelo banco, não só pela tela.</small></div>
      <div class="muted" style="font-size:11px;">Fixo</div>
    </div>`;
}

/* Quantos viajantes e se o nome precisa bater com o passaporte. A
   quantidade decide quantas linhas a agência vê: pedir "acrescente
   quantos forem" produz lista incompleta, pedir o número exato produz
   conferência. */
/* A quantidade abre as caixas na hora, tanto aqui quanto no checkout da
   agência. Ao diminuir, só some linha vazia: nome já digitado não
   desaparece porque alguém errou o número e corrigiu. */
/* Escolher "já preenchido" precisa abrir as caixas na hora. Sem isto ela
   troca o estado, não vê nada, e conclui que a tela não funciona. */
function setBlockMode(k, v){
  CFG[k] = v;
  if(k==="travellers" && v==="prefilled") return setTravCount(CFG.travellers_count);
  drawConfig();
}

function setTravCount(v){
  const q = Math.max(1, Math.min(30, parseInt(v,10) || 1));
  CFG.travellers_count = q;
  const p = CFG.prefill;
  if(!Array.isArray(p.travellers)) p.travellers = [];
  while(p.travellers.length < q) p.travellers.push({name:"",dob:""});
  while(p.travellers.length > q){
    const ult = p.travellers[p.travellers.length-1];
    if((ult.name||"").trim() || (ult.dob||"").trim()) break;
    p.travellers.pop();
  }
  drawConfig();
  // O redesenho troca o campo por um novo; devolve o foco para ela poder
  // continuar digitando. Campo numérico não aceita setSelectionRange.
  const cx = document.querySelector('.cfg-fill input[type=number]');
  if(cx) cx.focus();
}

function travOptions(){
  return `<div class="cfg-fill"><div class="inner">
    <div class="grid2">
      <div><label>Quantidade de viajantes</label>
        <input type="number" min="1" max="30" value="${CFG.travellers_count}"
          onchange="setTravCount(this.value)" oninput="setTravCount(this.value)"></div>
      <div><label>Nome igual ao passaporte</label>
        <select onchange="CFG.passport_names=(this.value==='sim');drawConfig()">
          <option value="sim"${CFG.passport_names?" selected":""}>Sim — avisa sobre o bilhete de monumento</option>
          <option value="nao"${!CFG.passport_names?" selected":""}>Não — nome usual basta</option>
        </select></div>
    </div>
  </div></div>`;
}

function fillFor(k){
  const p = CFG.prefill;
  if(k==="lead") return `<div class="cfg-fill"><div class="inner"><div class="grid3">
      <div><label>Nome do contato</label><input value="${esc(p.lead_name||"")}" oninput="CFG.prefill.lead_name=this.value"></div>
      <div><label>E-mail</label><input value="${esc(p.lead_email||"")}" oninput="CFG.prefill.lead_email=this.value"></div>
      <div><label>Telefone</label><input value="${esc(p.lead_phone||"")}" oninput="CFG.prefill.lead_phone=this.value"></div>
    </div></div></div>`;
  if(k==="travellers") return `<div class="cfg-fill"><div class="inner">
      <label>Nome e nascimento, como vão para o fornecedor</label>
      ${(p.travellers||[]).map((t,i)=>`<div class="trav-row">
        <input value="${esc(t.name||"")}" oninput="CFG.prefill.travellers[${i}].name=this.value" placeholder="Nome completo">
        <input type="date" value="${esc(t.dob||"")}" oninput="CFG.prefill.travellers[${i}].dob=this.value">
        <button class="iconbtn" onclick="CFG.prefill.travellers.splice(${i},1);drawConfig()">×</button></div>`).join("")}
      <button class="btn ghost sm" onclick="CFG.prefill.travellers.push({name:'',dob:''});drawConfig()">+ Viajante</button>
    </div></div>`;
  return "";
}

/* ------------------------------------------- CAMPOS POR TIPO --------- */
function drawLibOptions(){
  const g = el("fl-grp").value;
  el("fl-key").innerHTML = (FIELD_LIB[g]||[])
    .map(f=>`<option value="${f.k}">${esc(f.pt)}</option>`).join("");
}

function addLibField(){
  const g = el("fl-grp").value, k = el("fl-key").value, def = libLabel(g,k);
  if(!def) return;
  const key = g+"."+k;
  if(FIELDS.some(f=>f.field_key===key)) return alert("Esse campo já está neste checkout.");
  FIELDS.push({field_key:key, group_key:g, label_pt:def.pt, label_en:def.en,
    input_type:def.t, options:def.o||[], required:false, mode:"blank", prefill_value:"", sort:FIELDS.length});
  drawFields();
}

/* Acrescenta o conjunto que ela usa em quase toda venda, sem repetir o
   que já estiver lá. */
function addStandardFields(){
  const tem = new Set(FIELDS.map(f=>f.field_key));
  const novos = standardFields().filter(f=>!tem.has(f.field_key));
  if(!novos.length) return alert("Os campos padrão já estão neste checkout.");
  novos.forEach(f=>{ f.sort = FIELDS.length; FIELDS.push(f); });
  drawFields();
}

function addFreeField(){
  let n = 1;
  while(FIELDS.some(f=>f.field_key==="custom."+n)) n++;
  FIELDS.push({field_key:"custom."+n, group_key:el("fl-grp").value, label_pt:"", label_en:"",
    input_type:"text", options:[], required:false, mode:"blank", prefill_value:"", sort:FIELDS.length});
  drawFields();
}

function prefillControl(f,i){
  if(f.mode!=="prefilled") return `<input disabled placeholder="—">`;
  const set = `oninput="FIELDS[${i}].prefill_value=this.value"`;
  const setc = `onchange="FIELDS[${i}].prefill_value=this.value"`;
  if(f.input_type==="select"){
    return `<select ${setc}><option value="">—</option>${(f.options||[]).map(op=>
      `<option value="${esc(op)}"${f.prefill_value===op?" selected":""}>${esc(op)}</option>`).join("")}</select>`;
  }
  if(f.input_type==="checkbox"){
    return `<select ${setc}>
      <option value="true"${f.prefill_value==="true"?" selected":""}>Sim</option>
      <option value="false"${f.prefill_value!=="true"?" selected":""}>Não</option></select>`;
  }
  if(f.input_type==="textarea") return `<textarea rows="2" ${set}>${esc(f.prefill_value||"")}</textarea>`;
  const t = f.input_type==="number" ? "number" : (f.input_type==="date" ? "date" : "text");
  return `<input type="${t}" value="${esc(f.prefill_value||"")}" ${set}>`;
}

function drawFields(){
  const host = el("fld-host");
  if(!FIELDS.length){
    host.innerHTML = `<div class="muted">Nenhum campo além dos blocos fixos. O checkout sai só com contato,
      passageiros, aceites e assinatura.</div>`;
    return;
  }
  host.innerHTML = `<table class="rows">
    <thead><tr><th>Campo</th><th style="width:120px;">Tipo</th><th style="width:80px;">Obrigatório</th>
      <th style="width:150px;">Estado</th><th style="width:210px;">Valor pré-preenchido</th><th class="x"></th></tr></thead>
    <tbody>${FIELDS.map((f,i)=>`<tr>
      <td>
        <input value="${esc(f.label_pt||"")}" placeholder="Rótulo em português" oninput="FIELDS[${i}].label_pt=this.value">
        <input class="fld-lbl-en" value="${esc(f.label_en||"")}" placeholder="Rótulo em inglês" oninput="FIELDS[${i}].label_en=this.value">
        ${f.input_type==="select"?`<input class="fld-lbl-en" value="${esc((f.options||[]).join(", "))}"
          placeholder="Opções separadas por vírgula"
          oninput="FIELDS[${i}].options=this.value.split(',').map(s=>s.trim()).filter(Boolean)">`:""}
        <div class="muted" style="font-size:10.5px;margin-top:3px;">${esc(T.pt.grp[f.group_key]||f.group_key)} · ${esc(f.field_key)}</div>
      </td>
      <td><select onchange="FIELDS[${i}].input_type=this.value;FIELDS[${i}].prefill_value='';drawFields()">
        ${TYPES.map(([v,l])=>`<option value="${v}"${f.input_type===v?" selected":""}>${l}</option>`).join("")}</select></td>
      <td style="text-align:center;padding-top:8px;">
        <input type="checkbox" style="width:auto;"${f.required?" checked":""} onchange="FIELDS[${i}].required=this.checked"></td>
      <td><select onchange="FIELDS[${i}].mode=this.value;drawFields()">
        <option value="blank"${f.mode==="blank"?" selected":""}>Aparece vazio</option>
        <option value="prefilled"${f.mode==="prefilled"?" selected":""}>Já preenchido</option></select></td>
      <td>${prefillControl(f,i)}</td>
      <td class="x"><button class="iconbtn" title="Não aparece no checkout"
        onclick="FIELDS.splice(${i},1);drawFields()">×</button></td>
    </tr>`).join("")}</tbody></table>
    <div class="hint" style="margin-top:10px;">Remover a linha com o × é o estado “não aparece”: o campo some do
      checkout e não deixa rastro na order.</div>`;
}

/* ------------------------------------------- MEXER NA CONFIRMAÇÃO ----
   Teste precisa sair, e agência que mandou o dado errado precisa poder
   mandar de novo. As duas coisas mexem só na resposta, nunca na order:
   apagar a venda inteira para corrigir um nome seria desproporcional.

   Reabrir preserva o que chegou. Se a agência enviar outra vez, entra
   como resposta nova e a anterior fica no histórico — foi ela quem
   assinou aquilo, com data e hora, e isso não se sobrescreve.
   ---------------------------------------------------------------------- */
async function reopenOrder(){
  if(!confirm(`Reabrir ${ORDER.order_ref} para nova resposta?\n\nO link volta a aceitar envio. A resposta atual, de ${CONF.lead_name||"—"} em ${stamp(CONF.submitted_at,"pt")}, continua guardada.`)) return;
  const btn = el("cf-reopen"); btn.disabled = true; btn.textContent = "Reabrindo…";
  const {error} = await sb.from("ops_orders")
    .update({status:"sent", confirmed_at:null, updated_at:new Date().toISOString()})
    .eq("id", ORDER.id);
  if(error){ btn.disabled=false; btn.textContent="Reabrir para nova resposta"; return alert(error.message); }
  openOrder(ORDER.id);
}

async function deleteConfirmation(){
  if(!confirm(`Apagar a resposta de ${CONF.lead_name||"—"}, enviada em ${stamp(CONF.submitted_at,"pt")}?\n\nNão tem desfazer.`)) return;
  const btn = el("cf-del"); btn.disabled = true; btn.textContent = "Apagando…";
  const {error} = await sb.from("ops_order_confirmations").delete().eq("id", CONF.id);
  if(error){ btn.disabled=false; btn.textContent="Apagar esta resposta"; return alert(error.message); }
  // Sem resposta nenhuma, a order não pode continuar dizendo que está
  // confirmada: o status descreveria um fato que deixou de existir.
  if(CONFS.length <= 1){
    await sb.from("ops_orders")
      .update({status:"sent", confirmed_at:null, updated_at:new Date().toISOString()})
      .eq("id", ORDER.id);
  }
  openOrder(ORDER.id);
}

/* ------------------------------------------------------ GRAVAR ------- */
function cfgToJson(){
  const p = CFG.prefill, c = {
    lead: CFG.lead, travellers: CFG.travellers,
    travellers_count: CFG.travellers_count,
    passport_names: !!CFG.passport_names,
    ack_vehicle: CFG.ack_vehicle !== "off",
    remarks: CFG.remarks !== "off",
    prefill: {}
  };
  // Só guarda o pré-preenchido do bloco que está pré-preenchido. Valor
  // órfão de bloco desligado voltaria a aparecer sozinho se ela religasse.
  if(CFG.lead==="prefilled"){
    c.prefill.lead_name = (p.lead_name||"").trim();
    c.prefill.lead_email = (p.lead_email||"").trim();
    c.prefill.lead_phone = (p.lead_phone||"").trim();
  }
  if(CFG.travellers==="prefilled")
    c.prefill.travellers = (p.travellers||[])
      .map(t=>({name:(t.name||"").trim(), dob:(t.dob||"").trim()}))
      .filter(t=>t.name || t.dob);
  return c;
}

async function saveOrder(){
  // Rótulo vazio quebra a coluna not null e sai como campo sem nome para
  // a agência. Barrar aqui é melhor que descobrir pelo erro do banco.
  const semRotulo = FIELDS.findIndex(f=>!(f.label_pt||"").trim());
  if(semRotulo >= 0) return alert("Há campo do checkout sem rótulo em português (linha "+(semRotulo+1)+").");
  const vazio = FIELDS.find(f=>f.mode==="prefilled" && !String(f.prefill_value||"").trim());
  if(vazio) return alert("O campo “"+vazio.label_pt+"” está como já preenchido, mas sem valor. Preencha ou volte para “aparece vazio”.");

  const btn = el("ed-save"); btn.disabled = true; btn.textContent = "Salvando…";
  const patch = {
    opportunity_code: el("f-opp").value.trim(), order_ref: el("f-ref").value.trim(),
    lang: el("f-lang").value, status: el("f-status").value,
    agency: el("f-agency").value.trim(), agency_contact: el("f-contact").value.trim(),
    final_client: el("f-client").value.trim(), pax_summary: el("f-pax").value.trim(),
    travel_window: el("f-window").value.trim(), intro: el("f-intro").value,
    terms_url: el("f-terms").value.trim() || null,
    payment_note: el("f-paynote").value.trim() || null,
    payment_url: el("f-payurl").value.trim() || null,
    checkout_config: cfgToJson(),
    internal_notes: el("f-notes").value, updated_at: new Date().toISOString()
  };
  const {error:e1} = await sb.from("ops_orders").update(patch).eq("id",ORDER.id);
  await sb.from("ops_order_items").delete().eq("order_id",ORDER.id);
  await sb.from("ops_order_payments").delete().eq("order_id",ORDER.id);
  await sb.from("ops_order_fields").delete().eq("order_id",ORDER.id);
  const {error:e2} = ITEMS.length ? await sb.from("ops_order_items").insert(
    ITEMS.map((r,i)=>({order_id:ORDER.id,sort:i,service_date:r.service_date,title:r.title,
      details:r.details,price:r.price,supplier:(r.supplier||"").trim()||null,
      commission_basis:(r.commission_basis||"").trim()||null,
      commission_pct:(r.commission_pct===""||r.commission_pct==null)?null:r.commission_pct}))) : {};
  const {error:e3} = PAYS.length ? await sb.from("ops_order_payments").insert(
    PAYS.map((p,i)=>({order_id:ORDER.id,sort:i,label:p.label,due_date:p.due_date,amount:p.amount,status:p.status}))) : {};
  const {error:e4} = FIELDS.length ? await sb.from("ops_order_fields").insert(
    FIELDS.map((f,i)=>({order_id:ORDER.id, sort:i, group_key:f.group_key, field_key:f.field_key,
      label_pt:(f.label_pt||"").trim(), label_en:(f.label_en||"").trim()||null,
      input_type:f.input_type, options:f.options||[], required:!!f.required,
      mode:f.mode, prefill_value: f.mode==="prefilled" ? f.prefill_value : null}))) : {};
  btn.disabled = false; btn.textContent = "Salvar";
  const err = e1||e2||e3||e4;
  if(err) return alert(err.message);
  Object.assign(ORDER, patch);
  // O cabeçalho é desenhado uma vez; sem isto ele continuaria mostrando a
  // agência antiga até ela sair da order e voltar.
  if(el("ed-who")) el("ed-who").textContent = quemE(ORDER);
  btn.textContent = "Salvo";
  setTimeout(()=>btn.textContent="Salvar", 1600);
}

/* ---------------------------------------------------------- EXCLUIR ---
   Teste vira lixo dentro de dois dias, e lixo na lista faz a pessoa
   procurar a order certa entre as erradas. Apagar leva junto serviços,
   parcelas, campos e a confirmação, porque o banco tem cascata: order
   sem os filhos não significaria nada.

   Order confirmada exige confirmação em separado. Ali existe resposta de
   agência, com data e hora, e isso é documento — não pode sair no mesmo
   clique de um rascunho de teste.
   ---------------------------------------------------------------------- */
async function deleteOrder(){
  const o = ORDER, btn = el("ed-del");
  let aviso = `Excluir a order ${o.order_ref}?\n\nSaem junto os serviços, as parcelas e os campos do checkout. Não tem desfazer.`;
  if(CONF) aviso += `\n\nATENÇÃO: esta order tem confirmação recebida de ${CONF.lead_name||"—"} em ${stamp(CONF.submitted_at,"pt")}. Ela será apagada também.`;
  if(!confirm(aviso)) return;
  if(CONF && !confirm(`Confirma apagar a resposta da agência junto com a order ${o.order_ref}?`)) return;

  btn.disabled = true; btn.textContent = "Excluindo…";
  const {error} = await sb.from("ops_orders").delete().eq("id", o.id);
  if(error){ btn.disabled = false; btn.textContent = "Excluir"; return alert(error.message); }
  ORDER = null; ITEMS = []; PAYS = []; CONF = null; FIELDS = [];
  renderApp();
}

/* --------------------------------------------------------- DUPLICAR ---
   Uma proposta que vira duas orders porque cada família paga a sua parte
   é caso comum, e redigitar os mesmos vinte serviços é onde nasce a
   divergência entre as duas — muda o valor numa e esquece na outra.

   Copia o que descreve a venda: cabeçalho, serviços, parcelas,
   observação de pagamento e a configuração inteira do checkout.
   NÃO copia o que é único de cada order: o link, que nasce novo no
   banco, e a confirmação já recebida, que pertence a quem assinou
   aquela. O status volta para rascunho, porque a cópia ainda não foi
   mandada a ninguém.
   ---------------------------------------------------------------------- */
function nextRef(ref){
  // A referência da casa é "oportunidade.sequência": TL035-26.1 vira
  // TL035-26.2. Só o sufixo depois do ponto sobe. Pegar o último número
  // qualquer transformaria TL040-26 em TL040-27, mexendo no ano em vez
  // de criar a segunda order.
  const r = (ref||"").trim();
  const m = /^(.*\.)(\d+)$/.exec(r);
  return m ? m[1] + (parseInt(m[2],10)+1) : (r ? r + ".2" : "");
}

async function duplicateOrder(){
  const btn = el("ed-dup");
  if(!confirm("Duplicar esta order?\n\nVem junto: cabeçalho, serviços, parcelas e a configuração do checkout.\nNão vem: o link do cliente, que nasce novo, e a confirmação já recebida.")) return;
  btn.disabled = true; btn.textContent = "Duplicando…";

  const o = ORDER;
  const {data:novo, error} = await sb.from("ops_orders").insert({
    opportunity_code:o.opportunity_code, order_ref:nextRef(o.order_ref), lang:o.lang,
    status:"draft", agency:o.agency, agency_contact:o.agency_contact,
    final_client:o.final_client, pax_summary:o.pax_summary, travel_window:o.travel_window,
    intro:o.intro, internal_notes:o.internal_notes, terms_url:o.terms_url,
    payment_note:o.payment_note, checkout_config:o.checkout_config
  }).select().single();
  if(error){ btn.disabled=false; btn.textContent="Duplicar"; return alert(error.message); }

  // Os filhos saem do que está gravado, não do que está na tela: se ela
  // editou sem salvar, a cópia leva o gravado, e é isso que o link da
  // order original também mostraria.
  const [{data:it},{data:pg},{data:fl}] = await Promise.all([
    sb.from("ops_order_items").select("*").eq("order_id",o.id).order("sort"),
    sb.from("ops_order_payments").select("*").eq("order_id",o.id).order("sort"),
    sb.from("ops_order_fields").select("*").eq("order_id",o.id).order("sort")
  ]);
  const erros = [];
  if(it && it.length){
    const {error:e} = await sb.from("ops_order_items").insert(it.map((r,i)=>({
      order_id:novo.id, sort:i, service_date:r.service_date, title:r.title,
      details:r.details, price:r.price, supplier:r.supplier,
      commission_basis:r.commission_basis,
      commission_pct:r.commission_pct}))); if(e) erros.push(e.message);
  }
  if(pg && pg.length){
    const {error:e} = await sb.from("ops_order_payments").insert(pg.map((r,i)=>({
      order_id:novo.id, sort:i, label:r.label, due_date:r.due_date,
      amount:r.amount, status:r.status}))); if(e) erros.push(e.message);
  }
  if(fl && fl.length){
    const {error:e} = await sb.from("ops_order_fields").insert(fl.map((r,i)=>({
      order_id:novo.id, sort:i, group_key:r.group_key, field_key:r.field_key,
      label_pt:r.label_pt, label_en:r.label_en, input_type:r.input_type,
      options:r.options, required:r.required, mode:r.mode,
      prefill_value:r.prefill_value}))); if(e) erros.push(e.message);
  }
  btn.disabled = false; btn.textContent = "Duplicar";
  if(erros.length) alert("A cópia foi criada, mas parte do conteúdo não veio:\n"+erros.join("\n"));
  openOrder(novo.id);
}

/* ==================================================================== */
/*  QUOTE — a tela onde o cliente escolhe                               */
/*                                                                      */
/*  Mesma cara do documento da order, porque é a mesma casa. O que      */
/*  muda é que aqui ele decide: linha inclusa não tem caixa, opcional   */
/*  tem, e cada extra é uma caixa à parte com preço próprio — a         */
/*  mecânica do concierge. O total anda enquanto ele marca.             */
/* ==================================================================== */
let QT = null, QSEL = {items:{}, extras:{}, units:{}};

async function renderQuote(token){
  app.innerHTML = `<div class="done"><div class="muted">…</div></div>`;
  const {data,error} = await sb.rpc("tl_get_quote",{p_token:token});
  if(error || !data) return app.innerHTML = message(T.pt.notFound);
  if(data.expired) return app.innerHTML = message(T.pt.expired);
  QT = data; QT.token = token;
  QSEL = {items:{}, extras:{}, units:{}};
  drawQuote();
}

/* Uma unidade entra por fazer parte da hospedagem (optional=false) ou
   por ter sido marcada. A conta é a mesma da tl_submit_quote, e é ela
   que vale: aqui é só o que o cliente vê enquanto escolhe. */
function unidadeDentro(i, u){
  if(!u.optional) return true;
  return (QSEL.units[i.id]||[]).includes(u.key);
}
function linhaTotal(i){
  let t = Number(i.price)||0;
  (i.units||[]).forEach(u=>{ if(unidadeDentro(i,u)) t += Number(u.price)||0; });
  (i.extras||[]).forEach(e=>{
    if((QSEL.extras[i.id]||[]).includes(e.key)) t += Number(e.price)||0;
  });
  return t;
}
function quoteTotal(){
  let t = 0;
  (QT.items||[]).forEach(i=>{ if(QSEL.items[i.id]) t += linhaTotal(i); });
  return t;
}

/* Guarda onde a página estava antes de redesenhar, para devolver
   depois. Sem isso, marcar a segunda caixinha começa com a tela lá em
   cima de novo. */
let ROLAGEM = null;
function redesenharEscolha(){
  ROLAGEM = window.scrollY || document.documentElement.scrollTop || 0;
  drawQuote();
}
function marcaItem(id, on){
  QSEL.items[id] = on;
  if(!on){ delete QSEL.extras[id]; delete QSEL.units[id]; }
  redesenharEscolha();
}

/* Escolher uma alternativa desmarca as irmãs, e leva junto os extras
   delas: extra de hotel que ele não vai usar somando no total é a conta
   errada que só aparece na fatura. */
function marcaEscolha(grupo, id){
  (QT.items||[]).forEach(i=>{
    if(i.choice_group === grupo){
      QSEL.items[i.id] = (i.id === id);
      if(i.id !== id) delete QSEL.extras[i.id];
    }
  });
  drawQuote();
}
function marcaExtra(id, chave, on){
  const atual = QSEL.extras[id] || [];
  QSEL.extras[id] = on ? atual.concat([chave]) : atual.filter(k=>k!==chave);
  redesenharEscolha();
}
function marcaUnidade(id, chave, on){
  const atual = QSEL.units[id] || [];
  QSEL.units[id] = on ? atual.concat([chave]) : atual.filter(k=>k!==chave);
  redesenharEscolha();
}

/* Uma tabela por seção, com o título e a instrução em cima. Linha sem
   seção cai numa tabela final sem título — assim uma quote de transfer
   avulso não precisa de seção nenhuma para funcionar. */
/* Na página da proposta o agrupamento não é por seção: seção é a etapa
   da apresentação — "10 a 13 out", "13 a 17 out" são folhas do
   documento, não categorias de venda. Aqui saem dois grupos:
   hospedagem, e extras e opcionais válidos para a contratação dela. */
function tabelasPorTipo(t, mostra, linha, p){
  const itens = QT.items||[];
  const cab = `<thead><tr><th style="width:100px;">${t.date}</th><th>${t.service}</th>
      <th class="money">${mostra?t.price:""}</th></tr></thead>`;
  const grupo = (titulo, lista) => !lista.length ? "" :
    `<div class="blocktitle" style="margin-top:28px;">${esc(titulo)}</div>
     <table class="svc">${cab}<tbody>${lista.map(linha).join("")}</tbody></table>`;
  return grupo(rot(p,"stays_title",t.qStaysTitle),  itens.filter(i=>i.kind!=="extra"))
       + grupo(rot(p,"extras_title",t.qExtrasTitle), itens.filter(i=>i.kind==="extra"));
}

function tabelasPorSecao(t, mostra, linha){
  const p = QT.proposal, itens = QT.items||[];
  const secs = (p.sections||[]);
  const cab = `<thead><tr><th style="width:100px;">${t.date}</th><th>${t.service}</th>
      <th class="money">${mostra?t.price:""}</th></tr></thead>`;
  const tabela = lista => `<table class="svc">${cab}<tbody>${lista.map(linha).join("")}</tbody></table>`;

  let out = "";
  secs.forEach(sec=>{
    const lista = itens.filter(i=>i.section===sec.key);
    if(!lista.length) return;
    out += `<div class="blocktitle" style="margin-top:28px;">${esc(sec.title||"")}</div>`;
    if(sec.note) out += `<div class="muted" style="margin:-6px 0 10px;">${esc(sec.note)}</div>`;
    out += tabela(lista);
  });
  const chaves = secs.map(x=>x.key);
  const soltas = itens.filter(i=>!i.section || !chaves.includes(i.section));
  if(soltas.length) out += tabela(soltas);
  return out;
}

/* ---------------------------------------------- PROPOSTA APRESENTADA -- */
/* O fecho é o mesmo nos dois layouts: o que o cliente escolheu, o que
   não está incluso, as condições e o bloco de envio. Escrito uma vez —
   duplicado, um ajuste feito num layout sumiria do outro. */
/* semRodape: na proposta apresentada o link dos termos e o rodapé com
   os dados da empresa saem daqui. Não sumiram do documento — a
   contracapa é a página de contato, e repetir a mesma assinatura duas
   telas antes só polui a página onde ela quer o cliente escolhendo. */
function quoteFecho(p, t, mostra, respondida, comResumo, semRodape){
  if(comResumo === undefined) comResumo = true;
  return `
    ${p.excluded?`<div class="naoinc">
      <div class="blocktitle">${t.qExcluded}</div>
      <div class="condicoes">${fmtDoc(p.excluded)}</div>
    </div>`:""}

    ${(()=>{
      if(!comResumo) return "";
      const escolhidos = (QT.items||[]).filter(i=>QSEL.items[i.id]);
      if(!escolhidos.length) return "";
      const linhaRes = i => {
        const un = (i.units||[]).filter(u=>unidadeDentro(i,u));
        const ex = (i.extras||[]).filter(e=>(QSEL.extras[i.id]||[]).includes(e.key));
        return `<tr>
          <td class="date-cell">${esc(i.service_date||"")}</td>
          <td><div class="svc-title">${esc(i.title)}</div>
            ${un.map(u=>`<div class="mais">· ${esc(u.label||"")}</div>`).join("")}
            ${ex.map(e=>`<div class="mais">+ ${esc(p.lang==="en"?(e.label_en||e.label_pt):e.label_pt)}</div>`).join("")}</td>
          <td class="money">${mostra?eur(Number(i.price)||0):""}
            ${mostra?un.map(u=>`<div class="mais">${eur(u.price)}</div>`).join(""):""}
            ${mostra?ex.map(e=>`<div class="mais">${eur(e.price)}</div>`).join(""):""}</td>
        </tr>`;
      };
      return `<div class="resumo">
        <div class="blocktitle" style="margin-top:0;">${t.qResumo}</div>
        <div class="muted" style="margin:-6px 0 12px;">${t.qResumoSub}</div>
        <table class="svc">
          <thead><tr><th style="width:100px;">${t.date}</th><th>${t.service}</th>
            <th class="money">${mostra?t.price:""}</th></tr></thead>
          <tbody>${escolhidos.map(linhaRes).join("")}</tbody>
        </table>
        ${mostra?`<div class="total-row"><div class="total-box">
          <span class="lbl">${t.qYourTotal}</span><span class="amt">${eur(quoteTotal())}</span></div></div>`:""}
      </div>`;
    })()}

    ${p.conditions?`<div class="pagina-nova">
      <div class="blocktitle" style="margin-top:0;">${t.qCondTitle}</div>
      <div class="condicoes">${fmtDoc(p.conditions)}</div>
    </div>`:""}

    ${semRodape ? "" : `
    ${termsHref(p)?`<div class="terms-link" style="margin-top:26px;">${t.termsLinkLabel}
      <a href="${esc(termsHref(p))}" target="_blank" rel="noopener">${esc(termsHref(p))}</a></div>`:""}

    <div class="foot">
      <div class="co">TUSCAN LANDS TRAVEL</div>
      ${COMPANY.legal} · ${COMPANY.vat.replace(" · Pontassieve (FI), Italy","")} · ${COMPANY.email}
    </div>`}`;
}

/* O bloco de envio fica fora da folha do documento: ele é formulário,
   e some na impressão. Por isso é função à parte — cada layout põe onde
   faz sentido. */
/* Aqui o cliente não preenche dados de viajante: isso vem depois, na
   order, quando a venda já existe. Nesta tela ele diz quem está
   enviando, escolhe a forma de pagamento e confirma o interesse. */
function quoteConfirmar(t, respondida, pagamentos, p){
  const pgs = pagamentos || [];
  const L = (k,d)=>esc(rot(p||{}, k, d));
  /* Bloco simples: uma caixinha só. Não pede nome, e-mail, pagamento
     nem observações — o aviso de que enviar não bloqueia nada continua
     logo acima, que é o que sustenta essa tela mais curta. */
  if(!respondida && (p||{}).confirm_mode === "simple") return `
  <div class="confirm-block">
    <h2>${L("interest", t.qInterest)}</h2>
    <div class="rule"></div>
    <div class="check" style="margin-top:16px;"><input type="checkbox" id="qc-ack">
      <label for="qc-ack">${L("interest_ack", t.qInterestAck)} <span class="req">*</span></label></div>
    <div id="qc-msg" style="margin-top:14px;"></div>
    <button class="btn" id="qc-go" style="margin-top:16px;">${t.qSend}</button>
  </div>`;
  return `
  ${respondida?"":`
  <div class="confirm-block">
    <h2>${L("confirm",t.qConfirmar)}</h2>
    <div class="rule"></div>
    ${/* Na proposta da agência quem responde é a agência, e são duas
          pessoas: quem vende ao cliente e quem desenhou a viagem. O
          nome do designer não é exigido — muitas vezes é a mesma
          pessoa, e cobrar os dois travaria o envio à toa. */""}
    ${(p||{}).white_label?`
    <div class="grid3 fieldrow" style="margin-bottom:18px;">
      <div><label>${L("agent_name",t.qAgent)} <span class="req">*</span></label><input id="qc-name"></div>
      <div><label>${L("designer_name",t.qDesigner)}</label><input id="qc-designer"></div>
      <div><label>${t.leadEmail}</label><input id="qc-mail" type="email"></div>
    </div>`:`
    <div class="grid2 fieldrow" style="margin-bottom:18px;">
      <div><label>${t.leadName} <span class="req">*</span></label><input id="qc-name"></div>
      <div><label>${t.leadEmail}</label><input id="qc-mail" type="email"></div>
    </div>`}
    ${pgs.length?`<div class="pagto">
      <label>${L("pay",t.qPayHow)} <span class="req">*</span></label>
      ${pgs.map((o,k)=>`<div class="check"><input type="radio" name="qc-pay" id="qc-pay-${k}"
        value="${esc(o.label||"")}"><label for="qc-pay-${k}">${esc(o.label||"")}</label></div>`).join("")}
    </div>`:""}
    <div style="margin-top:16px;"><label>${t.remarks}</label><textarea id="qc-rem" rows="3"></textarea></div>
    <div class="check" style="margin-top:18px;"><input type="checkbox" id="qc-ack">
      <label for="qc-ack">${t.qAck} <span class="req">*</span></label></div>
    <div id="qc-msg" style="margin-top:14px;"></div>
    <button class="btn" id="qc-go" style="margin-top:16px;">${t.qSend}</button>
  </div>`}`;
}

/* "2 × € 450,00" embaixo do título: a agência entende de onde saiu o
   número sem ter de perguntar. Só com quantidade acima de um, e só
   quando a proposta sai com valores — a linha carrega um preço. */
function qtdLinha(i, mostra){
  const q = Number(i.qty)||1, u = i.unit_price;
  if(!mostra || q <= 1 || u == null) return "";
  const n = q % 1 === 0 ? String(q) : String(q).replace(".", ",");
  return `${n} × ${eur(u)}`;
}

function apItem(i, t, p, mostra, respondida){
  const fotos = (i.photos||[]).filter(u=>u&&u.trim()).slice(0,3);
  const anexos = (i.attachments||[]).filter(a=>a&&a.url);
  const ex = i.extras||[];
  return `<div class="ap-card">
    ${/* Sem loading="lazy": a etapa fica escondida até a pessoa chegar
          nela, e imagem preguiçosa que nunca entrou na tela não carrega
          na hora de imprimir — as fotos saíam em branco no PDF. São no
          máximo três por hospedagem. */""}
    ${fotos.length?`<div class="ap-fotos f${fotos.length}">${fotos.map(u=>
      `<img src="${esc(u.trim())}" alt="">`).join("")}</div>`:""}
    <div class="ap-corpo">
      <div class="ap-topo">
        <div>
          ${i.service_date?`<div class="ap-data">${esc(i.service_date)}</div>`:""}
          <div class="ap-nome">${esc(i.title)}</div>
          ${i.room_type && !(i.units||[]).length?`<div class="ap-quarto">${esc(i.room_type)}</div>`:""}
        </div>
        ${mostra?`<div class="ap-preco">${eur(linhaTotal(i))}
          ${qtdLinha(i,mostra)?`<span class="ap-qtd">${qtdLinha(i,mostra)}</span>`:""}</div>`:""}
      </div>
      ${(i.units||[]).length?`<div class="ap-unidades">
        ${(i.units||[]).map(u=>`<div class="ap-unidade">
          <span>${esc(u.label||"")}</span>
          ${mostra?`<b>${eur(u.price)}</b>`:""}</div>`).join("")}
      </div>`:""}
      ${i.details?`<div class="ap-desc">${fmtDoc(i.details)}</div>`:""}
      ${i.included?`<div class="ap-estrutura">
        <div class="k">${t.qIncluded}</div>${fmtDoc(i.included)}</div>`:""}
      ${i.facilities?`<div class="ap-estrutura">
        <div class="k">${t.qFacilities}</div>${fmtDoc(i.facilities)}</div>`:""}
      ${i.website?`<div class="ap-link"><a href="${esc(i.website)}" target="_blank" rel="noopener">${t.qSite}</a></div>`:""}
      ${anexos.length?`<div class="ap-anexos">${anexos.map(a=>
        `<a href="${esc(a.url)}" target="_blank" rel="noopener" class="ap-anexo">${esc(a.name||"PDF")}</a>`).join("")}</div>`:""}
      ${ex.length?`<div class="ap-extras">

          mostra?` <span>· ${eur(e.price)}</span>`:""}</div>`).join("")}
      </div>`:""}
    </div>
  </div>`;
}

/* Rótulo da proposta: o que ela escreveu, e o padrão do hub quando ela
   não escreveu nada. Um lugar só, para não haver rótulo que escapa. */
function rot(p, chave, padrao){
  const v = (p.labels||{})[chave];
  return (v && String(v).trim()) ? v : padrao;
}

let APASSO = 0;
/* Marcar um serviço redesenha a etapa inteira, porque o total muda. O
   redesenho passava por apIr, que rolava para o topo: ela marcava uma
   caixinha, a tela subia, e ela tinha de descer de novo para marcar a
   seguinte. Agora só se rola ao TROCAR de etapa; ficando na mesma, a
   página fica onde estava. */
function apIr(n, manterRolagem){
  const total = document.querySelectorAll(".ap-passo").length;
  const antes = APASSO;
  APASSO = Math.max(0, Math.min(n, total-1));
  document.querySelectorAll(".ap-passo").forEach((el,k)=>{
    el.style.display = k===APASSO ? "" : "none";
  });
  document.querySelectorAll(".ap-indice nav button").forEach((b,k)=>{
    b.className = k===APASSO ? "on" : "";
  });
  // A capa é a primeira coisa que o cliente vê: ocupa a tela inteira,
  // sem menu ao lado. O índice entra a partir da segunda etapa.
  const raiz = document.querySelector(".apres");
  if(raiz) raiz.classList.toggle("na-capa", APASSO === 0);
  if(!manterRolagem && APASSO !== antes) window.scrollTo(0,0);
}
function apAnda(d){ apIr(APASSO + d); }

function drawQuoteApresentada(){
  const p = QT.proposal, t = T[p.lang||"pt"], mostra = p.show_prices !== false;
  const respondida = !!p.responded_at;
  const itens = QT.items||[];
  /* O extra não vira etapa da apresentação. Ele existe para ser
     contratado junto da hospedagem, e o lugar dele é a página da
     proposta, no grupo dos extras — uma folha inteira de apresentação
     para um transfer é uma folha que ninguém pediu. */
  const daPeca = itens.filter(i=>i.kind!=="extra");
  const secs = (p.sections||[]).filter(sec=>daPeca.some(i=>i.section===sec.key));
  const chaves = secs.map(x=>x.key);
  const soltas = daPeca.filter(i=>!i.section || !chaves.includes(i.section));
  const dias = p.itinerary||[];

  /* Uma etapa por vez, com avançar e voltar. Rolagem contínua misturava
     as seções e — pior — o índice mudava o endereço da página, o que o
     hub lia como "trocar de tela" e jogava de volta no Painel. Aqui
     ninguém mexe no endereço: a navegação é só troca de etapa. */
  /* Proposta assinada pela agência: quem aparece na capa é ela, e não a
     Tuscan Lands. Sem logo dela no cadastro, sai o nome da agência em
     texto — o logo da casa aqui contradiria a própria chave. */
  const daAgencia = !!p.white_label;
  const logoCapa  = daAgencia ? (p.agency_logo||"") : LOGO_BRANCO;
  const marcaCapa = daAgencia ? (p.agency||"") : "TUSCAN LANDS TRAVEL";
  const fundoLogo = daAgencia && p.agency_logo_bg ? " com-fundo" : "";

  const passos = [];
  passos.push({txt:rot(p,"cover_menu",t.qCover), html:`
    <section class="ap-capa-sec ap-passo">
      <div class="ap-capa">
        ${p.cover_img?`<img class="ap-fundo" src="${esc(p.cover_img)}" alt="">`:""}
        ${/* O logo fica no ALTO da capa, e não colado no bloco de texto
              lá embaixo: instrução dela em agosto/26, para dar presença
              a quem assina. O bloco de texto continua no pé. */""}
        <div class="ap-capa-topo">
          ${logoCapa?`<img class="ap-logo-capa${fundoLogo}${daAgencia?" da-agencia":""}" src="${esc(logoCapa)}" alt="${esc(marcaCapa)}"

        </div>
        <div class="ap-capa-in">
          ${p.cover_tag?`<div class="ap-tag">${esc(p.cover_tag)}</div>`:""}
          ${/* Era sempre o cliente final ou a agência. Virou texto
                dela, e em branco a capa sai sem nome nenhum — o banco
                resolve o nulo para o de antes, então proposta que já
                existe não muda sozinha. */""}
          ${(p.cover_title||"").trim()?`<h1>${esc(p.cover_title)}</h1>`:""}
          <div class="ap-datas">${esc(p.travel_window||"")}</div>
          ${p.crm_code?`<div class="ap-ref">${esc(p.crm_code)}</div>`:""}
          <button class="ap-cta" onclick="apAnda(1)">${esc(rot(p,"cta",t.qStart))}</button>
        </div>

  /* A capa da folha é a foto da seção. Não tendo, vale a primeira foto
     da primeira hospedagem daquela folha — melhor a foto do hotel do
     que uma faixa vazia, e evita depender de ela colar o link em dois
     lugares. Escolhendo uma na seção, a dela ganha. */
  const capaDe = (sec, lista) => (sec && (sec.photo||"").trim())
    || ((lista||[]).map(i=>(i.photos||[])[0]).find(u=>u && String(u).trim()) || "");

  const bloco = (sec, lista) => `<section class="ap-sec ap-passo" style="display:none;">

      </div>
    </div>
    <div class="ap-lista">
      ${lista.map(i=>apItem(i,t,p,mostra,respondida)).join("")}
      ${apNav(t)}

  </section>`;

  /* "Sobre nós" vem logo depois da capa, e não no fim: o cliente sabe
     com quem está falando antes de ver o que está sendo proposto.
     Instrução dela em agosto/26.

     Na proposta da agência esta mesma folha muda de assunto: o foco é a
     agência, e não a Tuscan Lands. Sai o texto de respaldo — a agência
     desenha, a DMC licenciada opera — com as credenciais embaixo, que
     são justamente o que dá segurança ao cliente. Uma folha só, porque
     duas apresentações seguidas disputariam a atenção. */
  const abertura = daAgencia ? (p.assurance||"") : (p.about||"");
  const chaveAb  = daAgencia ? "assurance" : "about";
  const tituloAb = daAgencia ? t.qAssurance : t.qAbout;
  /* A foto da folha do convite é campo dela, e não herança da primeira
     hospedagem: a faixa aparecia com uma foto que ela não escolheu.
     Em branco, a folha sai sem faixa. */
  const fotoAb   = daAgencia ? (p.assurance_img||"") : (p.about_img||"");
  if(abertura) passos.push({txt:rot(p,chaveAb,tituloAb), html:`
    <section class="ap-sec ap-passo${fotoAb?" faixa-topo":" sem-foto"}" style="display:none;">
      ${/* Na folha da agência a faixa não leva título: a chamada em
            negrito do texto já é o título, e dois títulos na mesma
            folha disputam a leitura. É assim na peça que as agências
            já aprovaram. */""}
      ${fotoAb?`<div class="ap-foto ap-foto-sobre${daAgencia?" sem-tarja":""}">
        <img class="ap-fundo" src="${esc(fotoAb)}" alt="">

      <div class="ap-lista">
        <div class="ap-sobre-txt">${fmtDoc(abertura)}</div>
        ${/* As credenciais NÃO saem mais na folha. Instrução dela em
              agosto/26, vendo a proposta da Jette Sette: a lista de
              número de registro no meio de uma folha de abertura que
              fala da Itália é ruído, e reivindica a venda justamente na
              página em que a agência é quem assina. As colunas
              continuam na proposta e no padrão da casa — o que sai é a
              exibição. Não repor sem instrução dela. */""}
        ${apNav(t)}
      </div>

  secs.forEach(sec=>passos.push({txt:sec.title||sec.key, html:bloco(sec, daPeca.filter(i=>i.section===sec.key))}));

  if(dias.length) passos.push({txt:t.qItinerary, html:`

        <tbody>${dias.map(d=>`<tr><td class="date-cell">${esc(d.date||"")}</td>
          <td><ul>${(d.lines||[]).map(l=>`<li>${esc(l)}</li>`).join("")}</ul></td></tr>`).join("")}</tbody>
      </table>${apNav(t)}</div>

  passos.push({txt:rot(p,"prop_menu",t.qPropMenu), html:`
    <section class="ap-sec ap-fim ap-passo" style="display:none;">
      <div class="ap-foto ap-foto-fim">
        <img class="ap-fundo" src="${IMG_RESUMO}" alt="">
        <div class="ap-foto-txt">
          <div class="ap-ey">${esc(p.crm_code||"")}</div>
          <h2>${esc(rot(p,"prop_title",t.qResumo))}</h2>
          ${rot(p,"prop_lead",t.qResumoLead)?`<div class="ap-note">${esc(rot(p,"prop_lead",t.qResumoLead))}</div>`:""}
          </div></div>
      <div class="ap-lista larga">
        <div class="doc" style="box-shadow:none;padding:0;background:transparent;">
          ${tabelasPorTipo(t, mostra, i=>quoteLinha(i,t,p,mostra,respondida), p)}
          ${mostra?`<div class="total-row"><div class="total-box">
            <span class="lbl">${t.qYourTotal}</span><span class="amt">${eur(quoteTotal())}</span></div></div>`
           :`<div class="voucher-note" style="margin-top:18px;">${t.qNoPrices}</div>`}
          ${quoteFecho(p, t, mostra, respondida, false, true)}
        </div>
        <div class="ap-aviso">${esc(rot(p,"notice",t.qNaoBloqueio))}</div>
        ${quoteConfirmar(t, respondida, p.payment_options, p)}
        ${apNav(t)}
      </div>
    </section>`});

  /* A contracapa é a página de contato da Tuscan Lands. Na proposta da
     agência ela não sai: seria mandar o cliente falar direto com a
     operação, por cima de quem vendeu. Ali a última folha é a proposta
     comercial mesmo. */
  if(p.backcover && !daAgencia) passos.push({txt:rot(p,"contact",t.qContact), html:`
    <section class="ap-sec ap-passo ap-contracapa${p.backcover_img?" com-foto":""}" style="display:none;">
      ${p.backcover_img?`<img class="ap-fundo" src="${esc(p.backcover_img)}" alt="">`:""}
      <div class="ap-lista larga">
        <img class="ap-logo-fim" src="${p.backcover_img?LOGO_BRANCO:LOGO}" alt="Tuscan Lands"
             onerror="this.style.display='none';">

        ${apNav(t)}

  app.innerHTML = `
  <div class="apres">
    <aside class="ap-indice noprint">
      ${logoCapa?`<img class="ap-logo${fundoLogo}" src="${esc(logoCapa)}" alt="${esc(marcaCapa)}"

      <div class="ap-marca" style="display:${logoCapa?"none":"block"};">${esc(marcaCapa)}</div>
      <nav>${passos.map((x,k)=>`<button onclick="apIr(${k})" class="${k===0?"on":""}">${esc(x.txt)}</button>`).join("")}</nav>
      <div class="ap-rodape-idx">
        ${mostra?`<div class="ap-tot"><span>${t.qYourTotal}</span><b id="ap-total">${eur(quoteTotal())}</b></div>`:""}

  /* A última etapa não leva "avançar". Qual é a última muda de proposta
     para proposta — a contracapa não sai na da agência, e a folha de
     abertura só existe se tiver texto —, então isso se decide aqui,
     contando as etapas desenhadas, e não com uma marca fixa na etapa
     que um dia foi a última. */
  const etapas = [...app.querySelectorAll(".ap-passo")];
  const ultima = etapas[etapas.length - 1];
  if(ultima){
    const avancar = ultima.querySelector(".ap-nav .ap-btn:not(.ghost)");
    if(avancar) avancar.remove();

  if(!respondida && el("qc-go")) el("qc-go").onclick = submitQuote;
  precarregarFotos(p, itens);
  paginaSemMargem();
  apIr(APASSO, true);

}

/* @page não aceita seletor: não dá para dizer "sem margem só nesta
   tela" pela folha de estilo. A proposta apresentada injeta a regra ao
   desenhar, e como ela só existe nesta rota, o documento da order e o
   relatório de comissão continuam com a margem de 14mm. */
/* Fundo em CSS dentro de uma etapa escondida nunca é buscado pelo
   navegador: display:none não carrega background-image. Na tela isso
   só atrasava a foto até a pessoa chegar na etapa; na impressão as
   etapas aparecem todas de uma vez e as fotos que ninguém tinha
   visitado saíam em branco — foi o que aconteceu com a folha do
   "Sobre nós". Puxar as imagens na hora de desenhar resolve os dois. */
function precarregarFotos(p, itens){
  const urls = [p.cover_img, p.about_img, p.backcover_img]
    .concat((p.sections||[]).map(s=>s.photo))
    .concat((itens||[]).flatMap(i=>i.photos||[]))
    .filter(u=>u && String(u).trim());
  urls.forEach(u=>{ const i = new Image(); i.src = String(u).trim(); });
}

function paginaSemMargem(){
  if(document.getElementById("pg-apres")) return;
  const st = document.createElement("style");
  st.id = "pg-apres";
  st.textContent = "@media print{@page{size:A4;margin:0;}}";
  document.head.appendChild(st);
}

/* Baixar abre o "Salvar em PDF" do navegador, já com a proposta inteira
   montada — capa, uma folha por hospedagem, serviços, condições e
   contracapa. Ela pediu um download direto, e não a caixa; um clique
   só, sem caixa nenhuma, exigiria desenhar o PDF por fora: ou uma
   biblioteca no navegador, que rasteriza o texto e vira um segundo
   desenho para manter, ou um serviço que renderize a página no
   servidor. Ficou registrado como pendência; o que sai daqui é
   vetorial e não perde qualidade. */
/* Baixar é DOWNLOAD, e não a caixa de impressão: a função
   /.netlify/functions/proposta-pdf abre esta mesma página num navegador
   sem tela e devolve o arquivo pronto. O texto sai vetorial e o desenho
   é o da folha de impressão que já está aprovada — não existe um
   segundo layout para manter, e nada vira imagem.

   Se a função ainda não estiver publicada, cai na caixa de impressão em
   vez de deixar ela sem saída. */
/* DOWNLOAD DE VERDADE, e não arquivo aberto na tela.
   Montar o arquivo em memória e entregar por blob faz o Chrome abrir o
   visualizador de PDF e só depois oferecer salvar. O que baixa mesmo é
   deixar o NAVEGADOR buscar o endereço: a função responde com
   Content-Disposition: attachment e o nome do arquivo, e o navegador
   faz o que faz com qualquer arquivo da internet — baixa, com o nome
   certo, sem abrir nada. */
function baixarProposta(){
  const btn = document.querySelector(".ap-baixar");
  const rot = btn ? (btn.getAttribute("data-rot") || btn.textContent) : "";
  if(btn){ btn.setAttribute("data-rot", rot); btn.disabled = true; btn.textContent = "Montando o PDF…"; }
  const nome = (QT.proposal.crm_code || QT.proposal.title || "proposta")
    .replace(/[^\w.-]+/g,"-") || "proposta";
  const url = "/api/proposta-pdf?token=" + encodeURIComponent(QT.token)
    + "&nome=" + encodeURIComponent(nome) + "&t=" + Date.now();

  const a = document.createElement("a");
  a.href = url; a.download = nome + ".pdf"; a.rel = "noopener";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();

  /* O navegador leva alguns segundos montando antes de a barra de
     download aparecer. O botão fica avisando nesse tempo e volta ao
     normal depois — não há como saber daqui quando o arquivo chegou. */
  setTimeout(()=>{ if(btn){ btn.disabled = false; btn.textContent = rot; } }, 25000);
}

/* Avançar e voltar em toda etapa: o cliente revisa a proposta inteira
   sem sair dela e sem depender do botão do navegador. */
function apNav(t, fim){
  return `<div class="ap-nav noprint">
    <button class="ap-btn ghost" onclick="apAnda(-1)">← ${t.qBack}</button>
    ${fim?"":`<button class="ap-btn" onclick="apAnda(1)">${t.qNext} →</button>`}
  </div>`;
}

function drawQuote(){
  const p = QT.proposal, t = T[p.lang||"pt"], mostra = p.show_prices !== false;
  const respondida = !!p.responded_at;

  // A proposta apresentada troca só o corpo: capa, índice e blocos de
  // hospedagem no lugar das tabelas. Resumo, condições e envio são os
  // mesmos — é a mesma proposta, com outra roupa.
  if(p.layout === "apresentada") return drawQuoteApresentada();

  const cabeca = `
    <div class="head">
      <div class="brand">
        <img class="logo-img" src="${LOGO}" alt="Tuscan Lands"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <div class="logo-text" style="display:none;">TUSCAN LANDS TRAVEL</div>
        <div class="contact">${COMPANY.legal}<br>${COMPANY.vat}<br>${COMPANY.email}</div>
      </div>

        ${p.crm_code?`<div class="lbl">${t.ref}</div><div class="val">${esc(p.crm_code)}</div>`:""}

  <div class="docpad" style="padding:24px 12px;background:var(--cream);">
  <div class="doc">
    ${cabeca}

    <div class="intro" style="text-align:left;">${respondida?t.qAlready:t.qLead}</div>

    <div class="meta">
      <div class="cell"><div class="k">${t.to}</div><div class="v">${esc(p.final_client||p.agency||"—")}</div></div>
      <div class="cell"><div class="k">${t.pax}</div><div class="v">${esc(p.pax_summary||"—")}</div></div>
      <div class="cell"><div class="k">${t.period}</div><div class="v">${esc(p.travel_window||"—")}</div></div>
      <div class="cell"><div class="k">${t.qTitle}</div><div class="v">v${p.version}</div></div>
    </div>

    ${p.intro?`<div class="intro">${fmtDoc(p.intro)}</div>`:""}

    ${tabelasPorSecao(t, mostra, i=>quoteLinha(i,t,p,mostra,respondida))}

    ${mostra?`<div class="total-row"><div class="total-box">
      <span class="lbl">${t.qYourTotal}</span><span class="amt">${eur(quoteTotal())}</span></div></div>`
     :`<div class="voucher-note" style="margin-top:18px;">${t.qNoPrices}</div>`}

    ${p.payment_note?`<div class="pay-note">${nl2br(p.payment_note)}</div>`:""}

    ${quoteFecho(p, t, mostra, respondida)}
  </div>
  ${quoteConfirmar(t, respondida, p.payment_options, p)}

}
