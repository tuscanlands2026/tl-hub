<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuscan Lands · Hub</title>
<!-- Uma fonte só, seção 8 do plano. Variação por peso, tamanho e cor. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* =====================================================================
   IDENTIDADE VISUAL — seção 8 do plano, com a correção de agosto/26.

   O módulo inteiro é SAGE, interface e documento do cliente. A seção 8
   reservava terracota para "confirmação e fechamento" e mandava o
   documento do cliente sair nessa cor; por instrução da Maria Fernanda
   isso mudou: terracota é do Booking, que é outro módulo. Aqui não entra.
   O terracota continua na paleta, mas sem uso — não reintroduzir.

   Copper é o acento quente: réguas, overlines de documento, marcações.
   Uma fonte só, border-radius zero, sem exceção.
   ===================================================================== */
:root{
  --cream-light:#f6f3f0; --cream:#eae4db; --terracotta:#772f25;
  --sage:#595e49; --brown:#a2564c; --copper:#a56850;
  --ink:#2a2a28; --muted:#6b6860; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;}
/* Interface: peso 400, ferramenta usada horas por dia. */
body{font-family:'Libre Franklin',Helvetica,Arial,sans-serif;font-weight:400;
  font-size:14px;line-height:1.5;color:var(--ink);background:var(--cream-light);
  -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:inherit;font-weight:500;letter-spacing:-.01em;line-height:1.25;}
a{color:var(--sage);}
input,select,textarea,button{font-family:inherit;font-size:13px;font-weight:400;color:var(--ink);}
input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--cream);background:#fff;}
input:focus,select:focus,textarea:focus{outline:1px solid var(--sage);}
input:disabled,select:disabled,textarea:disabled{background:var(--cream-light);color:var(--muted);}
textarea{resize:vertical;line-height:1.55;}
label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sage);font-weight:500;margin-bottom:4px;}
.btn{font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.18em;
  padding:10px 16px;border:1px solid var(--sage);background:var(--sage);color:#fff;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--sage);}
.btn:disabled{opacity:.45;cursor:default;}
.btn.sm{padding:6px 11px;font-size:10px;letter-spacing:.14em;}
.hide{display:none !important;}

/* ---------- shell ---------- */
.topbar{background:var(--sage);color:#fff;padding:12px 22px;display:flex;align-items:center;gap:14px;}
.topbar .mark{font-size:14px;letter-spacing:.22em;font-weight:500;}
.topbar .sep{opacity:.45;}
.topbar .ctx{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;opacity:.9;}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.topbar .right button{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;padding:5px 11px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;font-weight:500;}
.wrap{max-width:1080px;margin:0 auto;padding:24px 22px 80px;}
.card{background:#fff;border:1px solid var(--cream);padding:20px;}
.card+.card{margin-top:16px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.overline{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.rule{width:30px;height:1px;background:var(--sage);margin:9px 0 16px;}
.muted{color:var(--muted);font-size:12.5px;line-height:1.6;}
.hint{color:var(--muted);font-size:11.5px;line-height:1.55;margin-bottom:12px;}

/* ---------- login / setup ---------- */
.gate{max-width:380px;margin:12vh auto;padding:0 22px;}
.gate .mark{font-size:19px;letter-spacing:.26em;color:var(--sage);text-align:center;font-weight:500;}
.gate .sub{text-align:center;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--muted);margin:8px 0 28px;}
.msg{font-size:12.5px;padding:9px 11px;border-left:2px solid var(--brown);background:#fbf7f4;
  color:var(--brown);line-height:1.55;}

/* ---------- lista ---------- */
table.list{width:100%;border-collapse:collapse;background:#fff;}
table.list thead th{background:var(--sage);color:#fff;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:500;padding:10px 11px;text-align:left;}
table.list tbody td{padding:10px 11px;border-bottom:1px solid var(--cream);font-size:13px;vertical-align:middle;}
table.list tbody tr:hover{background:var(--cream-light);cursor:pointer;}
.badge{display:inline-block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:500;padding:3px 8px;color:#fff;}
.badge.draft{background:var(--muted);}
.badge.sent{background:var(--copper);}      /* prestes a fechar */
.badge.confirmed{background:var(--sage);}  /* fechado */

/* ---------- editor ---------- */
.editor-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;}
.editor-head h1{font-size:25px;color:var(--sage);font-weight:500;}
.editor-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.section-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);
  font-weight:500;border-bottom:1px solid var(--cream);padding-bottom:6px;margin-bottom:14px;}
table.rows{width:100%;border-collapse:collapse;}
table.rows th{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);
  font-weight:500;text-align:left;padding:0 7px 5px 0;}
table.rows td{padding:0 7px 7px 0;vertical-align:top;}
table.rows td.x{width:30px;padding-right:0;}
.iconbtn{border:none;background:none;color:var(--brown);cursor:pointer;font-size:15px;padding:7px 4px;}
.totalline{display:flex;justify-content:flex-end;gap:28px;align-items:baseline;margin-top:12px;}
.totalline .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.totalline .amt{font-size:22px;font-weight:400;color:var(--sage);font-variant-numeric:tabular-nums;}
.linkbox{display:flex;gap:7px;align-items:center;margin-top:10px;}
.linkbox input{font-size:12px;color:var(--muted);}
.closing{border-top:1px solid var(--cream);margin-top:18px;padding-top:16px;}
.closing .section-title{color:var(--sage);}

/* ---------- configuração do checkout ---------- */
.cfg-row{display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--cream);}
.cfg-row .name{font-size:13px;}
.cfg-row .name small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.45;}
.cfg-row.fixed .name small{color:var(--sage);}
.cfg-fill{padding:10px 0 4px 0;border-bottom:1px solid var(--cream);}
.cfg-fill .inner{border-left:2px solid var(--copper);padding-left:12px;}
.addbar{display:grid;grid-template-columns:190px 1fr auto auto;gap:7px;align-items:end;
  margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--cream);}
.fld-lbl-en{margin-top:4px;font-size:12px;color:var(--muted);}
.tag{display:inline-block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;padding:2px 6px;border:1px solid var(--copper);color:var(--copper);}

/* =====================================================================
   DOCUMENTO — o que sai da casa. Peso 300, respiração ampla,
   texto justificado. Terracota, porque é o que fecha.
   ===================================================================== */
.doc{max-width:900px;margin:0 auto;background:#fff;padding:46px 50px;
  box-shadow:0 1px 12px rgba(0,0,0,.07);font-weight:300;line-height:1.6;}
.doc .head{display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:2px solid var(--sage);padding-bottom:18px;}
.doc .brand .logo-img{height:74px;width:auto;display:block;margin-bottom:11px;}
.doc .brand .logo-text{font-size:19px;letter-spacing:.26em;color:var(--sage);font-weight:500;}
.doc .brand .contact{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.65;}
.doc .to{text-align:right;max-width:320px;}
.doc .to .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);font-weight:500;}
.doc .to .val{font-size:16px;margin:2px 0 8px;line-height:1.35;font-weight:400;}
.doc h1.doctitle{font-size:24px;font-weight:500;color:var(--sage);margin:24px 0 4px;letter-spacing:-.01em;}
.doc .meta{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 8px;border:1px solid var(--cream);}
.doc .meta .cell{padding:11px 13px;border-right:1px solid var(--cream);}
.doc .meta .cell:last-child{border-right:none;}
.doc .meta .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);font-weight:500;}
.doc .meta .v{font-size:13.5px;margin-top:4px;font-weight:400;}
.doc .intro{font-size:13.5px;line-height:1.8;text-align:justify;margin:20px 0 4px;white-space:pre-wrap;}
.doc .blocktitle{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);
  font-weight:500;border-bottom:1px solid var(--cream);padding-bottom:6px;margin:26px 0 12px;}
.doc table.svc{width:100%;border-collapse:collapse;margin-top:20px;}
.doc table.svc thead th{background:var(--sage);color:#fff;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:500;padding:10px 12px;text-align:left;}
.doc table.svc thead th.money{text-align:right;width:130px;}
.doc table.svc tbody td{padding:11px 12px;border-bottom:1px solid var(--cream);vertical-align:top;font-size:13.5px;}
.doc table.svc tbody td.money{text-align:right;font-variant-numeric:tabular-nums;}
.doc table.svc tbody tr:nth-child(even){background:var(--cream-light);}
.doc .date-cell{font-weight:500;color:var(--sage);white-space:nowrap;}
.doc .svc-title{font-weight:400;}
.doc .svc-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6;white-space:pre-wrap;}
.doc .total-row{display:flex;justify-content:flex-end;margin-top:18px;}
.doc .total-box{background:var(--cream);padding:14px 26px;display:flex;gap:36px;align-items:baseline;}
.doc .total-box .lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.doc .total-box .amt{font-size:24px;color:var(--sage);font-weight:400;font-variant-numeric:tabular-nums;}
.doc table.pay{width:100%;border-collapse:collapse;margin-top:12px;}
.doc table.pay th{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);
  font-weight:500;text-align:left;padding:7px 9px;border-bottom:1px solid var(--cream);}
.doc table.pay td{padding:8px 9px;border-bottom:1px solid var(--cream);font-size:13px;}
.doc table.pay td.money{text-align:right;font-variant-numeric:tabular-nums;}
.doc .voucher-note{margin-top:18px;font-size:13px;color:var(--muted);line-height:1.7;
  border-left:2px solid var(--copper);padding-left:12px;}
.doc .pay-note{margin-top:10px;font-size:13px;line-height:1.7;color:var(--ink);white-space:pre-wrap;}
.trav-head{display:grid;grid-template-columns:1fr 170px 30px;gap:7px;margin-bottom:5px;
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);font-weight:500;}
.doc .terms{margin-top:32px;border-top:1px solid var(--cream);padding-top:20px;}
.doc .terms h2{font-size:20px;color:var(--sage);text-align:center;margin-bottom:6px;font-weight:500;}
.doc .terms h3{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--copper);
  font-weight:500;margin:20px 0 9px;border-bottom:1px solid var(--cream);padding-bottom:5px;}
.doc .terms ol{margin:0 0 4px 18px;}
.doc .terms li{font-size:12px;line-height:1.7;margin-bottom:8px;text-align:justify;}
.doc .terms ul{margin:7px 0 4px 18px;}
.doc .terms-link{margin-top:16px;font-size:12.5px;line-height:1.6;}
.doc .terms-link a{color:var(--sage);text-decoration:underline;text-underline-offset:2px;word-break:break-word;}
.doc .foot{margin-top:28px;text-align:center;font-size:10.5px;color:var(--muted);line-height:1.75;}
.doc .foot .co{font-size:12px;color:var(--sage);letter-spacing:.22em;font-weight:500;}
/* Retrato dos dados no resumo interno */
.doc table.data{width:100%;border-collapse:collapse;margin-top:4px;}
.doc table.data th{width:230px;text-align:left;font-size:11px;letter-spacing:.1em;color:var(--muted);
  font-weight:400;padding:7px 14px 7px 0;vertical-align:top;border-bottom:1px solid var(--cream);}
.doc table.data td{font-size:13.5px;padding:7px 0;vertical-align:top;border-bottom:1px solid var(--cream);
  white-space:pre-wrap;}
.doc .blank{color:var(--brown);}
.doc .ack{font-size:13px;line-height:1.7;margin-bottom:7px;}
.doc .ack b{font-weight:500;}

/* ---------- formulário de confirmação ---------- */
.confirm-block{max-width:900px;margin:24px auto 60px;background:#fff;border:1px solid var(--cream);
  padding:38px 50px;font-weight:400;}
.confirm-block h2{font-size:22px;color:var(--sage);font-weight:500;}
.confirm-block .rule{background:var(--copper);}
.confirm-block .section-title{color:var(--sage);letter-spacing:.2em;}
.pax-row{display:grid;grid-template-columns:1fr 30px;gap:7px;margin-bottom:7px;align-items:center;}
/* Rótulo de duas linhas empurrava só a sua caixa para baixo, e a fileira
   saía torta. Cada célula vira coluna e a caixa desce para o rodapé dela,
   então as caixas alinham por baixo mesmo com rótulos de alturas
   diferentes. */
.fieldrow > div{display:flex;flex-direction:column;}
.fieldrow > div > input,.fieldrow > div > select,.fieldrow > div > textarea{margin-top:auto;}
.trav-row{display:grid;grid-template-columns:1fr 170px 30px;gap:7px;margin-bottom:7px;align-items:center;}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.65;margin-bottom:12px;}
.check input{width:auto;margin-top:3px;}
.check label,.check .checktext{font-size:13px;letter-spacing:0;text-transform:none;
  color:var(--ink);font-weight:400;margin:0;}
.check .checktext{cursor:pointer;}
.check .checktext a{color:var(--sage);text-decoration:underline;text-underline-offset:2px;}
.req{color:var(--brown);font-weight:500;}
.fld{margin-bottom:14px;}
.fld .pre{font-size:11.5px;color:var(--copper);margin-top:4px;line-height:1.5;}
/* Rótulo curto é overline e vive bem em caixa alta. Pergunta inteira em
   caixa alta parece grito, e quem está lendo é o cliente. */
.fld label.q{text-transform:none;letter-spacing:0;font-size:13.5px;font-weight:400;
  color:var(--ink);line-height:1.55;margin-bottom:6px;}
.fld label.q .req{font-weight:400;}
.done{max-width:620px;margin:16vh auto;text-align:center;padding:0 22px;}
.done h2{font-size:26px;color:var(--sage);margin-bottom:12px;font-weight:500;}

/* screen and — sem isso a regra vale para qualquer mídia, e a impressão
   cai nela: página Carta com margem dá cerca de 710px de largura útil, e
   o documento saía empilhado em coluna única, como num celular. Foi o que
   desconfigurou o PDF de confirmação. */
@media screen and (max-width:760px){
  .grid2,.grid3,.doc .meta{grid-template-columns:1fr;}
  .doc{padding:26px 18px;}
  .confirm-block{padding:26px 18px;}
  .doc .head{flex-direction:column;gap:16px;}
  .doc .to{text-align:left;}
  .cfg-row{grid-template-columns:1fr;}
  .addbar{grid-template-columns:1fr;}
  .doc table.data th{width:auto;display:block;border-bottom:none;padding-bottom:0;}
  .doc table.data td{display:block;padding-top:2px;}
}

/* =====================================================================
   IMPRESSÃO — Ctrl+P sai só com o documento. Interface, navegação e
   formulário somem. Vale para o documento do cliente e para o resumo.
   ===================================================================== */
@media print{
  @page{margin:14mm;}
  body{background:#fff;}
  .topbar,.editor-actions,.confirm-block,.noprint{display:none !important;}
  .doc{box-shadow:none;max-width:none;padding:0;}
  .docpad{padding:0 !important;background:#fff !important;}
  .doc table.svc thead th{background:var(--sage)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .doc table.svc tbody tr:nth-child(even){background:var(--cream-light)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .doc .total-box{background:var(--cream)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .doc .head{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  /* RODAPÉ. Ele fica logo depois do conteúdo, e não colado no pé da
     última página. Não é escolha: o motor de impressão do navegador não
     tem como fixar rodapé só na última página. As três saídas foram
     testadas e as três falharam — coluna flex com altura mínima de uma
     página joga o rodapé para uma página nova quase em branco;
     position:fixed some do PDF; table-footer-group desmonta o layout.
     Então ele fica onde o texto termina, separado por régua e com folga,
     lendo como rodapé em vez de parecer conteúdo interrompido. */
  .doc .foot{break-inside:avoid;border-top:1px solid var(--cream);
    margin-top:26px;padding-top:14px;}
  .doc .terms h3,.doc .blocktitle{break-after:avoid;}
  .doc .terms li,.doc table.data tr{break-inside:avoid;}
  .doc table.svc thead{display:table-header-group;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — cole aqui a URL e a anon key do projeto Supabase do HUB.
   Enquanto estiverem vazias, o app pede as duas na tela (só na sessão).
   ===================================================================== */
/* Endereço público do hub, o que a agência vai abrir. Preenchido, o link
   do cliente sai sempre certo, não importa de onde você abriu o editor.
   Vazio, o programa usa o endereço da janela aberta — e avisa na tela se
   esse endereço não servir para mandar a ninguém. */
const PUBLIC_BASE_URL = "";

const SUPABASE_URL = "https://iloznrjpiedrohlhrmce.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlsb3pucmpwaWVkcm9obGhybWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NjQxMjUsImV4cCI6MjA5OTM0MDEyNX0.nz8KvP-BIh3Bm6QWj2WjjOWBTLd_lVhaZJewGkwTunA";

const LOGO = "https://i.postimg.cc/k45xbsK4/grosseto.png";
/* Endereço para dúvida do cliente depois do envio. Separado do e-mail de
   reservas de propósito: quem acabou de confirmar escreve para a casa,
   não para a caixa operacional. */
const CONTACT_EMAIL = "hello@tuscanlandstravel.com";

/* Termos publicados no site. Toda order nova já nasce com este endereço,
   e o botão "Usar o padrão" repõe numa order antiga. Deixar em branco
   também é escolha válida: o texto integral dos termos está dentro do
   documento de qualquer jeito, e o link é acréscimo. */
const DEFAULT_TERMS_URL = "https://tuscanlandstravel.com/terms-conditions-tours/";

const COMPANY = {
  legal: "Tuscan Lands di Batistella Maria Fernanda",
  vat: "VAT IT06873750480 · Pontassieve (FI), Italy",
  email: "booking@tuscanlandstravel.com"
};

let sb = null, cfg = {url:SUPABASE_URL, key:SUPABASE_ANON_KEY};
const app = document.getElementById("app");
const el = id => document.getElementById(id);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => "€ " + (Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const nl2br = s => esc(s).replace(/\n/g,"<br>");
/* O endereço dos termos é o mesmo para todas as vendas e serve as duas
   línguas. O campo da order existe para a exceção; quando está vazio,
   vale o padrão. Assim nenhuma order antiga fica com as palavras
   sublinhadas e sem link atrás. */
const termsHref = o => ((o && o.terms_url) || DEFAULT_TERMS_URL || "").trim();

/* Monta o link do cliente. Devolve null quando não há endereço público
   possível — arquivo aberto direto do computador, por exemplo, que geraria
   um caminho que só funciona na máquina de quem copiou. */
function clientLink(token){
  let base = (PUBLIC_BASE_URL||"").trim();
  if(!base){
    if(location.protocol === "file:") return null;
    base = location.origin + location.pathname;
  }
  base = base.replace(/#.*$/,"").trim();
  if(!/\/$|\.html?$/i.test(base)) base += "/";
  return base + "#/confirm/" + token;
}

const stamp = (iso,lang) => iso ? new Date(iso).toLocaleString(lang==="en"?"en-GB":"pt-BR",
  {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";

/* ------------------------------------------------------------ TEXTOS */
const T = {
  pt:{

/*  BOOT                                                                */
/* ==================================================================== */
function makeClient(){
  if(!cfg.url || !cfg.key) return false;
  sb = supabase.createClient(cfg.url, cfg.key);
  return true;
}
function route(){ return (location.hash||"").replace(/^#\/?/,""); }

async function boot(){
  const r = route();
  const isPublic = r.startsWith("confirm/");
  if(!makeClient()){ return renderSetup(isPublic ? r : null); }
  if(isPublic) return renderPublic(r.split("/")[1]);
  const {data} = await sb.auth.getSession();
  if(!data.session) return renderLogin();
  renderApp();
}
window.addEventListener("hashchange", boot);

function renderSetup(){
  app.innerHTML = `
  <div class="gate">
    <div class="mark">TUSCAN LANDS</div>
    <div class="sub">Hub · Configuração</div>
    <div class="stack">
      <div class="msg">Cole a URL e a anon key do projeto Supabase do hub. Para fixar de vez, edite as duas constantes no topo do arquivo.</div>
      <div><label>Supabase URL</label><input id="cfg-url" placeholder="https://xxxx.supabase.co"></div>
      <div><label>Anon key</label><input id="cfg-key" placeholder="eyJ..."></div>
      <button class="btn" id="cfg-go">Conectar</button>
    </div>
  </div>`;
  el("cfg-go").onclick = () => {
    cfg = {url:el("cfg-url").value.trim(), key:el("cfg-key").value.trim()};
    boot();
  };
}

/* ---------------------------------------------------------- LOGIN ---- */
function renderLogin(){
  app.innerHTML = `
  <div class="gate">
    <div class="mark">TUSCAN LANDS</div>
    <div class="sub">Vendas &amp; Operações</div>
    <div class="stack">
      <div><label>E-mail</label><input id="lg-mail" type="email" autocomplete="username"></div>
      <div><label>Senha</label><input id="lg-pass" type="password" autocomplete="current-password"></div>
      <button class="btn" id="lg-go">Entrar</button>
      <div id="lg-msg"></div>
    </div>
  </div>`;
  const go = async () => {
    const btn = el("lg-go"); btn.disabled = true; btn.textContent = "Entrando…";
    const {error} = await sb.auth.signInWithPassword({
      email: el("lg-mail").value.trim(), password: el("lg-pass").value});
    if(error){
      el("lg-msg").innerHTML = `<div class="msg">${esc(error.message)}</div>`;
      btn.disabled = false; btn.textContent = "Entrar"; return;
    }
    renderApp();
  };
  el("lg-go").onclick = go;
  el("lg-pass").onkeydown = e => { if(e.key==="Enter") go(); };
}

function shell(inner, crumb){
  app.innerHTML = `
  <div class="topbar">
    <span class="mark">TUSCAN LANDS</span>
    <span class="sep">·</span><span class="ctx">Vendas &amp; Operações</span>
    ${crumb?`<span class="sep">·</span><span class="ctx">${esc(crumb)}</span>`:""}

  </div>

async function renderApp(){
  shell(`<div class="overline">Orders</div><div class="rule"></div>
    <div id="list-host" class="muted">Carregando…</div>
    <div class="card" style="margin-top:24px;">
      <div class="section-title">Nova order</div>
      <div class="grid3">
        <div><label>Nº da oportunidade (CRM)</label><input id="n-opp" placeholder="TL035-26"></div>
        <div><label>Referência da order</label><input id="n-ref" placeholder="TL035-26.1"></div>
        <div><label>Idioma do documento</label>
          <select id="n-lang"><option value="pt">Português</option><option value="en">English</option></select></div>
      </div>
      <div class="grid2" style="margin-top:12px;">
        <div><label>Agência</label><input id="n-agency" placeholder="Refina Travel"></div>
        <div><label>Cliente final</label><input id="n-client" placeholder="Sobrenome da família"></div>
      </div>
      <button class="btn" id="n-go" style="margin-top:16px;">Criar order</button>
    </div>`);

  el("n-go").onclick = async () => {
    const opp = el("n-opp").value.trim(), ref = el("n-ref").value.trim();
    if(!opp || !ref) return alert("Número da oportunidade e referência são obrigatórios.");
    const {data,error} = await sb.from("ops_orders").insert({
      opportunity_code:opp, order_ref:ref, lang:el("n-lang").value,
      agency:el("n-agency").value.trim(), final_client:el("n-client").value.trim(),
      terms_url: DEFAULT_TERMS_URL
    }).select().single();
    if(error) return alert(error.message);
    // A order nova nasce com os campos de sempre. Ela tira o que não se
    // aplica, que é mais rápido do que remontar a lista a cada venda.
    const padrao = standardFields();
    if(padrao.length) await sb.from("ops_order_fields").insert(
      padrao.map((f,i)=>({order_id:data.id, sort:i, group_key:f.group_key, field_key:f.field_key,
        label_pt:f.label_pt, label_en:f.label_en, input_type:f.input_type,
        options:f.options, required:false, mode:"blank"})));
    openOrder(data.id);
  };

  const {data,error} = await sb.from("ops_orders")
    .select("id,opportunity_code,order_ref,agency,final_client,status,confirmed_at,created_at")
    .order("created_at",{ascending:false});
  const host = el("list-host");
  if(error){ host.innerHTML = `<div class="msg">${esc(error.message)}</div>`; return; }
  if(!data.length){ host.innerHTML = `<div class="muted">Nenhuma order ainda.</div>`; return; }
  host.innerHTML = `<table class="list"><thead><tr>
      <th>Oportunidade</th><th>Referência</th><th>Agência</th><th>Cliente</th><th>Status</th></tr></thead><tbody>
      ${data.map(o=>`<tr data-id="${o.id}">
        <td>${esc(o.opportunity_code)}</td><td>${esc(o.order_ref)}</td>
        <td>${esc(o.agency||"—")}</td><td>${esc(o.final_client||"—")}</td>
        <td><span class="badge ${o.status}">${esc(o.status)}</span></td></tr>`).join("")}
    </tbody></table>`;
  host.querySelectorAll("tr[data-id]").forEach(tr=>tr.onclick=()=>openOrder(tr.dataset.id));
}

async function openOrder(id){
  const [{data:o,error:e1}, {data:it}, {data:pg}, {data:cf}, {data:fl}] = await Promise.all([
    sb.from("ops_orders").select("*").eq("id",id).single(),
    sb.from("ops_order_items").select("*").eq("order_id",id).order("sort"),
    sb.from("ops_order_payments").select("*").eq("order_id",id).order("sort"),
    sb.from("ops_order_confirmations").select("*").eq("order_id",id).order("submitted_at",{ascending:false}),
    sb.from("ops_order_fields").select("*").eq("order_id",id).order("sort")
  ]);
  if(e1) return alert(e1.message);
  ORDER = o; ITEMS = it||[]; PAYS = pg||[]; CONFS = cf||[]; CONF = CONFS[0]||null; FIELDS = fl||[];
  CFG = {
    lead: blockMode(o,"lead"), travellers: blockMode(o,"travellers"),
    travellers_count: travCount(o), passport_names: passportNames(o),
    ack_vehicle: blockMode(o,"ack_vehicle"), remarks: blockMode(o,"remarks"),
    prefill: Object.assign({lead_name:"",lead_email:"",lead_phone:"",travellers:[]}, prefill(o))
  };
  renderEditor();
}

/* --------------------------------------- CONFIGURAÇÃO DO CHECKOUT ---- */
const MODE3 = [["blank","Aparece vazio"],["prefilled","Já preenchido por mim"],["off","Não aparece"]];
const MODE2 = [["on","Aparece"],["off","Não aparece"]];
const TYPES = [["text","Linha de texto"],["textarea","Texto longo"],["number","Número"],
               ["date","Data"],["select","Lista de opções"],["checkbox","Sim / não"]];

function drawConfig(){
  const rows = BLOCKS.map(b=>{
    const cur = CFG[b.k], opts = b.three ? MODE3 : MODE2;
    return `<div class="cfg-row">
      <div class="name">${b.pt}<small>${b.note}</small></div>
      <select onchange="setBlockMode('${b.k}',this.value)">
        ${opts.map(([v,l])=>`<option value="${v}"${cur===v?" selected":""}>${l}</option>`).join("")}
      </select>
    </div>${(b.k==="travellers" && cur!=="off") ? travOptions() : ""}${(b.three && cur==="prefilled") ? fillFor(b.k) : ""}`;
  }).join("");
  el("cfg-host").innerHTML = rows + `
    <div class="cfg-row fixed">
      <div class="name">Aceite dos termos e assinatura digitada
        <small>Aparecem sempre. Sem os dois o envio é recusado pelo banco, não só pela tela.</small></div>
      <div class="muted" style="font-size:11px;">Fixo</div>
    </div>`;
}

/* Quantos viajantes e se o nome precisa bater com o passaporte. A
   quantidade decide quantas linhas a agência vê: pedir "acrescente
   quantos forem" produz lista incompleta, pedir o número exato produz
   conferência. */
/* A quantidade abre as caixas na hora, tanto aqui quanto no checkout da
   agência. Ao diminuir, só some linha vazia: nome já digitado não
   desaparece porque alguém errou o número e corrigiu. */
/* Escolher "já preenchido" precisa abrir as caixas na hora. Sem isto ela
   troca o estado, não vê nada, e conclui que a tela não funciona. */
function setBlockMode(k, v){
  CFG[k] = v;
  if(k==="travellers" && v==="prefilled") return setTravCount(CFG.travellers_count);
  drawConfig();
}

function setTravCount(v){
  const q = Math.max(1, Math.min(30, parseInt(v,10) || 1));
  CFG.travellers_count = q;
  const p = CFG.prefill;
  if(!Array.isArray(p.travellers)) p.travellers = [];
  while(p.travellers.length < q) p.travellers.push({name:"",dob:""});
  while(p.travellers.length > q){
    const ult = p.travellers[p.travellers.length-1];
    if((ult.name||"").trim() || (ult.dob||"").trim()) break;
    p.travellers.pop();
  }
  drawConfig();
  // O redesenho troca o campo por um novo; devolve o foco para ela poder
  // continuar digitando. Campo numérico não aceita setSelectionRange.
  const cx = document.querySelector('.cfg-fill input[type=number]');
  if(cx) cx.focus();
}

function travOptions(){
  return `<div class="cfg-fill"><div class="inner">
    <div class="grid2">
      <div><label>Quantidade de viajantes</label>
        <input type="number" min="1" max="30" value="${CFG.travellers_count}"
          onchange="setTravCount(this.value)" oninput="setTravCount(this.value)"></div>
      <div><label>Nome igual ao passaporte</label>
        <select onchange="CFG.passport_names=(this.value==='sim');drawConfig()">
          <option value="sim"${CFG.passport_names?" selected":""}>Sim — avisa sobre o bilhete de monumento</option>
          <option value="nao"${!CFG.passport_names?" selected":""}>Não — nome usual basta</option>
        </select></div>
    </div>
  </div></div>`;
}

function fillFor(k){
  const p = CFG.prefill;
  if(k==="lead") return `<div class="cfg-fill"><div class="inner"><div class="grid3">
      <div><label>Nome do contato</label><input value="${esc(p.lead_name||"")}" oninput="CFG.prefill.lead_name=this.value"></div>
      <div><label>E-mail</label><input value="${esc(p.lead_email||"")}" oninput="CFG.prefill.lead_email=this.value"></div>
      <div><label>Telefone</label><input value="${esc(p.lead_phone||"")}" oninput="CFG.prefill.lead_phone=this.value"></div>
    </div></div></div>`;
  if(k==="travellers") return `<div class="cfg-fill"><div class="inner">
      <label>Nome e nascimento, como vão para o fornecedor</label>
      ${(p.travellers||[]).map((t,i)=>`<div class="trav-row">
        <input value="${esc(t.name||"")}" oninput="CFG.prefill.travellers[${i}].name=this.value" placeholder="Nome completo">
        <input type="date" value="${esc(t.dob||"")}" oninput="CFG.prefill.travellers[${i}].dob=this.value">
        <button class="iconbtn" onclick="CFG.prefill.travellers.splice(${i},1);drawConfig()">×</button></div>`).join("")}
      <button class="btn ghost sm" onclick="CFG.prefill.travellers.push({name:'',dob:''});drawConfig()">+ Viajante</button>
    </div></div>`;
  return "";
}

/* ------------------------------------------- CAMPOS POR TIPO --------- */
function drawLibOptions(){
  const g = el("fl-grp").value;
  el("fl-key").innerHTML = (FIELD_LIB[g]||[])
    .map(f=>`<option value="${f.k}">${esc(f.pt)}</option>`).join("");
}

function addLibField(){
  const g = el("fl-grp").value, k = el("fl-key").value, def = libLabel(g,k);
  if(!def) return;
  const key = g+"."+k;
  if(FIELDS.some(f=>f.field_key===key)) return alert("Esse campo já está neste checkout.");
  FIELDS.push({field_key:key, group_key:g, label_pt:def.pt, label_en:def.en,
    input_type:def.t, options:def.o||[], required:false, mode:"blank", prefill_value:"", sort:FIELDS.length});
  drawFields();
}

/* Acrescenta o conjunto que ela usa em quase toda venda, sem repetir o
   que já estiver lá. */
function addStandardFields(){
  const tem = new Set(FIELDS.map(f=>f.field_key));
  const novos = standardFields().filter(f=>!tem.has(f.field_key));
  if(!novos.length) return alert("Os campos padrão já estão neste checkout.");
  novos.forEach(f=>{ f.sort = FIELDS.length; FIELDS.push(f); });
  drawFields();
}

function addFreeField(){
  let n = 1;
  while(FIELDS.some(f=>f.field_key==="custom."+n)) n++;
  FIELDS.push({field_key:"custom."+n, group_key:el("fl-grp").value, label_pt:"", label_en:"",
    input_type:"text", options:[], required:false, mode:"blank", prefill_value:"", sort:FIELDS.length});
  drawFields();
}

function prefillControl(f,i){
  if(f.mode!=="prefilled") return `<input disabled placeholder="—">`;
  const set = `oninput="FIELDS[${i}].prefill_value=this.value"`;
  const setc = `onchange="FIELDS[${i}].prefill_value=this.value"`;
  if(f.input_type==="select"){
    return `<select ${setc}><option value="">—</option>${(f.options||[]).map(op=>
      `<option value="${esc(op)}"${f.prefill_value===op?" selected":""}>${esc(op)}</option>`).join("")}</select>`;
  }
  if(f.input_type==="checkbox"){
    return `<select ${setc}>
      <option value="true"${f.prefill_value==="true"?" selected":""}>Sim</option>
      <option value="false"${f.prefill_value!=="true"?" selected":""}>Não</option></select>`;
  }
  if(f.input_type==="textarea") return `<textarea rows="2" ${set}>${esc(f.prefill_value||"")}</textarea>`;
  const t = f.input_type==="number" ? "number" : (f.input_type==="date" ? "date" : "text");
  return `<input type="${t}" value="${esc(f.prefill_value||"")}" ${set}>`;
}

function drawFields(){
  const host = el("fld-host");
  if(!FIELDS.length){
    host.innerHTML = `<div class="muted">Nenhum campo além dos blocos fixos. O checkout sai só com contato,
      passageiros, aceites e assinatura.</div>`;
    return;
  }
  host.innerHTML = `<table class="rows">
    <thead><tr><th>Campo</th><th style="width:120px;">Tipo</th><th style="width:80px;">Obrigatório</th>
      <th style="width:150px;">Estado</th><th style="width:210px;">Valor pré-preenchido</th><th class="x"></th></tr></thead>
    <tbody>${FIELDS.map((f,i)=>`<tr>
      <td>

/* ------------------------------------------- MEXER NA CONFIRMAÇÃO ----
   Teste precisa sair, e agência que mandou o dado errado precisa poder
   mandar de novo. As duas coisas mexem só na resposta, nunca na order:
   apagar a venda inteira para corrigir um nome seria desproporcional.

   Reabrir preserva o que chegou. Se a agência enviar outra vez, entra
   como resposta nova e a anterior fica no histórico — foi ela quem
   assinou aquilo, com data e hora, e isso não se sobrescreve.
   ---------------------------------------------------------------------- */
async function reopenOrder(){
  if(!confirm(`Reabrir ${ORDER.order_ref} para nova resposta?\n\nO link volta a aceitar envio. A resposta atual, de ${CONF.lead_name||"—"} em ${stamp(CONF.submitted_at,"pt")}, continua guardada.`)) return;
  const btn = el("cf-reopen"); btn.disabled = true; btn.textContent = "Reabrindo…";
  const {error} = await sb.from("ops_orders")
    .update({status:"sent", confirmed_at:null, updated_at:new Date().toISOString()})
    .eq("id", ORDER.id);
  if(error){ btn.disabled=false; btn.textContent="Reabrir para nova resposta"; return alert(error.message); }
  openOrder(ORDER.id);
}

async function deleteConfirmation(){
  if(!confirm(`Apagar a resposta de ${CONF.lead_name||"—"}, enviada em ${stamp(CONF.submitted_at,"pt")}?\n\nNão tem desfazer.`)) return;
  const btn = el("cf-del"); btn.disabled = true; btn.textContent = "Apagando…";
  const {error} = await sb.from("ops_order_confirmations").delete().eq("id", CONF.id);
  if(error){ btn.disabled=false; btn.textContent="Apagar esta resposta"; return alert(error.message); }
  // Sem resposta nenhuma, a order não pode continuar dizendo que está
  // confirmada: o status descreveria um fato que deixou de existir.
  if(CONFS.length <= 1){
    await sb.from("ops_orders")
      .update({status:"sent", confirmed_at:null, updated_at:new Date().toISOString()})
      .eq("id", ORDER.id);
  }
  openOrder(ORDER.id);
}

/* ------------------------------------------------------ GRAVAR ------- */
function cfgToJson(){
  const p = CFG.prefill, c = {
    lead: CFG.lead, travellers: CFG.travellers,
    travellers_count: CFG.travellers_count,
    passport_names: !!CFG.passport_names,
    ack_vehicle: CFG.ack_vehicle !== "off",
    remarks: CFG.remarks !== "off",
    prefill: {}
  };
  // Só guarda o pré-preenchido do bloco que está pré-preenchido. Valor
  // órfão de bloco desligado voltaria a aparecer sozinho se ela religasse.
  if(CFG.lead==="prefilled"){
    c.prefill.lead_name = (p.lead_name||"").trim();
    c.prefill.lead_email = (p.lead_email||"").trim();
    c.prefill.lead_phone = (p.lead_phone||"").trim();
  }
  if(CFG.travellers==="prefilled")
    c.prefill.travellers = (p.travellers||[])
      .map(t=>({name:(t.name||"").trim(), dob:(t.dob||"").trim()}))
      .filter(t=>t.name || t.dob);
  return c;
}

async function saveOrder(){
  // Rótulo vazio quebra a coluna not null e sai como campo sem nome para
  // a agência. Barrar aqui é melhor que descobrir pelo erro do banco.
  const semRotulo = FIELDS.findIndex(f=>!(f.label_pt||"").trim());
  if(semRotulo >= 0) return alert("Há campo do checkout sem rótulo em português (linha "+(semRotulo+1)+").");
  const vazio = FIELDS.find(f=>f.mode==="prefilled" && !String(f.prefill_value||"").trim());
  if(vazio) return alert("O campo “"+vazio.label_pt+"” está como já preenchido, mas sem valor. Preencha ou volte para “aparece vazio”.");

  const btn = el("ed-save"); btn.disabled = true; btn.textContent = "Salvando…";
  const patch = {
    opportunity_code: el("f-opp").value.trim(), order_ref: el("f-ref").value.trim(),
    lang: el("f-lang").value, status: el("f-status").value,
    agency: el("f-agency").value.trim(), agency_contact: el("f-contact").value.trim(),
    final_client: el("f-client").value.trim(), pax_summary: el("f-pax").value.trim(),
    travel_window: el("f-window").value.trim(), intro: el("f-intro").value,
    terms_url: el("f-terms").value.trim() || null,
    payment_note: el("f-paynote").value.trim() || null,
    checkout_config: cfgToJson(),
    internal_notes: el("f-notes").value, updated_at: new Date().toISOString()
  };
  const {error:e1} = await sb.from("ops_orders").update(patch).eq("id",ORDER.id);
  await sb.from("ops_order_items").delete().eq("order_id",ORDER.id);
  await sb.from("ops_order_payments").delete().eq("order_id",ORDER.id);
  await sb.from("ops_order_fields").delete().eq("order_id",ORDER.id);
  const {error:e2} = ITEMS.length ? await sb.from("ops_order_items").insert(
    ITEMS.map((r,i)=>({order_id:ORDER.id,sort:i,service_date:r.service_date,title:r.title,details:r.details,price:r.price}))) : {};
  const {error:e3} = PAYS.length ? await sb.from("ops_order_payments").insert(
    PAYS.map((p,i)=>({order_id:ORDER.id,sort:i,label:p.label,due_date:p.due_date,amount:p.amount,status:p.status}))) : {};
  const {error:e4} = FIELDS.length ? await sb.from("ops_order_fields").insert(
    FIELDS.map((f,i)=>({order_id:ORDER.id, sort:i, group_key:f.group_key, field_key:f.field_key,
      label_pt:(f.label_pt||"").trim(), label_en:(f.label_en||"").trim()||null,
      input_type:f.input_type, options:f.options||[], required:!!f.required,
      mode:f.mode, prefill_value: f.mode==="prefilled" ? f.prefill_value : null}))) : {};
  btn.disabled = false; btn.textContent = "Salvar";
  const err = e1||e2||e3||e4;
  if(err) return alert(err.message);
  Object.assign(ORDER, patch);
  btn.textContent = "Salvo";
  setTimeout(()=>btn.textContent="Salvar", 1600);
}

/* ---------------------------------------------------------- EXCLUIR ---
   Teste vira lixo dentro de dois dias, e lixo na lista faz a pessoa
   procurar a order certa entre as erradas. Apagar leva junto serviços,
   parcelas, campos e a confirmação, porque o banco tem cascata: order
   sem os filhos não significaria nada.

   Order confirmada exige confirmação em separado. Ali existe resposta de
   agência, com data e hora, e isso é documento — não pode sair no mesmo
   clique de um rascunho de teste.
   ---------------------------------------------------------------------- */
async function deleteOrder(){
  const o = ORDER, btn = el("ed-del");
  let aviso = `Excluir a order ${o.order_ref}?\n\nSaem junto os serviços, as parcelas e os campos do checkout. Não tem desfazer.`;
  if(CONF) aviso += `\n\nATENÇÃO: esta order tem confirmação recebida de ${CONF.lead_name||"—"} em ${stamp(CONF.submitted_at,"pt")}. Ela será apagada também.`;
  if(!confirm(aviso)) return;
  if(CONF && !confirm(`Confirma apagar a resposta da agência junto com a order ${o.order_ref}?`)) return;

  btn.disabled = true; btn.textContent = "Excluindo…";
  const {error} = await sb.from("ops_orders").delete().eq("id", o.id);
  if(error){ btn.disabled = false; btn.textContent = "Excluir"; return alert(error.message); }
  ORDER = null; ITEMS = []; PAYS = []; CONF = null; FIELDS = [];
  renderApp();
}

/* --------------------------------------------------------- DUPLICAR ---
   Uma proposta que vira duas orders porque cada família paga a sua parte
   é caso comum, e redigitar os mesmos vinte serviços é onde nasce a
   divergência entre as duas — muda o valor numa e esquece na outra.

   Copia o que descreve a venda: cabeçalho, serviços, parcelas,
   observação de pagamento e a configuração inteira do checkout.
   NÃO copia o que é único de cada order: o link, que nasce novo no
   banco, e a confirmação já recebida, que pertence a quem assinou
   aquela. O status volta para rascunho, porque a cópia ainda não foi
   mandada a ninguém.
   ---------------------------------------------------------------------- */
function nextRef(ref){
  // A referência da casa é "oportunidade.sequência": TL035-26.1 vira
  // TL035-26.2. Só o sufixo depois do ponto sobe. Pegar o último número
  // qualquer transformaria TL040-26 em TL040-27, mexendo no ano em vez
  // de criar a segunda order.
  const r = (ref||"").trim();
  const m = /^(.*\.)(\d+)$/.exec(r);
  return m ? m[1] + (parseInt(m[2],10)+1) : (r ? r + ".2" : "");
}

async function duplicateOrder(){
  const btn = el("ed-dup");
  if(!confirm("Duplicar esta order?\n\nVem junto: cabeçalho, serviços, parcelas e a configuração do checkout.\nNão vem: o link do cliente, que nasce novo, e a confirmação já recebida.")) return;
  btn.disabled = true; btn.textContent = "Duplicando…";

  const o = ORDER;
  const {data:novo, error} = await sb.from("ops_orders").insert({
    opportunity_code:o.opportunity_code, order_ref:nextRef(o.order_ref), lang:o.lang,
    status:"draft", agency:o.agency, agency_contact:o.agency_contact,
    final_client:o.final_client, pax_summary:o.pax_summary, travel_window:o.travel_window,
    intro:o.intro, internal_notes:o.internal_notes, terms_url:o.terms_url,
    payment_note:o.payment_note, checkout_config:o.checkout_config
  }).select().single();
  if(error){ btn.disabled=false; btn.textContent="Duplicar"; return alert(error.message); }

  // Os filhos saem do que está gravado, não do que está na tela: se ela
  // editou sem salvar, a cópia leva o gravado, e é isso que o link da
  // order original também mostraria.
  const [{data:it},{data:pg},{data:fl}] = await Promise.all([
    sb.from("ops_order_items").select("*").eq("order_id",o.id).order("sort"),
    sb.from("ops_order_payments").select("*").eq("order_id",o.id).order("sort"),
    sb.from("ops_order_fields").select("*").eq("order_id",o.id).order("sort")
  ]);
  const erros = [];
  if(it && it.length){
    const {error:e} = await sb.from("ops_order_items").insert(it.map((r,i)=>({
      order_id:novo.id, sort:i, service_date:r.service_date, title:r.title,
      details:r.details, price:r.price}))); if(e) erros.push(e.message);
  }
  if(pg && pg.length){
    const {error:e} = await sb.from("ops_order_payments").insert(pg.map((r,i)=>({
      order_id:novo.id, sort:i, label:r.label, due_date:r.due_date,
      amount:r.amount, status:r.status}))); if(e) erros.push(e.message);
  }
  if(fl && fl.length){
    const {error:e} = await sb.from("ops_order_fields").insert(fl.map((r,i)=>({
      order_id:novo.id, sort:i, group_key:r.group_key, field_key:r.field_key,
      label_pt:r.label_pt, label_en:r.label_en, input_type:r.input_type,
      options:r.options, required:r.required, mode:r.mode,
      prefill_value:r.prefill_value}))); if(e) erros.push(e.message);
  }
  btn.disabled = false; btn.textContent = "Duplicar";
  if(erros.length) alert("A cópia foi criada, mas parte do conteúdo não veio:\n"+erros.join("\n"));
  openOrder(novo.id);
}

    </div>
  </div></div>`;

  el("sm-back").onclick = renderEditor;
  el("sm-print").onclick = () => window.print();
}

/* ==================================================================== */
/*  VISTA PÚBLICA — o que o cliente/agência recebe                      */
/* ==================================================================== */
let PUB = null, PAX = [], FLD = {};

async function renderPublic(token){
  app.innerHTML = `<div class="done"><div class="muted">…</div></div>`;
  const {data,error} = await sb.rpc("tl_get_order",{p_token:token});
  if(error || !data) return app.innerHTML = message(T.pt.notFound);
  if(data.expired) return app.innerHTML = message(T.pt.expired);
  PUB = data; PUB.token = token;
  const o = PUB.order, p = prefill(o);

  // Uma linha por viajante, na quantidade que ela definiu. Pré-preenchido
  // é ponto de partida editável, não campo travado: se a agência vir um
  // nome errado, ela precisa poder corrigir na hora.
  const qtd = travCount(o);
  PAX = blockMode(o,"travellers")==="prefilled"
      ? (p.travellers||[]).map(t=>({name:t.name||"", dob:t.dob||""}))
      : [];
  while(PAX.length < qtd) PAX.push({name:"", dob:""});
  FLD = {};
  (PUB.fields||[]).forEach(f=>{
    FLD[f.field_key] = f.mode==="prefilled" ? (f.prefill_value||"") : (f.input_type==="checkbox"?"false":"");
  });
  drawPublic();
}

function message(txt){
  return `<div class="done"><h2>Tuscan Lands</h2><div class="muted">${esc(txt)}</div></div>`;
}

/* Um campo configurado, do jeito que a agência vê. */
function pubField(f, t){
  const lbl = (PUB.order.lang==="en" ? (f.label_en||f.label_pt) : f.label_pt) || f.field_key;
  const v = FLD[f.field_key]||"";
  const k = f.field_key.replace(/'/g,"\\'");
  const set = `oninput="FLD['${k}']=this.value"`;
  const setc = `onchange="FLD['${k}']=this.value"`;
  let input;
  if(f.input_type==="textarea")
    input = `<textarea rows="2" ${set}>${esc(v)}</textarea>`;
  else if(f.input_type==="select")
    input = `<select ${setc}><option value="">—</option>${(f.options||[]).map(op=>
      `<option value="${esc(op)}"${v===op?" selected":""}>${esc(op)}</option>`).join("")}</select>`;
  else if(f.input_type==="checkbox")
    input = `<div class="check" style="margin:0;"><input type="checkbox" id="fx-${esc(f.field_key)}"${v==="true"?" checked":""}
      onchange="FLD['${k}']=this.checked?'true':'false'">
      <label for="fx-${esc(f.field_key)}">${esc(lbl)}${f.required?` <span class="req">· ${t.required}</span>`:""}</label></div>`;
  else
    input = `<input type="${f.input_type==="number"?"number":(f.input_type==="date"?"date":"text")}" value="${esc(v)}" ${set}>`;

  return `<div class="fld">
    ${f.input_type==="checkbox" ? input :
      `<label class="q">${esc(lbl)}${f.required?` <span class="req">· ${t.required}</span>`:""}</label>${input}`}
    ${f.mode==="prefilled"?`<div class="pre">${t.prefilled}</div>`:""}
    ${(PUB.order.lang==="en"?f.help_en:f.help_pt)?`<div class="muted" style="margin-top:3px;">${esc(PUB.order.lang==="en"?f.help_en:f.help_pt)}</div>`:""}
  </div>`;
}

function drawPublic(){
  const o = PUB.order, t = T[o.lang||"pt"], items = PUB.items, pays = PUB.payments;
  const total = items.reduce((s,r)=>s+(Number(r.price)||0),0);
  const confirmed = o.status === "confirmed";
  const p = prefill(o);
  const bLead = blockMode(o,"lead"), bTrav = blockMode(o,"travellers"),
        bVeh = blockMode(o,"ack_vehicle"), bRem = blockMode(o,"remarks");

  // Campos agrupados por tipo de serviço, na ordem em que ela montou.
  let campos = "", grpAtual = null;
  (PUB.fields||[]).forEach(f=>{
    if(f.group_key !== grpAtual){
      grpAtual = f.group_key;
      campos += `<div class="section-title" style="margin-top:22px;">${esc(t.grp[grpAtual]||grpAtual)}</div>`;
    }
    campos += pubField(f, t);
  });

  app.innerHTML = `
  <div class="docpad" style="padding:24px 12px;background:var(--cream);">
  <div class="doc">
    <div class="head">
      <div class="brand">
        <img class="logo-img" src="${LOGO}" alt="Tuscan Lands"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <div class="logo-text" style="display:none;">TUSCAN LANDS</div>
        <div class="contact">${COMPANY.legal}<br>${COMPANY.vat}<br>${COMPANY.email}</div>
      </div>
      <div class="to">
        <div class="lbl">${t.to}</div>
        <div class="val">${esc(o.final_client||o.agency||"")}</div>
        <div class="lbl">${t.ref}</div>
        <div class="val">${esc(o.order_ref)}</div>
      </div>
    </div>

    <h1 class="doctitle">${t.docTitle}</h1>

    <div class="meta">
      <div class="cell"><div class="k">${t.opp}</div><div class="v">${esc(o.opportunity_code)}</div></div>
      <div class="cell"><div class="k">${t.pax}</div><div class="v">${esc(o.pax_summary||"—")}</div></div>
      <div class="cell"><div class="k">${t.period}</div><div class="v">${esc(o.travel_window||"—")}</div></div>
      <div class="cell"><div class="k">${t.status}</div><div class="v">${t.statusVal[o.status]||o.status}</div></div>
    </div>

    ${o.intro?`<div class="intro">${nl2br(o.intro)}</div>`:""}

    <table class="svc">
      <thead><tr><th style="width:100px;">${t.date}</th><th>${t.service}</th><th class="money">${t.price}</th></tr></thead>
      <tbody>${items.map(r=>`<tr>
        <td class="date-cell">${esc(r.service_date||"")}</td>
        <td><div class="svc-title">${esc(r.title)}</div>${r.details?`<div class="svc-sub">${nl2br(r.details)}</div>`:""}</td>
        <td class="money">${eur(r.price)}</td></tr>`).join("")}</tbody>
    </table>

    <div class="total-row"><div class="total-box"><span class="lbl">${t.total}</span><span class="amt">${eur(total)}</span></div></div>

    <div class="voucher-note">${t.voucherNote}</div>

    ${(pays.length || o.payment_note)?`<div style="margin-top:24px;">
      <div class="blocktitle">${t.payTitle}</div>
      ${pays.length?`<table class="pay"><thead><tr><th>${t.payLabel}</th><th>${t.payDue}</th>
        <th style="text-align:right;">${t.payAmount}</th><th style="text-align:right;">${t.payStatus}</th></tr></thead>
      <tbody>${pays.map(p=>`<tr><td>${esc(p.label)}</td><td>${esc(p.due_date||"—")}</td>
        <td class="money">${eur(p.amount)}</td>
        <td class="money">${p.status==="paid"?t.paid:t.pending}</td></tr>`).join("")}</tbody></table>`:""}
      ${o.payment_note?`<div class="pay-note">${nl2br(o.payment_note)}</div>`:""}
    </div>`:""}

    <div class="terms">${TERMS[o.lang||"pt"]}
      ${termsHref(o)?`<div class="terms-link">${t.termsLinkLabel}
        <a href="${esc(termsHref(o))}" target="_blank" rel="noopener">${esc(termsHref(o))}</a></div>`:""}
    </div>

    <div class="foot">
      <div class="co">TUSCAN LANDS TRAVEL</div>
      ${COMPANY.legal} · ${COMPANY.vat.replace(" · Pontassieve (FI), Italy","")} · ${COMPANY.email}
    </div>
  </div>

  ${confirmed ? `
  <div class="confirm-block">
    <h2>${t.alreadyTitle}</h2>
    <div class="rule"></div>
    <div class="muted">${t.alreadyText}</div>
  </div>` : `
  <div class="confirm-block">
    <h2>${t.confirmTitle}</h2>
    <div class="rule"></div>
    ${bTrav!=="off"?`<div class="muted" style="margin-bottom:20px;">${t.travIntro}${
      passportNames(o)?` <b>${t.passportNote}</b>`:""}</div>`:""}

    ${bTrav!=="off"?`
    <div class="section-title">${t.travellers} <span class="req">· ${t.required}</span></div>
    <div id="tv-host" style="margin-bottom:8px;"></div>
    <button class="btn ghost sm" id="tv-add" style="margin-bottom:22px;">${t.addTraveller}</button>`:""}

    ${bLead!=="off"?`
    <div class="section-title">${t.lead}</div>
    <div class="muted" style="margin-bottom:12px;">${t.leadIntro}</div>
    <div class="grid3 fieldrow" style="margin-bottom:20px;">
      <div><label>${t.leadName} <span class="req">· ${t.required}</span></label>
        <input id="c-name" value="${bLead==="prefilled"?esc(p.lead_name||""):""}"></div>
      <div><label>${t.leadPhone} <span class="req">· ${t.required}</span></label>
        <input id="c-phone" value="${bLead==="prefilled"?esc(p.lead_phone||""):""}"></div>
      <div><label>${t.leadEmail}</label>
        <input id="c-mail" type="email" value="${bLead==="prefilled"?esc(p.lead_email||""):""}"></div>
    </div>
    ${bLead==="prefilled"?`<div style="margin:-14px 0 20px;font-size:11.5px;color:var(--copper);
      line-height:1.5;">${t.prefilled}</div>`:""}`:""}

    ${campos}

    <div style="margin-top:24px;"></div>
    ${bVeh!=="off"?`<div class="check"><input type="checkbox" id="c-veh">
      <label for="c-veh">${t.ackVehicle} <span class="req">· ${t.required}</span></label></div>`:""}
    <div class="check"><input type="checkbox" id="c-terms">
      <span id="c-terms-txt" class="checktext">${t.ackPre}${termsHref(o)
        ? `<a href="${esc(termsHref(o))}" target="_blank" rel="noopener">${t.ackLink}</a>`
        : `<u>${t.ackLink}</u>`}${t.ackPost}</span></div>

    ${bRem!=="off"?`<div style="margin-top:16px;"><label>${t.remarks}</label><textarea id="c-rem" rows="3"></textarea></div>`:""}

    <div id="c-msg" style="margin-top:14px;"></div>
    <button class="btn" id="c-go" style="margin-top:16px;">${t.submit}</button>
  </div>`}
  </div>`;

  if(confirmed) return;
  drawPax();
  if(el("tv-add")) el("tv-add").onclick = () => { PAX.push({name:"",dob:""}); drawPax(); };
  // O texto do aceite deixou de ser <label for>: dentro de um label, o
  // clique no link era engolido pelo próprio label, que só marcava a
  // caixa. O link não abria e não havia nada na tela explicando por quê.
  // Agora o texto marca a caixa e o link abre, cada um no seu clique.
  const txt = el("c-terms-txt");
  if(txt) txt.onclick = e => {
    if(e.target.closest("a")) return;
    const c = el("c-terms"); c.checked = !c.checked;
  };
  el("c-go").onclick = submitConfirmation;
}

function drawPax(){
  const t = T[PUB.order.lang||"pt"], host = el("tv-host");
  if(!host) return;
  host.innerHTML = `<div class="trav-head"><span>${t.travName}</span><span>${t.travDob}</span><span></span></div>` +
    PAX.map((tv,i)=>`<div class="trav-row">
      <input value="${esc(tv.name)}" placeholder="${t.travName}" oninput="PAX[${i}].name=this.value">
      <input type="date" value="${esc(tv.dob)}" oninput="PAX[${i}].dob=this.value">
      ${PAX.length>1?`<button class="iconbtn" onclick="PAX.splice(${i},1);drawPax()">×</button>`:`<span></span>`}
    </div>`).join("");
}

async function submitConfirmation(){
  const o = PUB.order, t = T[o.lang||"pt"];
  const val = id => el(id) ? el(id).value.trim() : "";
  const chk = id => el(id) ? el(id).checked : false;
  const payload = {
    lead_name: val("c-name"), lead_email: val("c-mail"), lead_phone: val("c-phone"),
    travellers: PAX.map(t=>({name:(t.name||"").trim(), dob:(t.dob||"").trim()}))
                   .filter(t=>t.name || t.dob),
    ack_vehicle: chk("c-veh"), ack_terms: chk("c-terms"),
    remarks: val("c-rem"),
    field_values: FLD
  };
  // A tela confere primeiro para dar resposta imediata; a palavra final é
  // do banco, que confere de novo e recusa o que estiver faltando.
  const falta = [];
  if(!payload.ack_terms) falta.push(t.miss.ack_terms);
  if(blockMode(o,"ack_vehicle")!=="off" && !payload.ack_vehicle) falta.push(t.miss.ack_vehicle);
  if(blockMode(o,"lead")!=="off"){
    if(!payload.lead_name)  falta.push(t.miss.lead_name);
    if(!payload.lead_phone) falta.push(t.miss.lead_phone);
  }
  if(blockMode(o,"travellers")!=="off"){
    if(!payload.travellers.length) falta.push(t.miss.travellers);
    PAX.forEach((tv,i)=>{
      if(!(tv.name||"").trim()) falta.push(`${t.travName} ${i+1}`);
      if(!(tv.dob ||"").trim()) falta.push(`${t.travDob} ${i+1}`);
    });
  }
  (PUB.fields||[]).forEach(f=>{
    if(!f.required) return;
    const v = String(FLD[f.field_key]||"").trim();
    if(!v || (f.input_type==="checkbox" && v!=="true"))
      falta.push((o.lang==="en" ? (f.label_en||f.label_pt) : f.label_pt) || f.field_key);
  });
  if(falta.length){
    el("c-msg").innerHTML = `<div class="msg">${t.errMissing} ${esc(falta.join(" · "))}</div>`;
    return;
  }

  const btn = el("c-go"); btn.disabled = true; btn.textContent = t.sending;
  const {data,error} = await sb.rpc("tl_submit_confirmation",{p_token:PUB.token, p_payload:payload});
  if(error || !data || !data.ok){
    let txt = (error&&error.message) || (data&&data.error) || "erro";
    if(data && data.error==="missing_fields" && data.missing)
      txt = t.errMissing+" "+data.missing.map(m=>{
        const linha = /^traveller_(name|dob)_(\d+)$/.exec(m);
        if(linha) return (linha[1]==="name"?t.travName:t.travDob)+" "+linha[2];
        return t.miss[m]||m;
      }).join(" · ");
    if(data && data.error==="already_confirmed") txt = t.alreadyText;
    if(data && data.error==="expired") txt = t.expired;
    el("c-msg").innerHTML = `<div class="msg">${esc(txt)}</div>`;
    btn.disabled = false; btn.textContent = t.submit; return;
  }
  app.innerHTML = `<div class="done">
    <h2>${t.doneTitle}</h2>
    <div class="rule" style="margin:0 auto 18px;"></div>
    <div class="muted" style="font-size:14px;">${t.doneText}</div>
    <div class="muted" style="margin-top:14px;">${t.doneHelp}
      <a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a></div>
  </div>`;
}

boot();
</script>
