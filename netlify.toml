# O hub continua sendo um arquivo só, servido da raiz. O que entra aqui
# é uma função à parte, que só existe para desenhar o PDF da proposta.
[build]
  publish = "."
  functions = "netlify/functions"

# O pacote do Chromium é montado para o runtime novo da Lambda. Sem
# fixar aqui, a função pode subir num runtime antigo e o binário não
# acha as bibliotecas dele.
[build.environment]
  NODE_VERSION = "20"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[functions]
  node_bundler = "esbuild"

# O Chromium é pesado e não pode ser empacotado junto: vem do pacote
# externo, que a própria função baixa na primeira chamada.
[functions."proposta-pdf"]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]
  included_files = []

# A proforma usa o mesmo Chromium: o pacote é externo, não empacotado.
[functions."proforma-pdf"]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]
  included_files = []


# A página da viagem para o cliente (vouchers, voos, hotéis, restaurantes e o .ics) mora no
# CRM, em crm-tuscanlands.netlify.app/api/viagem/<chave>. Pedido dela, 13/11/26: o link que o
# cliente recebe fica no domínio da casa. O hub só repassa; quem monta a página é o CRM.
[[redirects]]
  from = "/viagem/*"
  to = "https://crm-tuscanlands.netlify.app/api/viagem/:splat"
  status = 200
  force = true
